<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CISO Security Report</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        /*
         * FONT SCALE — 6 sizes only
         * XL  1.5rem  (24px)  KPI numbers
         * L   1.1rem  (18px)  Report title
         * M   0.85rem (14px)  Section headers, card titles, callout titles
         * S   0.75rem (12px)  Body, tables, descriptions, sidebar values
         * XS  0.65rem (10px)  Mono data, table headers, KPI labels, sidebar labels
         * XXS 0.55rem (9px)   Footer, badges, pills
         */
        :root {
            --fs-xl: 1.5rem;
            --fs-l: 1.1rem;
            --fs-m: 0.85rem;
            --fs-s: 0.75rem;
            --fs-xs: 0.65rem;
            --fs-xxs: 0.55rem;

            --bg: #f4f5f7;
            --surface: #fff;
            --alt: #fafbfc;
            --border: #e4e7ec;
            --blt: #eef0f4;
            --bar: #283248;
            --bartx: rgba(255, 255, 255, .85);
            --barmuted: rgba(255, 255, 255, .45);
            --frog: #40be46;
            --flt: #e8f8e9;
            --fdk: #2d8a32;
            --tx: #1a2b4a;
            --tx2: #5a6a82;
            --muted: #8f9bb3;
            --crit: #c0560a;
            --critbg: #fff4e6;
            --high: #d4910a;
            --highbg: #fef9e7;
            --med: #b8a000;
            --medbg: #fefce8;
            --low: #7890a0;
            --lowbg: #f0f4f8;
            --blue: #4a8af0;
            --amber: #d4910a;
            --amberbg: #fef9e7;
            --r: 8px;
            --sh: 0 1px 3px rgba(26, 43, 74, .06)
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: var(--bg);
            color: var(--tx);
            line-height: 1.55;
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased
        }

        .side {
            width: 220px;
            background: var(--bar);
            flex-shrink: 0;
            padding: 1.1rem 1rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto
        }

        .side svg {
            width: 40px;
            height: 40px;
            margin-bottom: .8rem
        }

        .ss {
            border-top: 1px solid rgba(255, 255, 255, .08);
            padding: .6rem 0
        }

        .ss:first-of-type {
            border-top: none
        }

        .sl {
            font-size: var(--fs-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--barmuted);
            margin-bottom: .15rem
        }

        .sv {
            font-size: var(--fs-s);
            color: var(--bartx);
            font-weight: 600;
            line-height: 1.4
        }

        .sv a {
            color: var(--frog);
            text-decoration: none
        }

        .sd {
            font-size: var(--fs-xs);
            color: var(--barmuted);
            line-height: 1.35;
            margin-top: .08rem
        }

        .sw {
            color: var(--amber);
            font-size: var(--fs-xs);
            font-weight: 600
        }

        .sp {
            display: inline-block;
            font-size: var(--fs-xxs);
            padding: .1rem .3rem;
            border-radius: 3px;
            font-weight: 600;
            margin: .1rem .15rem .1rem 0
        }

        .sp.on {
            background: rgba(64, 190, 70, .15);
            color: var(--frog)
        }

        .sp.off {
            background: rgba(212, 145, 10, .12);
            color: var(--amber)
        }

        .main {
            flex: 1;
            overflow-y: auto;
            padding: 1.4rem 2rem 3rem
        }

        .wrap {
            max-width: 1080px
        }

        .sec {
            font-size: var(--fs-m);
            font-weight: 700;
            margin: 1.6rem 0 .5rem;
            border-left: 3px solid var(--frog);
            padding-left: .55rem
        }

        .sec.red {
            border-color: var(--crit)
        }

        .sec.orange {
            border-color: var(--high)
        }

        .sec.blue {
            border-color: var(--blue)
        }

        .sec.amber {
            border-color: var(--amber)
        }

        p.sub {
            font-size: var(--fs-s);
            color: var(--tx2);
            margin-bottom: .5rem
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: .6rem
        }

        .kpi {
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: 3px solid var(--muted);
            border-radius: var(--r);
            padding: .65rem .75rem;
            box-shadow: var(--sh);
            text-align: center
        }

        .kpi.red {
            border-top-color: var(--crit)
        }

        .kpi.green {
            border-top-color: var(--frog)
        }

        .kpi.orange {
            border-top-color: var(--high)
        }

        .kpi.gray {
            border-top-color: var(--muted)
        }

        .kpi-n {
            font-family: 'IBM Plex Mono', monospace;
            font-size: var(--fs-xl);
            font-weight: 700;
            line-height: 1.1
        }

        .kpi-l {
            font-size: var(--fs-xxs);
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .03em;
            margin-top: .1rem
        }

        .kpi-d {
            font-family: 'IBM Plex Mono', monospace;
            font-size: var(--fs-xxs);
            font-weight: 600;
            margin-top: .1rem;
            display: inline-block;
            padding: .05rem .25rem;
            border-radius: 3px
        }

        .good {
            background: var(--flt);
            color: var(--fdk)
        }

        .bad {
            background: var(--critbg);
            color: var(--crit)
        }

        .nums {
            display: flex;
            gap: .4rem;
            flex-wrap: wrap;
            margin: .45rem 0
        }

        .nb {
            padding: .3rem .6rem;
            border-radius: var(--r);
            font-size: var(--fs-s);
            font-weight: 600;
            border: 1px solid var(--border);
            background: var(--surface)
        }

        .nb strong {
            font-family: 'IBM Plex Mono', monospace;
            font-size: var(--fs-m);
            margin-right: .2rem
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .85rem;
            box-shadow: var(--sh);
            margin-top: .5rem
        }

        .ch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: .45rem
        }

        .ct {
            font-size: var(--fs-m);
            font-weight: 700
        }

        .cs {
            font-size: var(--fs-xxs);
            color: var(--muted)
        }

        .g2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .6rem
        }

        table.dt {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--fs-s)
        }

        .dt th {
            font-size: var(--fs-xxs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--muted);
            text-align: left;
            padding: .35rem .45rem;
            border-bottom: 2px solid var(--border);
            background: var(--alt)
        }

        .dt td {
            padding: .35rem .45rem;
            border-bottom: 1px solid var(--blt)
        }

        .dt tbody tr:hover td {
            background: var(--alt)
        }

        .dt .num {
            text-align: right;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600
        }

        .mono {
            font-family: 'IBM Plex Mono', monospace;
            font-size: var(--fs-xs)
        }

        .badge {
            font-size: var(--fs-xxs);
            font-weight: 600;
            padding: .1rem .35rem;
            border-radius: 3px;
            display: inline-block
        }

        .b-crit {
            background: var(--critbg);
            color: var(--crit)
        }

        .b-high {
            background: var(--highbg);
            color: var(--high)
        }

        .b-med {
            background: var(--medbg);
            color: #9a7b00
        }

        .b-low {
            background: var(--lowbg);
            color: var(--low)
        }

        .b-block {
            background: var(--critbg);
            color: var(--crit)
        }

        .b-pass {
            background: var(--flt);
            color: var(--fdk)
        }

        .dist {
            height: 10px;
            display: flex;
            border-radius: 5px;
            overflow: hidden;
            margin: .35rem 0
        }

        .dist span {
            height: 100%
        }

        .sevr {
            display: flex;
            align-items: center;
            gap: .35rem;
            padding: .2rem 0;
            font-size: var(--fs-s)
        }

        .sevr .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0
        }

        .sevr .lbl {
            flex: 1;
            color: var(--tx2)
        }

        .sevr .cnt {
            font-weight: 600;
            font-family: 'IBM Plex Mono', monospace
        }

        .callout {
            border-left: 4px solid var(--frog);
            background: var(--flt);
            border-radius: 0 var(--r) var(--r) 0;
            padding: .55rem .8rem;
            margin: .5rem 0;
            font-size: var(--fs-s);
            line-height: 1.5
        }

        .callout.warn {
            border-color: var(--amber);
            background: var(--amberbg)
        }

        .callout.risk {
            border-color: var(--crit);
            background: var(--critbg)
        }

        .callout strong {
            display: block;
            margin-bottom: .1rem;
            font-size: var(--fs-m)
        }

        .ben {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .8rem;
            box-shadow: var(--sh)
        }

        .ben.gl {
            border-left: 4px solid var(--frog)
        }

        .ben.bl {
            border-left: 4px solid var(--blue)
        }

        .ben-t {
            font-size: var(--fs-m);
            font-weight: 700;
            margin-bottom: .3rem
        }

        .ben-h {
            font-size: var(--fs-m);
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: .4rem
        }

        .ben-s {
            display: flex;
            gap: .3rem;
            flex-wrap: wrap
        }

        .bs {
            text-align: center;
            flex: 1;
            min-width: 55px;
            padding: .25rem;
            background: var(--alt);
            border-radius: var(--r);
            border: 1px solid var(--blt)
        }

        .bs-v {
            font-family: 'IBM Plex Mono', monospace;
            font-size: var(--fs-m);
            font-weight: 700
        }

        .bs-l {
            font-size: var(--fs-xxs);
            color: var(--muted)
        }

        .cmp {
            background: var(--flt);
            border-left: 4px solid var(--frog);
            border-radius: 0 var(--r) var(--r) 0;
            padding: .4rem .7rem;
            font-size: var(--fs-m);
            font-weight: 500;
            margin-top: .45rem
        }

        .rec {
            counter-reset: rec
        }

        .rec-i {
            counter-increment: rec;
            margin-bottom: .55rem;
            padding-left: 1.4rem;
            position: relative;
            font-size: var(--fs-m);
            line-height: 1.5
        }

        .rec-i::before {
            content: counter(rec)".";
            position: absolute;
            left: 0;
            font-weight: 700;
            color: var(--frog)
        }

        .rec-i strong {
            display: block;
            font-size: var(--fs-m)
        }

        .ui-link {
            font-size: var(--fs-s);
            color: var(--tx2);
            margin-top: .35rem;
            padding: .35rem .55rem;
            background: var(--alt);
            border: 1px solid var(--border);
            border-radius: var(--r);
            display: inline-block
        }

        .ui-link a {
            color: var(--frog);
            font-weight: 600;
            text-decoration: none
        }

        .footer {
            font-size: var(--fs-xxs);
            color: var(--muted);
            padding: .8rem 0 0;
            margin-top: 1.2rem;
            border-top: 1px solid var(--border)
        }

        .exec-summary {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 4px solid var(--frog);
            border-radius: var(--r);
            padding: .85rem 1rem;
            margin: .8rem 0;
            box-shadow: var(--sh)
        }

        .exec-summary .es-title {
            font-size: var(--fs-m);
            font-weight: 700;
            margin-bottom: .35rem
        }

        .exec-summary .es-text {
            font-size: var(--fs-s);
            line-height: 1.6;
            color: var(--tx2)
        }

        .pri {
            display: inline-block;
            font-size: var(--fs-xxs);
            font-weight: 700;
            padding: .1rem .4rem;
            border-radius: 3px;
            margin-right: .3rem;
            vertical-align: middle
        }

        .pri.p1 {
            background: var(--critbg);
            color: var(--crit)
        }

        .pri.p2 {
            background: var(--highbg);
            color: var(--high)
        }

        .pri.p3 {
            background: var(--lowbg);
            color: var(--low)
        }

        .report-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.2rem;
            padding-bottom: .8rem;
            border-bottom: 2px solid var(--border)
        }

        .report-header svg {
            width: 80px;
            height: auto;
            flex-shrink: 0
        }

        .report-header-text {
            flex: 1
        }

        .report-header-text h1 {
            font-size: var(--fs-l);
            font-weight: 800;
            color: var(--tx);
            line-height: 1.2;
            margin: 0
        }

        .report-header-text h1 span {
            color: var(--frog)
        }

        .report-header-text .report-period {
            font-size: var(--fs-s);
            color: var(--tx2);
            margin-top: .15rem
        }

        @media(max-width:900px) {
            .kpis {
                grid-template-columns: repeat(3, 1fr)
            }

            .g2 {
                grid-template-columns: 1fr
            }

            .side {
                width: 180px
            }
        }
    </style>
</head>

        /* ═══ HELPERS ═══ */

        const h = (tag, cls, html) => {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (html !== undefined) e.innerHTML = html;
            return e;
        };

        const n = v => typeof v === 'number' ? v.toLocaleString() : (v || '0');
        const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;

        const sevColor = s => ({
            Critical: 'var(--crit)',
            High: 'var(--high)',
            Medium: 'var(--med)',
            Low: 'var(--low)'
        }[s] || 'var(--muted)');

        const sevBg = s => ({
            Critical: 'var(--critbg)',
            High: 'var(--highbg)',
            Medium: 'var(--medbg)',
            Low: 'var(--lowbg)'
        }[s] || 'var(--alt)');

        function getMethodology() {
            const m = DATA.methodology || {};
            const risk = m.risk_score || {};
            const weights = risk.weights || { critical: 100, high: 20, medium: 5, low: 1 };
            const bands = risk.bands || [
                { min: 0, max: 15, label: 'Low weighted exposure', signal: 'Good' },
                { min: 15, max: 35, label: 'Moderate weighted exposure', signal: 'Watch trend' },
                { min: 35, max: 60, label: 'High weighted exposure', signal: 'Bad' },
                { min: 60, max: null, label: 'Critical weighted exposure', signal: 'Very bad' }
            ];
            const severity = m.severity_levels || {
                critical: {
                    meaning: 'Exploit likely or high-impact compromise path.',
                    signal: 'Bad when rising. Best when near zero.'
                },
                high: {
                    meaning: 'Serious weakness requiring near-term remediation.',
                    signal: 'Bad when sustained or rising.'
                },
                medium: {
                    meaning: 'Meaningful risk with lower immediate blast radius.',
                    signal: 'Neutral-to-bad if backlog accumulates.'
                },
                low: {
                    meaning: 'Limited immediate impact; monitor and batch-fix.',
                    signal: 'Generally acceptable if higher severities are controlled.'
                }
            };
            const repoRiskLevels = m.repo_watch_risk_levels || [
                { level: 'critical', rule: 'Repository has critical findings and no watch coverage.' },
                { level: 'high', rule: 'Repository has critical findings or high violation volume.' },
                { level: 'medium', rule: 'Repository has violations, or is indexed with zero watches.' },
                { level: 'low', rule: 'No significant findings and covered.' }
            ];
            const curationActions = m.curation_actions || {
                blocked: 'Denied by policy.',
                approved: 'Explicit override approval.',
                passed: 'Evaluated and allowed because no blocking rule matched.'
            };
            return { weights, bands, severity, repoRiskLevels, curationActions };
        }

        /* ═══ SIDEBAR ═══ */

        function sideItem(label, value, detail, warn) {
            return `<div class="ss">
                <div class="sl">${label}</div>
                <div class="sv">${warn ? `<span class="sw">${value}</span>` : value}</div>
                ${detail ? `<div class="sd">${detail}</div>` : ''}
            </div>`;
        }

        function buildSidebar() {
            const m = DATA.meta, p = DATA.platform;
            let s = FROG_SVG;

            s += sideItem('Platform URL',
                `<a href="${m.url}">${m.host}</a>`);

            s += sideItem('Watches',
                `${n(p.watches_total)} total · ${n(p.watches_active)} active`);

            s += sideItem('Policies',
                `${n(p.policies_total)} total`,
                `${n(p.policies_security)} security · ${n(p.policies_operational)} operational · ${n(p.policies_license)} license`);

            s += sideItem('Curation Status',
                p.curation_enabled ? 'Enabled' : 'Not configured',
                p.curation_enabled ? `${n(p.curation_repos_count)} remote repos curated` : null,
                !p.curation_enabled);

            s += sideItem('Curation Policies',
                p.curation_enabled
                    ? `Global: ${n(p.curation_policies_global)} · Repo: ${n(p.curation_policies_repo)} · User: ${n(p.curation_policies_user)}`
                    : 'Not configured',
                null,
                !p.curation_enabled);

            let pills = '';
            (p.curated_types || []).forEach(t => pills += `<span class="sp on">${t}</span>`);
            (p.uncurated_types || []).forEach(t => pills += `<span class="sp off">${t}</span>`);

            s += sideItem('Xray Indexed',
                `${n(p.repos_indexed)} of ${n(p.repos_total)} repos`,
                pills);

            s += sideItem('Report Period',
                `${m.date_from} – ${m.date_to}`,
                `${m.report_type} (${m.window_days} days)`);

            s += sideItem('Generated', m.generated);

            document.getElementById('sidebar').innerHTML = s;
            document.title = `CISO Report — ${m.server_id} — ${m.generated}`;
        }

        /* ═══ COMPARISON DELTA BADGES ═══ */

        function delta(metrics, label) {
            if (!DATA.comparison || !DATA.comparison.available) return '';
            const m = (DATA.comparison.metrics || []).find(x => x.label === label);
            if (!m) return '';
            const cls = m.good ? 'good' : 'bad';
            const arrow = m.direction === 'down' ? '↓' : m.direction === 'up' ? '↑' : '—';
            return `<div class="kpi-d ${cls}">${arrow} ${Math.abs(m.change_pct)}% vs last</div>`;
        }

        /* ═══ REPORT HEADER ═══ */

        function buildHeader() {
            const m = DATA.meta;
            return `
                <div class="report-header">
                    ${FROG_SVG}
                    <div class="report-header-text">
                        <h1><span>${m.report_type}</span> Report for <span>${m.server_id}</span></h1>
                        <div class="report-period">${m.date_from} – ${m.date_to}</div>
                    </div>
                </div>`;
        }

        /* ═══ EXECUTIVE SUMMARY ═══ */

        function buildExecutiveSummary() {
            const c = DATA.curation, v = DATA.violations, m = DATA.meta, b = DATA.benefit;
            let lines = [];

            if (c.available && c.blocked > 0) {
                lines.push(`Curation blocked ${n(c.blocked)} packages at the gate before they could enter your repositories.`);
            }

            if (v.total > 0) {
                lines.push(`Xray surfaced ${n(v.total)} violations across indexed repositories, including ${n(v.by_severity.critical)} critical findings.`);
            }

            if (v.critical_issues && v.critical_issues.length > 0) {
                const top = v.critical_issues[0];
                lines.push(`The most recurring critical issue is ${top.id} affecting ${n(top.hits)} artifacts.`);
            }

            if (c.available && c.blocked === 0 && v.total === 0) {
                lines.push('No threats were blocked or detected during this reporting period.');
            }

            return `
                <div class="exec-summary">
                    <div class="es-title">Executive Summary</div>
                    <div class="es-text">${lines.join(' ')}</div>
                </div>`;
        }

        /* ═══ SECTION 1: EXECUTIVE KPIs ═══ */

        function buildKPIs() {
            const c = DATA.curation, v = DATA.violations;
            return `
                <p class="sub">At-a-glance numbers showing how many packages were evaluated by Curation and what Xray found inside your repositories this period.</p>
                <div class="kpis">
                    <div class="kpi gray">
                        <div class="kpi-n">${n(c.total)}</div>
                        <div class="kpi-l">Packages Evaluated</div>
                    </div>
                    <div class="kpi red">
                        <div class="kpi-n" style="color:var(--crit)">${n(c.blocked)}</div>
                        <div class="kpi-l">Blocked at the Gate</div>
                        ${delta(null, 'Packages Blocked')}
                    </div>
                    <div class="kpi green">
                        <div class="kpi-n" style="color:var(--fdk)">${n(c.approved)}</div>
                        <div class="kpi-l">Approved Overrides</div>
                    </div>
                    <div class="kpi gray">
                        <div class="kpi-n">${n(c.passed)}</div>
                        <div class="kpi-l">Passed by Policy</div>
                    </div>
                    <div class="kpi orange">
                        <div class="kpi-n" style="color:var(--high)">${n(v.total)}</div>
                        <div class="kpi-l">Threats Found Inside</div>
                        ${delta(null, 'Violations')}
                    </div>
                    <div class="kpi red">
                        <div class="kpi-n" style="color:var(--crit)">${n(v.by_severity.critical)}</div>
                        <div class="kpi-l">Critical Findings</div>
                        ${delta(null, 'Critical')}
                    </div>
                    <div class="kpi orange">
                        <div class="kpi-n" style="color:var(--high)">${n(v.risk_score)}</div>
                        <div class="kpi-l">Risk Score</div>
                        ${delta(null, 'Risk Score')}
                    </div>
                </div>`;
        }

        function buildScoringGuide() {
            const m = getMethodology();
            const bandRows = (m.bands || []).map(b => {
                const range = b.max === null || b.max === undefined ? `${b.min}+` : `${b.min}-${b.max}`;
                return `<tr><td class="mono">${range}</td><td>${b.label}</td><td>${b.signal}</td></tr>`;
            }).join('');

            return `
                <div class="sec blue">Severity and Risk Method</div>
                <p class="sub">How to read Critical/High/Medium/Low, risk score, and what counts as good or bad.</p>
                <div class="g2">
                    <div class="card">
                        <div class="ch"><span class="ct">Violation Severity (Xray)</span></div>
                        <table class="dt">
                            <thead><tr><th>Level</th><th>Meaning</th><th>Good/Bad Signal</th></tr></thead>
                            <tbody>
                                <tr><td><span class="badge b-crit">Critical</span></td><td>${m.severity.critical.meaning}</td><td>${m.severity.critical.signal}</td></tr>
                                <tr><td><span class="badge b-high">High</span></td><td>${m.severity.high.meaning}</td><td>${m.severity.high.signal}</td></tr>
                                <tr><td><span class="badge b-med">Medium</span></td><td>${m.severity.medium.meaning}</td><td>${m.severity.medium.signal}</td></tr>
                                <tr><td><span class="badge b-low">Low</span></td><td>${m.severity.low.meaning}</td><td>${m.severity.low.signal}</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card">
                        <div class="ch"><span class="ct">Risk Score and Health Bands</span></div>
                        <p class="sub">Risk score is normalized to 0-100 from severity mix and volume:</p>
                        <div class="mono" style="margin:.25rem 0 .5rem">raw = (Critical*${m.weights.critical}) + (High*${m.weights.high}) + (Medium*${m.weights.medium}) + (Low*${m.weights.low})</div>
                        <div class="mono" style="margin:.25rem 0 .6rem">risk_score = (raw / (total_violations*100)) * 100</div>
                        <table class="dt">
                            <thead><tr><th>Band</th><th>Interpretation</th><th>Signal</th></tr></thead>
                            <tbody>${bandRows}</tbody>
                        </table>
                    </div>
                </div>
                <div class="callout warn"><strong>Curation interpretation</strong><span class="mono">Blocked</span> = ${m.curationActions.blocked} <span class="mono">Approved</span> = ${m.curationActions.approved} <span class="mono">Passed</span> = ${m.curationActions.passed} Higher blocked can mean stronger prevention or higher attack pressure; interpret with block rate and top blocked packages.</div>`;
        }

        /* ═══ SECTION 2: CURATION — SUPPLY CHAIN DEFENSE ═══ */

        function buildCuration() {
            const c = DATA.curation, m = DATA.meta;

            if (!c.available) {
                return `
                    <div class="sec">Curation — Supply Chain Defense</div>
                    <p class="sub">Curation screens every package download before it enters your repositories, blocking known threats at the gate.</p>
                    <div class="callout warn">
                        <strong>Unavailable</strong>
                        Curation audit data was unavailable on this instance. Curation may not be configured or the token lacks the required permission. Contact your JFrog administrator.
                    </div>`;
            }

            let html = `
                <div class="sec">Curation — Supply Chain Defense</div>
                <p class="sub">Curation screens every package download before it enters your repositories, blocking known threats at the gate. Period: ${m.date_from} – ${m.date_to}.</p>
                <div class="nums">
                    <div class="nb"><strong style="color:var(--crit)">${n(c.blocked)}</strong> Blocked</div>
                    <div class="nb"><strong style="color:var(--fdk)">${n(c.approved)}</strong> Approved</div>
                    <div class="nb"><strong>${n(c.passed)}</strong> Passed</div>
                    <div class="nb"><strong style="color:#b71c1c">${n(c.by_reason.malicious)}</strong> Malicious</div>
                    <div class="nb"><strong style="color:var(--high)">${n(c.by_reason.security)}</strong> Security (CVE)</div>
                    <div class="nb"><strong style="color:var(--amber)">${n(c.by_reason.license)}</strong> License</div>
                    <div class="nb"><strong>${n(c.by_reason.operational)}</strong> Operational</div>
                    <div class="nb"><strong>${c.block_rate}%</strong> Block Rate</div>
                </div>`;

            if (c.top_blocked && c.top_blocked.length > 0) {
                /* Blocked by ecosystem */
                if (c.by_type && c.by_type.length > 0) {
                    const totalBlocked = c.by_type.reduce((s, t) => s + t.blocked, 0);
                    let ecoRows = c.by_type.filter(t => t.blocked > 0).map(t =>
                        `<tr>
                            <td>${t.type}</td>
                            <td class="num">${n(t.blocked)}</td>
                            <td class="num">${totalBlocked > 0 ? Math.round(t.blocked / totalBlocked * 100) : 0}%</td>
                            <td class="num">${n(t.total)}</td>
                        </tr>`
                    ).join('');
                    html += `
                        <div class="card">
                            <div class="ch"><span class="ct">Blocked Requests by Ecosystem</span></div>
                            <table class="dt">
                                <thead><tr><th>Ecosystem</th><th>Blocked</th><th>% of Blocked</th><th>Total Evaluated</th></tr></thead>
                                <tbody>${ecoRows}</tbody>
                            </table>
                        </div>`;
                }

                let rows = c.top_blocked.map(p =>
                    `<tr>
                        <td class="mono">${p.package}${p.malicious ? ' <span class="badge" style="background:#fce4ec;color:#b71c1c">Malicious</span>' : ''}</td>
                        <td>${p.ecosystem}</td>
                        <td class="num">${n(p.count)}</td>
                        <td>${p.policies}</td>
                    </tr>`
                ).join('');

                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Top Blocked Packages</span></div>
                        <table class="dt">
                            <thead><tr><th>Package</th><th>Ecosystem</th><th>Block Count</th><th>Triggering Policies</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`;
            }

            if (c.observation) {
                html += `
                    <div class="callout">
                        <strong>Curation note</strong>
                        ${c.observation}

            html += `

        /* ═══ SECTION 3: XRAY — SECURITY POSTURE ═══ */

        function buildViolations() {
            const v = DATA.violations, m = DATA.meta;
            const byType = v.by_type, bySev = v.by_severity;
            const sevTotal = (Number(bySev.critical) || 0) + (Number(bySev.high) || 0) + (Number(bySev.medium) || 0) + (Number(bySev.low) || 0);
            const sp = {
                critical: sevTotal > 0 ? Math.round(((Number(bySev.critical) || 0) / sevTotal) * 100) : 0,
                high: sevTotal > 0 ? Math.round(((Number(bySev.high) || 0) / sevTotal) * 100) : 0,
                medium: sevTotal > 0 ? Math.round(((Number(bySev.medium) || 0) / sevTotal) * 100) : 0,
                low: sevTotal > 0 ? Math.round(((Number(bySev.low) || 0) / sevTotal) * 100) : 0,
            };

            let html = `
                <div class="sec red">Xray — Security Posture</div>
                <p class="sub">Xray continuously scans your indexed repositories and build artifacts for known vulnerabilities, license violations, and operational risks. Period: ${m.date_from} – ${m.date_to}.</p>`;

            /* Violations by Type */
            const types = [
                ['Security', byType.security],
                ['Operational Risk', byType.operational],
                ['License', byType.license]
            ];
            let typeRows = types.map(([t, c]) =>
                `<tr><td>${t}</td><td class="num">${n(c)}</td><td class="num">${pct(c, v.total)}%</td></tr>`
            ).join('');
            typeRows += `<tr style="font-weight:700"><td>Total</td><td class="num">${n(v.total)}</td><td class="num">100%</td></tr>`;

            html += `
                <div class="card">
                    <div class="ch">
                        <span class="ct">Violations Breakdown — By Type</span>
                        <span class="cs">How violations are distributed across security, operational risk, and license categories</span>
                    </div>
                    <table class="dt">
                        <thead><tr><th>Type</th><th>Count</th><th>% of Total</th></tr></thead>
                        <tbody>${typeRows}</tbody>
                    </table>
                </div>`;

            /* Severity bar + table */
            const sevs = [
                ['Critical', bySev.critical, sp.critical, '--crit'],
                ['High', bySev.high, sp.high, '--high'],
                ['Medium', bySev.medium, sp.medium, '--med'],
                ['Low', bySev.low, sp.low, '--low']
            ];
            const critHigh = (Number(bySev.critical) || 0) + (Number(bySev.high) || 0);
            const critHighPct = sevTotal > 0 ? Math.round((critHigh / sevTotal) * 100) : 0;
            const dominant = [...sevs].sort((a, b) => (Number(b[1]) || 0) - (Number(a[1]) || 0))[0] || ['Critical', 0, 0, '--crit'];
            const dominantPct = sevTotal > 0 ? Math.round(((Number(dominant[1]) || 0) / sevTotal) * 100) : 0;

            let bar = sevs.map(([, , p, c]) =>
                p > 0 ? `<span title="${p}%" style="width:${p}%;background:var(${c})"></span>` : ''
            ).join('');

            let sevRows = sevs.map(([lbl, cnt, p, c]) =>
                `<tr>
                    <td><span class="badge" style="background:var(${c}bg, var(--alt));color:var(${c})">${lbl}</span></td>
                    <td class="num">${n(cnt)}</td>
                    <td class="num">${p}%</td>
                    <td style="width:40%">
                        ${p > 0 ? `<span style="display:inline-block;height:8px;border-radius:4px;width:${p}%;background:var(${c})"></span>` : ''}
                    </td>
                </tr>`
            ).join('');

            html += `
                <div class="card">
                    <div class="ch"><span class="ct">Security Violations by Severity</span></div>
                    <div class="callout risk" style="margin-top:0">
                        <strong>Severity concentration</strong>
                        Critical + High account for ${critHighPct}% (${n(critHigh)} of ${n(sevTotal)}) of all security-severity findings. Dominant severity is ${dominant[0]} (${dominantPct}%).
                    </div>
                    <div class="dist">${bar}</div>
                    <div class="sevr" style="margin-bottom:.25rem;gap:.8rem;flex-wrap:wrap">
                        ${sevs.map(([lbl, , p, c]) => `<span><span class="dot" style="background:var(${c})"></span> ${lbl}: <span class="cnt">${p}%</span></span>`).join('')}
                    </div>
                    <table class="dt"><tbody>${sevRows}</tbody></table>
                </div>`;

            /* Critical issues — capped at 20 */
            if (v.critical_issues && v.critical_issues.length > 0) {
                const maxShow = 20;
                const totalUnique = v.critical_issues.length;
                const shown = v.critical_issues.slice(0, maxShow);
                let ciRows = shown.map(i =>
                    `<tr>
                        <td class="mono">${i.id}</td>
                        <td>${i.description}</td>
                        <td class="num">${n(i.hits)}</td>
                        <td class="mono">${i.first_seen || '—'}</td>
                        <td class="num">${n(i.days_open || 0)}</td>
                        <td>${i.exploit_status || 'unknown'}</td>
                        <td>${(i.affected_environments || []).join(', ') || '—'}</td>
                        <td>${i.playbook_link ? `<a href="${i.playbook_link}">Playbook</a>` : '—'}</td>
                    </tr>`
                ).join('');

                const capNote = totalUnique > maxShow
                    ? `<p class="sub" style="margin-top:.4rem;font-style:italic">Showing top ${maxShow} of ${totalUnique} unique critical issues. View all in the JFrog Platform.</p>`
                    : '';

                html += `
                    <div class="card">
                        <div class="ch">
                            <span class="ct">All Critical Issues</span>
                            <span class="cs">${totalUnique} unique</span>
                        </div>
                        <p class="sub" style="margin-top:0">Every unique critical severity vulnerability found in your repositories, grouped by Xray ID. "Hits" shows how many artifacts are affected by each issue.</p>
                        <table class="dt">
                            <thead><tr><th>Xray ID</th><th>Description</th><th>Hits</th><th>First Seen</th><th>Days Open</th><th>Exploit</th><th>Env</th><th>Runbook</th></tr></thead>
                            <tbody>${ciRows}</tbody>
                        </table>
                        ${capNote}
                    </div>`;
            }

            if (v.observation) {
                html += `
                    <div class="callout risk">
                        <strong>Key finding</strong>
                        ${v.observation}
                    </div>`;
            }

            html += `
                <div class="ui-link">
                    Full violation details: <a href="${m.url}/ui/watchesNew/violations">${m.host}/ui/watchesNew/violations</a>
                </div>`;

            return html;
        }

        /* ═══ SECTION 10: RECOMMENDATIONS ═══ */

        function buildRecommendations() {
            const r = DATA.recommendations;
            if (!r || r.length === 0) return '';

            const pr = p => ({ P1: 3, P2: 2, P3: 1 }[(p || '').toUpperCase()] || 0);
            const sc = x => {
                const v = Number(x && x.score);
                return Number.isFinite(v) ? v : -1;
            };

            const ordered = [...r].sort((a, b) => {
                const byScore = sc(b) - sc(a);
                if (byScore !== 0) return byScore;
                const byPriority = pr(b && b.priority) - pr(a && a.priority);
                if (byPriority !== 0) return byPriority;
                return String(a && a.title || '').localeCompare(String(b && b.title || ''));
            });

            const invalid = ordered
                .map((x, i) => ({ i, x }))
                .filter(({ x }) => !x || !x.priority || !Number.isFinite(Number(x.score)));

            let items = ordered.map((x, idx) => {
                let badge = '';
                const title = x.title || `Recommendation ${idx + 1}`;
                const priority = (x.priority || '').toUpperCase();
                if (priority === 'P1') badge = '<span class="pri p1">P1</span>';
                else if (priority === 'P2') badge = '<span class="pri p2">P2</span>';
                else if (priority === 'P3') badge = '<span class="pri p3">P3</span>';

                const cleanTitle = title;
                const scoreLabel = sc(x) >= 0 ? `Score: ${sc(x)}` : '';
                const meta = [scoreLabel, x.effort ? `Effort: ${x.effort}` : '', x.owner ? `Owner: ${x.owner}` : '', x.due_date ? `Due: ${x.due_date}` : '']
                    .filter(Boolean)
                    .join(' · ');
                const deps = x.dependencies && x.dependencies.length > 0 ? `Depends on: ${x.dependencies.join(', ')}` : '';

                return `<div class="rec-i">
                    <strong>${badge}${cleanTitle}</strong>
                    ${x.detail}
                    ${meta ? `<div class="sd">${meta}</div>` : ''}
                    ${deps ? `<div class="sd">${deps}</div>` : ''}
                </div>`;
            }).join('');

            const warning = invalid.length > 0
                ? `<div class="callout warn"><strong>Recommendation metadata warning</strong>${invalid.length} recommendation item(s) are missing required beta fields (priority and/or score). Ranking and badges may be incomplete for those items.</div>`
                : '';

            return `
                <div class="sec">Recommendations</div>
                <p class="sub">Prioritized actions based on this report's findings. Each item references specific Xray IDs, package names, or policies to act on.</p>
                ${warning}
                <div class="rec">${items}</div>`;
        }

                return `

                    <p class="sub">${desc}</p>
                    <div class="callout">No blocked curation events in this reporting period.</div>

                    </div>`;

            const maxShow = 50;
            const shown = blockedEvents.slice(0, maxShow);
            let rows = shown.map(e => {
                return `
                    <tr>
                        <td><span class="badge b-block">Blocked</span></td>
                        <td class="mono">${e.package}</td>
                        <td class="mono">${e.version}</td>
                        <td>${e.type}</td>
                        <td class="mono">${e.repo}</td>
                        <td>${e.policy || '—'}</td>

            const capNote = blockedEvents.length > maxShow
                ? `<p class="sub" style="margin-top:.4rem;font-style:italic">Showing ${maxShow} of ${blockedEvents.length} blocked events.</p>`
                : '';

            return `
                <div class="sec">Curation Audit Trail</div>
                <p class="sub">${desc}</p>
                <div class="card">
                    <div class="ch">
                        <span class="ct">Blocked Events</span>
                        <span class="cs">${n(blockedEvents.length)} blocked of ${n(c.total)} total</span>
                    </div>
                    <table class="dt">
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Package</th>
                                <th>Version</th>
                                <th>Type</th>
                                <th>Repo</th>
                                <th>Policy</th>
                                <th>Requested By</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                    ${capNote}
                </div>
                <div class="ui-link">
                    Full audit trail: <a href="${m.url}/ui/curation/audit">${m.host}/ui/curation/audit</a>
                </div>`;
        }

        /* ═══ RENDER ALL SECTIONS ═══ */

        buildSidebar();

        document.getElementById('content').innerHTML = [
            buildHeader(),
            buildExecutiveSummary(),
            buildKPIs(),
            buildScoringGuide(),
            buildCuration(),
            buildViolations(),
            buildLicense(),
            buildOperational(),
            buildBenefit(),
            buildGovernance(),
            buildComparison(),
            buildThreatVelocity(),
            buildRecommendations(),
            buildAuditTrail(),
            `<div class="footer">JFrog CISO Report — ${DATA.meta.server_id} — Generated by Jfrog Dashboard Skills</div>`
        ].join('');
    </script>
</body>

</html>
