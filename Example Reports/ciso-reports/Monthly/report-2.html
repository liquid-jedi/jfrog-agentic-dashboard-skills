<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CISO Security Report</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;9..40,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /*
         * FONT SCALE — 6 sizes only
         * XL  1.5rem  (24px)  KPI numbers
         * L   1.1rem  (18px)  Report title
         * M   0.85rem (14px)  Section headers, card titles, callout titles
         * S   0.75rem (12px)  Body, tables, descriptions, sidebar values
         * XS  0.65rem (10px)  Mono data, table headers, KPI labels, sidebar labels
         * XXS 0.55rem (9px)   Footer, badges, pills
         */
        :root {
            --fs-xl: 1.5rem;
            --fs-l: 1.1rem;
            --fs-m: 0.85rem;
            --fs-s: 0.75rem;
            --fs-xs: 0.65rem;
            --fs-xxs: 0.55rem;

            --bg: #f4f5f7;
            --surface: #fff;
            --alt: #fafbfc;
            --border: #e4e7ec;
            --blt: #eef0f4;
            --bar: #283248;
            --bartx: rgba(255, 255, 255, .85);
            --barmuted: rgba(255, 255, 255, .45);
            --frog: #40be46;
            --flt: #e8f8e9;
            --fdk: #2d8a32;
            --tx: #1a2b4a;
            --tx2: #5a6a82;
            --muted: #8f9bb3;
            --crit: #c0560a;
            --critbg: #fff4e6;
            --high: #d4910a;
            --highbg: #fef9e7;
            --med: #b8a000;
            --medbg: #fefce8;
            --low: #7890a0;
            --lowbg: #f0f4f8;
            --blue: #4a8af0;
            --amber: #d4910a;
            --amberbg: #fef9e7;
            --r: 8px;
            --sh: 0 1px 3px rgba(26, 43, 74, .06)
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--tx);
            line-height: 1.55;
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            font-variant-numeric: tabular-nums
        }

        .side {
            width: 220px;
            background: var(--bar);
            flex-shrink: 0;
            padding: 1.1rem 1rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto
        }

        .side-brand {
            display: flex;
            align-items: center;
            gap: .55rem;
            font-size: var(--fs-m);
            font-weight: 700;
            color: var(--bartx);
            letter-spacing: .02em;
            margin-bottom: .9rem;
            padding-bottom: .65rem;
            border-bottom: 1px solid rgba(255, 255, 255, .1)
        }

        .side-brand svg {
            width: 34px;
            height: auto;
            flex-shrink: 0
        }

        .side-brand-text {
            min-width: 0
        }

        .side-brand span {
            display: block;
            font-size: var(--fs-xxs);
            font-weight: 600;
            color: var(--barmuted);
            text-transform: uppercase;
            letter-spacing: .1em;
            margin-top: .2rem
        }

        .ss {
            border-top: 1px solid rgba(255, 255, 255, .08);
            padding: .6rem 0
        }

        .ss:first-of-type {
            border-top: none
        }

        .sl {
            font-size: var(--fs-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--barmuted);
            margin-bottom: .15rem
        }

        .sv {
            font-size: var(--fs-s);
            color: var(--bartx);
            font-weight: 600;
            line-height: 1.4
        }

        .sv a {
            color: var(--frog);
            text-decoration: none
        }

        .sd {
            font-size: var(--fs-xs);
            color: var(--barmuted);
            line-height: 1.35;
            margin-top: .08rem
        }

        .sw {
            color: var(--amber);
            font-size: var(--fs-xs);
            font-weight: 600
        }

        .sp {
            display: inline-block;
            font-size: var(--fs-xxs);
            padding: .1rem .3rem;
            border-radius: 3px;
            font-weight: 600;
            margin: .1rem .15rem .1rem 0
        }

        .sp.on {
            background: rgba(64, 190, 70, .15);
            color: var(--frog)
        }

        .sp.off {
            background: rgba(212, 145, 10, .12);
            color: var(--amber)
        }

        .main {
            flex: 1;
            overflow-y: auto;
            padding: 1.4rem 2rem 3rem
        }

        .wrap {
            max-width: 1080px
        }

        .sec-head {
            display: flex;
            align-items: flex-start;
            gap: .75rem;
            margin: 2rem 0 .55rem;
            padding-top: .25rem
        }

        .sec-head:first-child {
            margin-top: .5rem
        }

        .sec-title {
            font-family: 'DM Sans', 'Plus Jakarta Sans', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--tx);
            margin: 0;
            line-height: 1.25
        }

        .sec-sub {
            margin: .2rem 0 0 !important
        }

        .band {
            background: var(--alt);
            border: 1px solid var(--blt);
            border-radius: var(--r);
            padding: .9rem 1rem 1rem;
            margin-bottom: 1.25rem
        }

        .band .card {
            box-shadow: none;
            margin-top: .45rem
        }

        .band .card:first-child {
            margin-top: 0
        }

        p.sub {
            font-size: var(--fs-s);
            color: var(--tx2);
            margin-bottom: .5rem
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: .6rem
        }

        .kpis-hero {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: .85rem;
            margin: .65rem 0 .5rem
        }

        .kpi-hero {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 1rem 1.05rem;
            box-shadow: var(--sh)
        }

        .kpi-hero .kpi-n {
            font-size: 2rem;
            line-height: 1.05
        }

        .kpi-hero .kpi-l {
            font-size: var(--fs-xs);
            margin-top: .25rem
        }

        .kpis-secondary {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
            margin-bottom: 1.1rem
        }

        .kpi-chip {
            display: inline-flex;
            align-items: baseline;
            gap: .35rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: .32rem .65rem;
            font-size: var(--fs-xs);
            color: var(--tx2)
        }

        .kpi-chip strong {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: var(--fs-s);
            color: var(--tx);
            font-weight: 700
        }

        .severity-hero {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 1rem 1.05rem;
            margin-bottom: .5rem
        }

        .severity-hero .dist {
            height: 18px;
            margin: .5rem 0 .65rem
        }

        .velocity-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: .75rem;
            margin-bottom: .75rem
        }

        .velocity-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .55rem .6rem .45rem
        }

        .velocity-panel .vp-label {
            font-size: var(--fs-xxs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
            margin-bottom: .35rem
        }

        .velocity-bars {
            display: flex;
            align-items: flex-end;
            gap: .35rem;
            height: 72px
        }

        .velocity-bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end
        }

        .velocity-bar {
            width: 100%;
            max-width: 36px;
            border-radius: 4px 4px 2px 2px;
            min-height: 4px
        }

        .velocity-bar-wrap.is-last .velocity-bar {
            opacity: 1
        }

        .velocity-bar-wrap:not(.is-last) .velocity-bar {
            opacity: .55
        }

        .velocity-bar-label {
            font-size: var(--fs-xs);
            font-weight: 600;
            color: var(--tx2);
            margin-top: .35rem;
            text-align: center;
            line-height: 1.2;
            max-width: 72px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .velocity-table .mono {
            font-size: var(--fs-s);
            font-weight: 600
        }

        .outcome-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: .55rem;
            margin: .5rem 0 .75rem
        }

        .outcome-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .65rem .75rem;
            text-align: center
        }

        .outcome-card strong {
            display: block;
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: .2rem
        }

        .outcome-card span {
            font-size: var(--fs-xs);
            font-weight: 600;
            color: var(--tx2)
        }

        .outcome-card small {
            display: block;
            font-size: var(--fs-xxs);
            color: var(--muted);
            margin-top: .2rem;
            line-height: 1.3
        }

        .stat-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: .5rem;
            margin: .45rem 0
        }

        .stat-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .55rem .65rem;
            text-align: center
        }

        .stat-box strong {
            font-size: 1.15rem;
            display: block
        }

        .stat-box span {
            font-size: var(--fs-xxs);
            color: var(--muted);
            font-weight: 600
        }

        .conn-bar {
            height: 10px;
            background: var(--blt);
            border-radius: 5px;
            overflow: hidden;
            margin: .4rem 0
        }

        .conn-bar span {
            display: block;
            height: 100%;
            background: var(--frog)
        }

        .donut-wrap {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            flex-wrap: wrap;
            margin: .5rem 0
        }

        .donut {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0
        }

        .donut-inner {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.25rem;
            line-height: 1.1;
            z-index: 1
        }

        .donut-inner small {
            font-size: var(--fs-xxs);
            font-weight: 600;
            color: var(--muted)
        }

        .donut-legend {
            display: flex;
            flex-direction: column;
            gap: .45rem;
            min-width: 200px
        }

        .donut-legend-item {
            display: flex;
            align-items: center;
            gap: .45rem;
            font-size: var(--fs-s);
            font-weight: 600
        }

        .donut-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0
        }

        .policy-protect {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            padding: .85rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--r);
            background: linear-gradient(90deg, rgba(64, 190, 70, .06), transparent 55%)
        }

        .policy-protect h4 {
            margin: 0;
            color: var(--frog);
            font-size: var(--fs-m);
            font-weight: 700
        }

        .policy-protect p {
            margin: .2rem 0 0;
            font-size: var(--fs-xs);
            color: var(--muted);
            max-width: 420px
        }

        .policy-protect-metrics {
            display: flex;
            align-items: center;
            gap: 1.25rem
        }

        .policy-metric {
            display: flex;
            align-items: baseline;
            gap: .35rem
        }

        .policy-metric strong {
            font-size: 1.5rem;
            font-weight: 800;
            line-height: 1
        }

        .policy-metric.block strong {
            color: var(--frog)
        }

        .policy-metric.dry strong {
            color: var(--amber)
        }

        .policy-metric span {
            font-size: var(--fs-s);
            color: var(--tx2);
            font-weight: 600
        }

        .severity-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: .5rem;
            margin: .5rem 0 .65rem
        }

        .severity-stat {
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .55rem .65rem;
            background: var(--surface)
        }

        .severity-stat strong {
            display: block;
            font-size: 1.2rem;
            font-weight: 800
        }

        .severity-stat span {
            font-size: var(--fs-xs);
            font-weight: 600;
            color: var(--tx2)
        }

        .severity-stat em {
            display: block;
            font-style: normal;
            font-size: var(--fs-xxs);
            color: var(--muted);
            margin-top: .15rem
        }

        .pkg-type-pill {
            display: inline-block;
            padding: .12rem .45rem;
            border-radius: 999px;
            font-size: var(--fs-xxs);
            font-weight: 700
        }

        .pkg-type-pill.ok {
            background: #e8f5e9;
            color: #2e7d32
        }

        .pkg-type-pill.partial {
            background: #fff8e1;
            color: #f57f17
        }

        .violation-type-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: .55rem;
            margin: .55rem 0 .75rem
        }

        .violation-type-card {
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .65rem .75rem;
            background: var(--surface);
            text-align: center
        }

        .violation-type-card strong {
            display: block;
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1.1
        }

        .violation-type-card span {
            font-size: var(--fs-xs);
            font-weight: 700;
            color: var(--tx2)
        }

        .repo-enabled-banner {
            display: flex;
            align-items: baseline;
            gap: .5rem;
            flex-wrap: wrap;
            padding: .7rem .85rem;
            border: 1px solid var(--border);
            border-radius: var(--r);
            background: var(--surface);
            margin: .5rem 0
        }

        .repo-enabled-banner strong {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--frog)
        }

        .rec-cards {
            display: flex;
            flex-direction: column;
            gap: .45rem
        }

        .rec-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 4px solid var(--muted);
            border-radius: var(--r);
            padding: .65rem .85rem
        }

        .rec-card.p1 {
            border-left-color: var(--crit)
        }

        .rec-card.p2 {
            border-left-color: var(--high)
        }

        .rec-card.p3 {
            border-left-color: var(--low)
        }

        .rec-card-title {
            font-family: 'DM Sans', 'Plus Jakarta Sans', sans-serif;
            font-size: var(--fs-m);
            font-weight: 700;
            margin-bottom: .25rem;
            line-height: 1.35
        }

        .rec-card-body {
            font-size: var(--fs-s);
            color: var(--tx2);
            line-height: 1.5
        }

        .rec-card-meta {
            font-size: var(--fs-xxs);
            color: var(--muted);
            margin-top: .3rem
        }

        .kpi {
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: 3px solid var(--muted);
            border-radius: var(--r);
            padding: .65rem .75rem;
            box-shadow: var(--sh);
            text-align: center
        }

        .kpi.red {
            border-top-color: var(--crit)
        }

        .kpi.green {
            border-top-color: var(--frog)
        }

        .kpi.orange {
            border-top-color: var(--high)
        }

        .kpi.gray {
            border-top-color: var(--muted)
        }

        .kpi-n {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: var(--fs-xl);
            font-weight: 700;
            line-height: 1.1
        }

        .kpi-l {
            font-size: var(--fs-xxs);
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .03em;
            margin-top: .1rem
        }

        .kpi-d {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: var(--fs-xxs);
            font-weight: 600;
            margin-top: .1rem;
            display: inline-block;
            padding: .05rem .25rem;
            border-radius: 3px
        }

        .good {
            background: var(--flt);
            color: var(--fdk)
        }

        .bad {
            background: var(--critbg);
            color: var(--crit)
        }

        .nums {
            display: flex;
            gap: .4rem;
            flex-wrap: wrap;
            margin: .45rem 0
        }

        .nb {
            padding: .3rem .6rem;
            border-radius: var(--r);
            font-size: var(--fs-s);
            font-weight: 600;
            border: 1px solid var(--border);
            background: var(--surface)
        }

        .nb strong {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: var(--fs-m);
            margin-right: .2rem
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .85rem;
            box-shadow: var(--sh);
            margin-top: .5rem
        }

        .ch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: .45rem
        }

        .ct {
            font-size: var(--fs-m);
            font-weight: 700
        }

        .cs {
            font-size: var(--fs-xxs);
            color: var(--muted)
        }

        .g2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .6rem
        }

        table.dt {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--fs-s)
        }

        .dt th {
            font-size: var(--fs-xxs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--muted);
            text-align: left;
            padding: .35rem .45rem;
            border-bottom: 2px solid var(--border);
            background: var(--alt)
        }

        .dt td {
            padding: .35rem .45rem;
            border-bottom: 1px solid var(--blt)
        }

        .dt tbody tr:hover td {
            background: var(--alt)
        }

        .dt .num {
            text-align: right;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600
        }

        .mono {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: var(--fs-xs)
        }

        .badge {
            font-size: var(--fs-xxs);
            font-weight: 600;
            padding: .1rem .35rem;
            border-radius: 3px;
            display: inline-block
        }

        .b-crit {
            background: var(--critbg);
            color: var(--crit)
        }

        .b-high {
            background: var(--highbg);
            color: var(--high)
        }

        .b-med {
            background: var(--medbg);
            color: #9a7b00
        }

        .b-low {
            background: var(--lowbg);
            color: var(--low)
        }

        .b-block {
            background: var(--critbg);
            color: var(--crit)
        }

        .b-pass {
            background: var(--flt);
            color: var(--fdk)
        }

        .dist {
            height: 10px;
            display: flex;
            border-radius: 5px;
            overflow: hidden;
            margin: .35rem 0
        }

        .dist span {
            height: 100%
        }

        .sevr {
            display: flex;
            align-items: center;
            gap: .35rem;
            padding: .2rem 0;
            font-size: var(--fs-s)
        }

        .sevr .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0
        }

        .sevr .lbl {
            flex: 1;
            color: var(--tx2)
        }

        .sevr .cnt {
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif
        }

        .callout {
            border-left: 4px solid var(--frog);
            background: var(--flt);
            border-radius: 0 var(--r) var(--r) 0;
            padding: .55rem .8rem;
            margin: .5rem 0;
            font-size: var(--fs-s);
            line-height: 1.5
        }

        .callout.warn {
            border-color: var(--amber);
            background: var(--amberbg)
        }

        .callout.risk {
            border-color: var(--crit);
            background: var(--critbg)
        }

        .callout strong {
            display: block;
            margin-bottom: .1rem;
            font-size: var(--fs-m)
        }

        .ben {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .8rem;
            box-shadow: var(--sh)
        }

        .ben.gl {
            border-left: 4px solid var(--frog)
        }

        .ben.bl {
            border-left: 4px solid var(--border)
        }

        .ben-t {
            font-size: var(--fs-m);
            font-weight: 700;
            margin-bottom: .3rem
        }

        .ben-h {
            font-size: var(--fs-m);
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: .4rem
        }

        .ben-s {

            DATA.license = DATA.license || {};
            DATA.operational = DATA.operational || {};
            DATA.benefit = DATA.benefit || {};
            DATA.governance = DATA.governance || {};
            DATA.comparison = DATA.comparison || {};

            const meta = DATA.meta;
            if (!meta.url && meta.server_url) meta.url = meta.server_url;
            if (!meta.host && (meta.server_url || meta.url)) {
                try {
                    meta.host = new URL(meta.server_url || meta.url).host;
                } catch {
                    meta.host = meta.server_url || meta.url;
                }
            }
            if (!meta.date_from && meta.period_start) meta.date_from = meta.period_start;
            if (!meta.date_to && meta.period_end) meta.date_to = meta.period_end;
            if (!meta.report_type && meta.period_label) meta.report_type = meta.period_label;
            if (meta.report_type) {
                meta.report_type = String(meta.report_type).replace(/^./, (ch) => ch.toUpperCase());
            }

            const p = DATA.platform;
            if (p.repos_total === undefined && p.total_repos !== undefined) p.repos_total = p.total_repos;
            if (p.repos_indexed === undefined) p.repos_indexed = p.indexed_repos !== undefined ? p.indexed_repos : (p.total_repos !== undefined ? p.total_repos : 0);
            if (p.repos_unindexed === undefined) p.repos_unindexed = Math.max(0, (Number(p.repos_total) || 0) - (Number(p.repos_indexed) || 0));
            if (p.policies_operational === undefined && p.policies_operational_risk !== undefined) {
                p.policies_operational = p.policies_operational_risk;
            }

            const c = DATA.curation;
            c.by_reason = {
                malicious: Number(c.by_reason && c.by_reason.malicious) || 0,
                security: Number(c.by_reason && (c.by_reason.security ?? c.by_reason.policy_violations)) || 0,
                license: Number(c.by_reason && c.by_reason.license) || 0,
                operational: Number(c.by_reason && (c.by_reason.operational ?? c.by_reason.pending_catalog_update)) || 0
            };
            if (c.block_rate === undefined && c.block_rate_pct !== undefined) c.block_rate = Number(c.block_rate_pct) || 0;
            if (!Array.isArray(c.by_type) && c.by_package_type && typeof c.by_package_type === 'object') {
                const blockedByType = { ...(c.blocked_by_type || {}) };
                (c.top_blocked_packages || []).forEach((item) => {
                    const typeKey = item.type || item.ecosystem || 'unknown';
                    blockedByType[typeKey] = (Number(blockedByType[typeKey]) || 0) + (Number(item.count) || 0);
                });
                c.by_type = Object.entries(c.by_package_type).map(([type, total]) => ({
                    type,
                    total: Number(total) || 0,
                    blocked: Number(blockedByType[type] || 0) || 0
                }));
            }
            if (!Array.isArray(c.top_blocked) && Array.isArray(c.top_blocked_packages)) {
                c.top_blocked = c.top_blocked_packages.map((item) => ({
                    package: item.package || item.name ? `${item.package || item.name}${item.version ? `:${item.version}` : ''}` : 'unknown',
                    ecosystem: item.ecosystem || item.type || 'unknown',
                    count: Number(item.count) || 0,
                    malicious: Boolean(item.malicious)
                }));
            }
            if (!c.policies_enforced || typeof c.policies_enforced !== 'object') {
                c.policies_enforced = { available: false, by_scope: [], by_policy: [] };
            }
            if ((Number(c.unique_users) || 0) === 0 && Array.isArray(c.top_users) && c.top_users.length > 0) {
                c.unique_users = c.top_users.length;
            }
            if (!Array.isArray(c.top_users)) c.top_users = [];
            if (c.unique_users === undefined || c.unique_users === null) {
                c.unique_users = c.top_users.length > 0
                    ? new Set(c.top_users.map((u) => u.user).filter(Boolean)).size
                    : 0;
            } else {
                c.unique_users = Number(c.unique_users) || 0;
            }
            c.top_users = c.top_users.map((item) => ({
                user: item.user || item.username || item.email || '—',
                events: Number(item.events ?? item.count ?? item.total) || 0,
                blocked: Number(item.blocked) || 0,
                approved: Number(item.approved) || 0,
                passed: Number(item.passed) || 0
            }));
            if (!Array.isArray(p.curated_types) && c.by_package_type && typeof c.by_package_type === 'object') {
                p.curated_types = Object.keys(c.by_package_type);
            }
            if (!Array.isArray(p.uncurated_types)) p.uncurated_types = [];
            const rr = getCurationRequestResults(c);
            if (c.request_results) {
                c.blocked = rr.blocked;
                c.approved = rr.approved;
                c.without_inspection = rr.without_inspection;
                c.passed = rr.without_inspection;
            } else {
                const actionSum = (Number(c.blocked) || 0) + (Number(c.approved) || 0) + (Number(c.passed) || 0);
                c.total = Math.max(Number(c.total) || 0, actionSum);
                if ((Number(c.passed) || 0) === 0 && (Number(c.total) || 0) > (Number(c.blocked) || 0)) {
                    c.passed = Math.max(0, (Number(c.total) || 0) - (Number(c.blocked) || 0));
                }
            }
            if (!Array.isArray(c.top_policies) && c.policies_enforced && Array.isArray(c.policies_enforced.by_policy)) {
                c.top_policies = c.policies_enforced.by_policy.slice(0, 5);
            }
            const platState = (p.curation_state || {});
            if ((!c.curation_state || !(c.curation_state.remote_total)) && platState.remote_total) {
                c.curation_state = platState;
            }
            const curState = c.curation_state || p.curation_state || {};
            const curationSignals = [
                c.available,
                Number(c.total) > 0,
                Number(c.blocked) > 0,
                Number(c.unique_users) > 0,
                Number(curState.remote_total) > 0,
                Number(curState.supported_remote_total) > 0,
                Number(curState.connected) > 0,
                Number(curState.supported_connected) > 0,
                Number((c.policy_inventory || {}).total_registered) > 0,
                Number((c.policies_enforced || {}).total_registered) > 0,
                Number(p.curation_policies_total) > 0,
                Number(p.curation_policies_block) > 0,
                Number(p.curation_policies_global) > 0,
                Number(p.curation_policies_repo) > 0,
                Number(p.curation_repos_count) > 0
            ];
            p.curation_enabled = curationSignals.some(Boolean);
            if (!p.curation_repos_count && Number(curState.remote_total) > 0) {
                p.curation_repos_count = Number(curState.remote_total);
            }
            if (!c.policy_violations_by_type && c.by_reason) {
                c.policy_violations_by_type = {
                    ...c.by_reason,
                    total_blocked: (Number(c.by_reason.malicious) || 0) + (Number(c.by_reason.security) || 0)
                        + (Number(c.by_reason.license) || 0) + (Number(c.by_reason.operational) || 0)
                };
            }
            if (!c.blocking_events_per_policy && c.top_policies && c.top_policies.length) {
                c.blocking_events_per_policy = c.top_policies.map((p) => ({
                    name: p.name,
                    scope_label: p.scope_label,
                    blocked_events: Number(p.blocked_hits ?? p.blocked_events) || 0,
                    audit_events: Number(p.audit_hits ?? p.audit_events) || 0,
                    action: p.action
                }));
            }
            if (!c.package_types && (c.by_type || []).length) {
                c.package_types = {
                    total: (p.curation_state || {}).package_types_total || c.by_type.length,
                    top_by_blocked: [...c.by_type].sort((a, b) => (b.blocked || 0) - (a.blocked || 0)).slice(0, 5)
                        .map((t) => ({ package_type: t.type, blocked: t.blocked, connected_repos: 0, remote_total: t.total }))
                };
            }
            const platByPkg = (c.curation_state || p.curation_state || {}).by_package_type || [];
            if (platByPkg.length) {
                const platMap = new Map(platByPkg.map((row) => [row.package_type, row]));
                const pkgInsight = c.package_types || { total: platByPkg.length, top_by_blocked: [] };
                const topRows = (pkgInsight.top_by_blocked || []).length
                    ? pkgInsight.top_by_blocked
                    : platByPkg.map((row) => ({
                        package_type: row.package_type,
                        blocked: Number(row.blocked_period) || 0,
                        connected_repos: Number(row.connected_repos ?? row.connected) || 0,
                        remote_total: Number(row.remote_total ?? row.total) || 0
                    }));
                pkgInsight.top_by_blocked = topRows.map((row) => {
                    const plat = platMap.get(row.package_type);
                    if (!plat) return row;
                    const conn = Number(row.connected_repos) || Number(plat.connected_repos ?? plat.connected) || 0;
                    const remote = Number(row.remote_total) || Number(plat.remote_total ?? plat.total) || 0;
                    return { ...row, connected_repos: conn, remote_total: remote };
                });
                if (!pkgInsight.total) {
                    pkgInsight.total = (c.curation_state || p.curation_state || {}).package_types_total || platByPkg.length;
                }
                c.package_types = pkgInsight;
            }

            if (!meta.curation_audit_ui_path) meta.curation_audit_ui_path = CURATION_AUDIT_UI_PATH;
            if (!meta.curation_uninspected_label) meta.curation_uninspected_label = 'Passed without inspection';

            const blockedOnly = (c.audit_events || [])
                .map((e) => ({ ...e, normalized_status: normalizeAuditStatus(e) }))
                .filter((e) => e.normalized_status === 'blocked');
            if (blockedOnly.length > 0 || Number(c.blocked || 0) > 0) {
                if (!Array.isArray(c.audit_events_display) || c.audit_events_display.length === 0) {
                    c.audit_events_display = buildAuditEventsDisplayFromBlocked(blockedOnly);
                }
                const totalBlocked = Number(c.blocked) > 0 ? Number(c.blocked) : blockedOnly.length;
                c.audit_events_display_meta = {
                    cap: AUDIT_DISPLAY_CAP,
                    sort: 'malicious_then_package_count_then_newest',
                    total_blocked: totalBlocked,
                    ...(c.audit_events_display_meta || {})
                };
            }


            const v = DATA.violations;
            v.by_severity = v.by_severity || { critical: 0, high: 0, medium: 0, low: 0 };
            if (!v.by_type || typeof v.by_type !== 'object') v.by_type = {};
            // Keep total aligned with available breakdowns.
            const sevSum = (Number(v.by_severity.critical) || 0) + (Number(v.by_severity.high) || 0) + (Number(v.by_severity.medium) || 0) + (Number(v.by_severity.low) || 0);
            if (v.by_type.security === undefined) v.by_type.security = Number(v.total) || 0;
            if (v.by_type.operational === undefined) v.by_type.operational = 0;
            if (v.by_type.license === undefined) v.by_type.license = 0;
            if (v.by_type.operational === undefined && v.by_type.operational_risk !== undefined) {
                v.by_type.operational = v.by_type.operational_risk;
            }
            const typeSum = (Number(v.by_type.security) || 0) + (Number(v.by_type.operational) || 0) + (Number(v.by_type.license) || 0);
            v.total = Math.max(Number(v.total) || 0, sevSum, typeSum);
            if (Array.isArray(v.critical_issues)) {
                const periodEnd = reportPeriodEnd();
                v.critical_issues = v.critical_issues.map((issue) => {
                    let daysOpen = Number(issue.days_open);
                    if (!Number.isFinite(daysOpen) || daysOpen <= 0) {
                        const computed = computeDaysOpen(issue.first_seen, periodEnd);
                        if (computed !== null) daysOpen = computed;
                    }
                    return {
                        ...issue,
                        id: issue.id || issue.issue_id || 'unknown',
                        description: issue.description || issue.title || 'No description provided',
                        hits: issue.hits !== undefined ? issue.hits : (issue.count !== undefined ? issue.count : ((issue.affected_artifacts || []).length || (issue.components || []).length || 1)),
                        days_open: Number.isFinite(daysOpen) ? daysOpen : 0
                    };
                });
            }

            const l = DATA.license;
            if (!Array.isArray(l.licenses) && Array.isArray(l.violations)) {
                const grouped = new Map();
                l.violations.forEach((item) => {
                    const spdx = item.license || 'Unknown';
                    const current = grouped.get(spdx) || { spdx, name: '', count: 0, severity: item.severity || 'High' };
                    current.count += 1;
                    grouped.set(spdx, current);
                });
                l.licenses = Array.from(grouped.values());
            }

            const o = DATA.operational;
            if (o.total === undefined) o.total = Number(o.total_components) || 0;
            if (Array.isArray(o.top_components)) {
                o.top_components = o.top_components.map((item) => ({
                    component: item.component || (item.name ? `${item.name}${item.version ? `:${item.version}` : ''}` : '') || item.path || 'unknown',
                    hits: item.hits !== undefined ? item.hits : (item.count !== undefined ? item.count : (item.violation_count !== undefined ? item.violation_count : 1))
                }));
            }
            if (!Array.isArray(o.top_locations) && Array.isArray(o.top_components)) {
                o.top_locations = [];
            }

            const b = DATA.benefit;
            if (!b.curation_headline) b.curation_headline = `Stopped ${n(c.blocked || 0)} packages before entering any repository`;
            if (!b.xray_headline) b.xray_headline = `Surfaced ${n(v.total || 0)} violations across indexed repositories`;
            if (b.cves_prevented === undefined) b.cves_prevented = b.estimated_vulnerabilities_prevented !== undefined ? b.estimated_vulnerabilities_prevented : (c.blocked || 0);
            if (b.upgrade_rate === undefined) b.upgrade_rate = null;
            b.upgrade_rate_computed = b.upgrade_rate_computed === true;
            if (b.xray_coverage === undefined) {
                b.xray_coverage = Array.isArray(DATA.governance.repo_watch_coverage)
                    ? 0
                    : (Number(DATA.governance.repo_watch_coverage) || 0);
            }
            if (!b.compare_line) b.compare_line = b.observation || '';

            const g = DATA.governance;
            g._summary_only = false;
            if (!Array.isArray(g.policy_effectiveness)) {
                const effectivenessPct = Number(g.policy_effectiveness);
                g.policy_effectiveness = Number.isFinite(effectivenessPct) && effectivenessPct > 0
                    ? [{
                        policy: 'Overall policy effectiveness',
                        type: 'summary',
                        hits: Number(g.watches_active) || 0,
                        pct_of_events: effectivenessPct,
                        delta_pct: 0
                    }]
                    : [];
                if (g.policy_effectiveness.length === 1) g._policy_summary_only = true;
            }
            if (!Array.isArray(g.repo_watch_coverage)) {
                const coveragePct = Number(g.repo_watch_coverage);
                g.repo_watch_coverage = Number.isFinite(coveragePct) && coveragePct > 0
                    ? [{
                        repo: `${n(p.curation_repos_count || p.repos_indexed || 0)} repos in scope (summary)`,
                        indexed: true,
                        watch_count: null,
                        risk_level: `${coveragePct}% indexed`
                    }]
                    : [];
                if (g.repo_watch_coverage.length === 1 && isSummaryGovernanceRow(g.repo_watch_coverage[0])) {
                    g._repo_summary_only = true;
                }
            } else if (g.repo_watch_coverage.every(isSummaryGovernanceRow)) {
                g._repo_summary_only = true;
            }

            const cmp = DATA.comparison;
            if (cmp && cmp.available && !Array.isArray(cmp.metrics)) {
                const toMetric = (label, current, deltaValue, goodWhenDown = true) => {
                    if (deltaValue === undefined || deltaValue === null) return null;
                    const deltaNumber = Number(deltaValue) || 0;
                    const currentNumber = Number(current) || 0;
                    const previous = currentNumber - deltaNumber;
                    const changePct = previous !== 0 ? Math.round((deltaNumber / previous) * 100) : (deltaNumber === 0 ? 0 : 100);
                    return {
                        label,
                        previous,
                        current: currentNumber,
                        change_pct: changePct,
                        direction: deltaNumber > 0 ? 'up' : deltaNumber < 0 ? 'down' : 'flat',
                        good: goodWhenDown ? deltaNumber <= 0 : deltaNumber >= 0
                    };
                };

                cmp.metrics = [
                    toMetric('Packages Blocked', c.blocked, cmp.curation && cmp.curation.blocked_delta, true),
                    toMetric('Violations', v.total, cmp.violations && cmp.violations.total_delta, true),
                    toMetric('Critical', v.by_severity.critical, cmp.violations && cmp.violations.critical_delta, true),
                    toMetric('Risk Score', v.risk_score, v.risk_score_previous !== undefined ? (Number(v.risk_score) || 0) - (Number(v.risk_score_previous) || 0) : undefined, true)
                ].filter(Boolean);
            }

            const t = DATA.threat_velocity = DATA.threat_velocity || {};
            if (t.available && !Array.isArray(t.periods) && DATA.comparison && DATA.comparison.available) {
                const previousBlocked = (Number(c.blocked) || 0) - (Number(DATA.comparison.curation && DATA.comparison.curation.blocked_delta) || 0);
                const previousViolations = (Number(v.total) || 0) - (Number(DATA.comparison.violations && DATA.comparison.violations.total_delta) || 0);
                const previousCritical = (Number(v.by_severity.critical) || 0) - (Number(DATA.comparison.violations && DATA.comparison.violations.critical_delta) || 0);
                t.periods = [
                    {
                        label: DATA.comparison.previous_date || 'Previous',
                        blocked: previousBlocked,
                        violations: previousViolations,
                        critical: previousCritical
                    },
                    {
                        label: meta.date_to || meta.generated || 'Current',
                        blocked: Number(c.blocked) || 0,
                        violations: Number(v.total) || 0,
                        critical: Number(v.by_severity.critical) || 0
                    }
                ];
            }
            if (!t.trend_summary && t.observation) t.trend_summary = t.observation;
            const stubTrend = /moved from \d+ to \d+;\s*curation blocks moved to \d+\.?$/i.test(String(t.trend_summary || ''))
                || (String(t.trend_summary || '').includes('moved to') && !String(t.trend_summary || '').includes('→'));
            if (!t.trend_summary || stubTrend) {
                const built = buildTrendSummaryFallback();
                if (built) t.trend_summary = built;
            }

            if (Array.isArray(v.top_watch_policies) && v.top_watch_policies.length > 0) {
                const totalHits = v.top_watch_policies.reduce((s, p) => s + (Number(p.hits) || 0), 0) || Math.max(1, Number(v.total) || 1);
                const watchRows = v.top_watch_policies.map((p) => ({
                    policy: p.policy,
                    type: p.type || 'security',
                    hits: Number(p.hits) || 0,
                    pct_of_events: Math.round(((Number(p.hits) || 0) / totalHits) * 100),
                    delta_pct: Number(p.delta_pct) || 0
                }));
                if (!Array.isArray(g.xray_policy_effectiveness) || !g.xray_policy_effectiveness.length) {
                    g.xray_policy_effectiveness = watchRows;
                }
                const pe = g.policy_effectiveness || [];
                const peAllZero = pe.length === 0 || pe.every((x) => (Number(x.hits) || 0) === 0);
                const peAllCuration = pe.length > 0 && pe.every((x) => String(x.type || '').toLowerCase() === 'curation');
                if (peAllZero || peAllCuration) {
                    g.policy_effectiveness = g.xray_policy_effectiveness || watchRows;
                    g._policy_summary_only = false;
                }
            }
            if ((!Array.isArray(g.curation_policy_effectiveness) || !g.curation_policy_effectiveness.length)
                && Array.isArray(c.blocking_events_per_policy) && c.blocking_events_per_policy.length) {
                const blockedTotal = Math.max(Number(c.blocked) || 0, 1);
                g.curation_policy_effectiveness = c.blocking_events_per_policy
                    .filter((row) => (Number(row.blocked_events) || 0) > 0)
                    .map((row) => ({
                        policy: row.name || '—',
                        type: 'curation',
                        hits: Number(row.blocked_events) || 0,
                        pct_of_events: Math.round(((Number(row.blocked_events) || 0) / blockedTotal) * 100),
                        delta_pct: 0,
                        scope_label: row.scope_label
                    }));
            }
            if (Array.isArray(g.repo_watch_coverage) && g.repo_watch_coverage.length > 0) {
                g.repo_watch_summary = computeRepoWatchSummary(g.repo_watch_coverage);
            }
            if (!g.repo_watch_summary && (Number(p.repos_total) || 0) > 0) {
                g.repo_watch_summary = {
                    total: Number(p.repos_total) || 0,
                    indexed: Number(p.repos_indexed) || 0,
                    unindexed: Number(p.repos_unindexed) || 0,
                    withWatch: null,
                    withoutWatch: null,
                    _platform_fallback: true
                };
            }

            augmentRecommendations();

            // Prefer threat_velocity.periods for period comparison when present (avoids stale snapshot deltas).
            syncComparisonFromThreatVelocity();

            if (Array.isArray(DATA.recommendations)) {
                DATA.recommendations = DATA.recommendations.map((item) => ({
                    ...item,
                    detail: item.detail || item.description || item.text || ''
                }));
            }
        }

        function safeRender(sectionTitle, renderFn) {
            try {
                return renderFn();
            } catch (error) {
                console.error(`Render failure in ${sectionTitle}`, error);
                return `
                    <div class="sec red">${sectionTitle}</div>
                    <div class="callout warn">
                        <strong>Section render failed</strong>
                        ${error && error.message ? error.message : 'Unknown render error'}
                    </div>`;
            }
        }

        function getMethodology() {
            const m = DATA.methodology || {};
            const risk = m.risk_score || {};
            const weights = risk.weights || { critical: 100, high: 20, medium: 5, low: 1 };
            const bands = risk.bands || [
                { min: 0, max: 15, label: 'Low weighted exposure', signal: 'Good' },
                { min: 15, max: 35, label: 'Moderate weighted exposure', signal: 'Watch trend' },
                { min: 35, max: 60, label: 'High weighted exposure', signal: 'Bad' },
                { min: 60, max: null, label: 'Critical weighted exposure', signal: 'Very bad' }
            ];
            const severity = m.severity_levels || {
                critical: {
                    meaning: 'Exploit likely or high-impact compromise path.',
                    signal: 'Bad when rising. Best when near zero.'
                },
                high: {
                    meaning: 'Serious weakness requiring near-term remediation.',
                    signal: 'Bad when sustained or rising.'
                },
                medium: {
                    meaning: 'Meaningful risk with lower immediate blast radius.',
                    signal: 'Neutral-to-bad if backlog accumulates.'
                },
                low: {
                    meaning: 'Limited immediate impact; monitor and batch-fix.',
                    signal: 'Generally acceptable if higher severities are controlled.'
                }
            };
            const repoRiskLevels = m.repo_watch_risk_levels || [
                { level: 'critical', rule: 'Repository has critical findings and no watch coverage.' },
                { level: 'high', rule: 'Repository has critical findings or high violation volume.' },
                { level: 'medium', rule: 'Repository has violations, or is indexed with zero watches.' },
                { level: 'low', rule: 'No significant findings and covered.' }
            ];
            const curationActions = m.curation_actions || {
                blocked: 'Denied by policy.',
                approved: 'Explicit override approval.',
                dry_run: 'Alert-only evaluation (dry run).',
                without_inspection: 'Passed through without policy inspection — may be vulnerable or malicious.'
            };
            return { weights, bands, severity, repoRiskLevels, curationActions };
        }

        /* ═══ SIDEBAR ═══ */

        function sideItem(label, value, detail, warn) {
            return `<div class="ss">
                <div class="sl">${label}</div>
                <div class="sv">${warn ? `<span class="sw">${value}</span>` : value}</div>
                ${detail ? `<div class="sd">${detail}</div>` : ''}
            </div>`;
        }

        function buildSidebar() {
            const m = DATA.meta, p = DATA.platform, c = DATA.curation || {};
            let s = `<div class="side-brand">${FROG_SVG}<div class="side-brand-text">${m.report_type || 'Weekly'} Report<span>${m.server_id || 'Platform'}</span></div></div>`;

            s += sideItem('Platform URL',
                `<a href="${m.url}">${m.host}</a>`);

            const platWarn = (Number(p.watches_total) || 0) === 0 && (Number(p.policies_total) || 0) === 0;
            s += sideItem('Watches',
                `${n(p.watches_total)} total · ${n(p.watches_active)} active`,
                platWarn ? 'Run platform merge (/api/v2/watches)' : null,
                platWarn);

            s += sideItem('Policies',
                `${n(p.policies_total)} total`,
                `${n(p.policies_security)} security · ${n(p.policies_operational)} operational · ${n(p.policies_license)} license`,
                platWarn);

            const curState = c.curation_state || p.curation_state || {};
            const curConn = getRemoteConnectionStats(curState);
            const curStatusDetail = curConn.total > 0
                ? `${n(curConn.connected)} / ${n(curConn.total)} ${curConn.scope.toLowerCase()} connected`
                : (Number(p.curation_repos_count) > 0 ? `${n(p.curation_repos_count)} remote repos in scope` : null);
            s += sideItem('Curation Status',
                p.curation_enabled ? 'Enabled' : 'Not configured',
                p.curation_enabled ? curStatusDetail : 'No curation audit, policy, or repository signal found',
                !p.curation_enabled);

            const pe = c.policies_enforced || {};
            const curPolLine = pe.available || Number(pe.enforcing) > 0
                ? `${n(pe.enforcing)} block · ${n(pe.dry_run_excluded)} dry-run`
                : (p.curation_enabled
                    ? `All remote: ${n(p.curation_policies_global)} · Selected: ${n(p.curation_policies_repo)}`
                    : 'Not configured');
            s += sideItem('Curation Policies', curPolLine, null, !p.curation_enabled);

            let pills = '';
            (p.curated_types || []).forEach(t => pills += `<span class="sp on">${t}</span>`);
            (p.uncurated_types || []).forEach(t => pills += `<span class="sp off">${t}</span>`);

            s += sideItem('Xray Indexed',
                `${n(p.repos_indexed)} of ${n(p.repos_total)} repos`,
                pills);

            s += sideItem('Generated', m.generated);

            document.getElementById('sidebar').innerHTML = s;
            document.title = `CISO Report — ${m.server_id} — ${m.generated}`;
        }

        /* ═══ COMPARISON DELTA BADGES ═══ */

        function delta(metrics, label) {
            if (!DATA.comparison || !DATA.comparison.available) return '';
            const m = (DATA.comparison.metrics || []).find(x => x.label === label);
            if (!m) return '';
            const cls = m.good ? 'good' : 'bad';
            const arrow = m.direction === 'down' ? '↓' : m.direction === 'up' ? '↑' : '—';
            return `<div class="kpi-d ${cls}">${arrow} ${Math.abs(m.change_pct)}% vs last</div>`;
        }

        /* ═══ REPORT HEADER ═══ */

        function buildHeader() {
            const m = DATA.meta;
            return `
                <div class="report-header">
                    <div class="report-header-text">
                        <h1><span>${m.report_type}</span> Report for <span>${m.server_id}</span></h1>
                        <div class="report-period">${m.date_from} – ${m.date_to}</div>
                        <div class="report-window">${m.report_type || 'Weekly'} (${m.window_days || 7} days)</div>
                    </div>
                </div>`;
        }

        /* ═══ EXECUTIVE SUMMARY ═══ */

        function buildExecutiveSummary() {
            const c = DATA.curation, v = DATA.violations, m = DATA.meta;
            const bullets = [];
            const stats = [];

            if (c.available && Number(c.blocked) > 0) {
                bullets.push(`<strong>Gate defense:</strong> Curation blocked <strong>${n(c.blocked)}</strong> package downloads before they could enter your repositories (${n(c.unique_users || 0)} users active).`);
                stats.push(`<div class="es-stat"><strong>${n(c.blocked)}</strong> blocked at gate</div>`);
            } else if (c.available) {
                bullets.push('<strong>Gate defense:</strong> Curation evaluated packages in this period; no blocks were recorded.');
            }

            if (Number(v.total) > 0) {
                bullets.push(`<strong>Inside repositories:</strong> Xray reported <strong>${n(v.total)}</strong> violations, including <strong>${n(v.by_severity.critical)}</strong> critical findings.`);
                stats.push(`<div class="es-stat"><strong>${n(v.by_severity.critical)}</strong> critical inside</div>`);
            }

            if (v.critical_issues && v.critical_issues.length > 0) {
                const top = v.critical_issues[0];
                const days = top.days_open > 0 ? ` · open ~${n(top.days_open)} days` : '';
                bullets.push(`<strong>Top critical exposure:</strong> <span class="mono">${top.id}</span> — ${n(top.hits)} artifact hits${days}.`);
            }

            if (c.available && Number(c.blocked) === 0 && Number(v.total) === 0) {
                bullets.push('No material blocked downloads or violations were detected in this reporting window.');
            }

            return `
                <div class="exec-summary">
                    <div class="es-title">Executive Summary</div>
                    ${bullets.length ? `<ul class="es-list">${bullets.map((b) => `<li>${b}</li>`).join('')}</ul>` : ''}
                    ${stats.length ? `<div class="es-stats">${stats.join('')}</div>` : ''}
                </div>`;
        }

        /* ═══ SECTION 1: EXECUTIVE KPIs ═══ */

        function buildKPIs() {
            const c = DATA.curation, v = DATA.violations;
            const rr = getCurationRequestResults(c);
            return `
                <div class="kpis-hero">
                    <div class="kpi-hero">
                        <div class="kpi-n" style="color:var(--crit)">${n(c.blocked)}</div>
                        <div class="kpi-l">Blocked at the Gate</div>
                        ${delta(null, 'Packages Blocked')}
                    </div>
                    <div class="kpi-hero">
                        <div class="kpi-n" style="color:var(--crit)">${n(v.by_severity.critical)}</div>
                        <div class="kpi-l">Critical Inside</div>
                        ${delta(null, 'Critical')}
                    </div>
                    <div class="kpi-hero">
                        <div class="kpi-n">${n(v.risk_score)}</div>
                        <div class="kpi-l">Risk Score (0–100)</div>
                        ${delta(null, 'Risk Score')}
                    </div>
                </div>
                <div class="kpis-secondary">
                    <span class="kpi-chip"><strong>${n(c.total)}</strong> evaluated</span>
                    <span class="kpi-chip"><strong>${n(rr.without_inspection)}</strong> ${labelWithoutInspection().toLowerCase()}</span>
                    <span class="kpi-chip"><strong>${n(rr.dry_run)}</strong> dry run</span>
                    <span class="kpi-chip"><strong>${n(c.approved)}</strong> approved</span>
                    <span class="kpi-chip"><strong>${n(v.total)}</strong> violations</span>
                    <span class="kpi-chip"><strong>${n(c.unique_users || 0)}</strong> curation users</span>
                </div>
                <p class="method-note">
                    <strong>Sources:</strong> Curation totals from audit API event counts; Xray from violations API in this date window.
                </p>`;
        }

        function buildScoringGuide() {
            const m = getMethodology();
            const bandRows = (m.bands || []).map(b => {
                const range = b.max === null || b.max === undefined ? `${b.min}+` : `${b.min}-${b.max}`;
                return `<tr><td class="mono">${range}</td><td>${b.label}</td><td>${b.signal}</td></tr>`;
            }).join('');

            return `
                ${secHead('12', 'Severity & risk method', 'Reference — how to read severity levels, risk score, and curation actions.')}
                <div class="band g2">
                    <div class="card">
                        <div class="ch"><span class="ct">Violation Severity (Xray)</span></div>
                        <table class="dt">
                            <thead><tr><th>Level</th><th>Meaning</th><th>Good/Bad Signal</th></tr></thead>
                            <tbody>
                                <tr><td><span class="badge b-crit">Critical</span></td><td>${m.severity.critical.meaning}</td><td>${m.severity.critical.signal}</td></tr>
                                <tr><td><span class="badge b-high">High</span></td><td>${m.severity.high.meaning}</td><td>${m.severity.high.signal}</td></tr>
                                <tr><td><span class="badge b-med">Medium</span></td><td>${m.severity.medium.meaning}</td><td>${m.severity.medium.signal}</td></tr>
                                <tr><td><span class="badge b-low">Low</span></td><td>${m.severity.low.meaning}</td><td>${m.severity.low.signal}</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card">
                        <div class="ch"><span class="ct">Risk Score and Health Bands</span></div>
                        <p class="sub">Risk score is normalized to 0-100 from severity mix and volume:</p>
                        <div class="mono" style="margin:.25rem 0 .5rem">raw = (Critical*${m.weights.critical}) + (High*${m.weights.high}) + (Medium*${m.weights.medium}) + (Low*${m.weights.low})</div>
                        <div class="mono" style="margin:.25rem 0 .6rem">risk_score = (raw / (total_violations*100)) * 100</div>
                        <table class="dt">
                            <thead><tr><th>Band</th><th>Interpretation</th><th>Signal</th></tr></thead>
                            <tbody>${bandRows}</tbody>
                        </table>
                    </div>
                </div>
                </div>
                <div class="callout warn"><strong>Curation interpretation</strong><span class="mono">Blocked</span> = ${m.curationActions.blocked} <span class="mono">Approved</span> = ${m.curationActions.approved} <span class="mono">Dry run</span> = ${m.curationActions.dry_run} <span class="mono">${labelWithoutInspection()}</span> = ${m.curationActions.without_inspection}</div>`;
        }

        /* ═══ SECTION 2: CURATION — SUPPLY CHAIN DEFENSE ═══ */

        function buildCurationAuditLinkCard() {
            const c = DATA.curation, m = DATA.meta;
            const auditUrl = curationAuditUiUrl(m);
            const auditPathLabel = m.curation_audit_ui_path || CURATION_AUDIT_UI_PATH;
            return `
                <div class="audit-link-card">
                    <strong>View full audit trail in JFrog Platform</strong>
                    <p class="method-note" style="margin:.35rem 0 0">This report summarizes ${n(c.total)} evaluations, ${n(c.blocked)} blocked, and ${n(c.unique_users || 0)} users. Use the UI for search, export, and per-event policy detail.</p>
                    <a class="btn-audit" href="${auditUrl}" target="_blank" rel="noopener">${m.host}${auditPathLabel}</a>
                </div>`;
        }

        function buildCuration() {
            const c = DATA.curation, m = DATA.meta, p = DATA.platform || {};
            const rr = getCurationRequestResults(c);
            const inv = c.policy_inventory || {};
            const state = c.curation_state || {};

            if (!c.available) {
                return `
                    ${secHead('06', 'Gate defense', 'Curation screens every package download before it enters your repositories.')}
                    <div class="callout warn">
                        <strong>Unavailable</strong>
                        Curation audit data was unavailable on this instance. Curation may not be configured or the token lacks the required permission. Contact your JFrog administrator.
                    </div>`;
            }

            const pv = policyViolationsByType(c);
            const conn = getRemoteConnectionStats(state);
            const pkgInsight = c.package_types || {};
            const pkgTotal = Number(pkgInsight.total ?? state.package_types_total) || 0;
            const topPkgBlocked = pkgInsight.top_by_blocked || [];
            const blockPolicies = c.blocking_events_per_policy || c.top_policies || [];
            const blockActive = inv.block_active ?? p.curation_policies_block;
            const dryActive = inv.dry_run_active ?? p.curation_policies_dry_run;
            const policiesRegistered = inv.total_registered ?? p.curation_policies_total ?? 0;
            const topUser = c.top_users && c.top_users.length ? c.top_users[0] : null;
            const computedBlockRate = Number(c.total) > 0 ? ((Number(rr.blocked) || 0) / Number(c.total)) * 100 : 0;
            const blockRate = Number(c.block_rate) > 0 ? Number(c.block_rate) : computedBlockRate;
            const blockRateLabel = blockRate > 0 && blockRate < 0.1 ? '<0.1%' : `${n(blockRate)}%`;
            const userInsight = topUser
                ? `Top user: ${topUser.user} (${n(topUser.events)} events, ${n(topUser.blocked)} blocked).`
                : 'Top user data was not available in this run.';

            let html = `
                ${secHead('06', 'Gate defense', 'Curation screens every package download before it enters your repositories.')}
                <div class="band">
                <div class="ch"><span class="ct">Request overall results</span><span class="cs">${n(c.total)} evaluations in period</span></div>
                <div class="outcome-grid">
                    <div class="outcome-card"><strong style="color:var(--crit)">${n(rr.blocked)}</strong><span>Blocked</span></div>
                    <div class="outcome-card"><strong style="color:var(--frog)">${n(rr.approved)}</strong><span>Approved</span></div>
                    <div class="outcome-card"><strong style="color:var(--amber)">${n(rr.dry_run)}</strong><span>Dry run</span><small>Passed with alert</small></div>
                    <div class="outcome-card"><strong>${n(rr.without_inspection)}</strong><span>${labelWithoutInspection()}</span><small>Not evaluated by a curation policy</small></div>
                </div>

                <div class="card">
                    <div class="ch"><span class="ct">Curation activity insight</span><span class="cs">Human demand + enforcement rate</span></div>
                    <div class="stat-grid-4">
                        <div class="stat-box"><strong>${n(c.unique_users)}</strong><span>Unique requesters</span></div>
                        <div class="stat-box"><strong style="color:var(--crit)">${blockRateLabel}</strong><span>Blocked request rate</span></div>
                        <div class="stat-box"><strong>${n(c.total)}</strong><span>Total evaluations</span></div>
                        <div class="stat-box"><strong>${n(rr.blocked)}</strong><span>Prevented downloads</span></div>
                    </div>
                    <p class="method-note" style="margin:.4rem 0 0">${userInsight} A low block rate with high evaluation volume usually means Curation is filtering a broad stream of package requests while escalating only policy-relevant risk.</p>
                </div>

                <div class="card">
                    <div class="ch"><span class="ct">Policy violations</span><span class="cs">Blocked by type · ${n(pv.total)} events</span></div>
                    <div class="violation-type-grid">
                        <div class="violation-type-card"><strong style="color:#b71c1c">${n(pv.malicious)}</strong><span>Malicious</span></div>
                        <div class="violation-type-card"><strong style="color:var(--high)">${n(pv.security)}</strong><span>Security</span></div>
                        <div class="violation-type-card"><strong style="color:var(--amber)">${n(pv.license)}</strong><span>License</span></div>
                        <div class="violation-type-card"><strong>${n(pv.operational)}</strong><span>Operational</span></div>
                    </div>
                </div>

                <div class="policy-protect">
                    <div>
                        <h4>Protect with policies</h4>
                        <p>Create policies to block risky OSS on selected packages or set up alerts for your team.</p>
                        <p class="sub" style="margin:.35rem 0 0"><strong>${n(policiesRegistered)}</strong> policies registered on platform</p>
                    </div>
                    <div class="policy-protect-metrics">
                        <div class="policy-metric block"><strong>${n(blockActive)}</strong><span>Block policies</span></div>
                        <div class="policy-metric dry"><strong>${n(dryActive)}</strong><span>Dry run policies</span></div>
                    </div>
                </div>`;

            if (conn.total > 0) {
                html += `
                    <div class="repo-enabled-banner">
                        <strong>${n(conn.connected)} / ${n(conn.total)}</strong>
                        <span>remote repositories enabled for Curation</span>
                    </div>
                    <p class="sub" style="margin:-.25rem 0 .65rem">${conn.footnote}</p>
                    <div class="card">
                        <div class="ch"><span class="ct">Connected remote repositories state</span><span class="cs">${conn.scope}</span></div>
                        ${buildDonutChart(conn.total, conn.connected, conn.not_connected, conn.pct)}
                    </div>`;
            }

            if (pkgTotal > 0 || topPkgBlocked.length > 0) {
                const pkgRows = topPkgBlocked.map((row) =>
                    `<tr>
                        <td>${row.package_type || '—'}</td>
                        <td class="num">${n(row.blocked)}</td>
                        <td class="num">${n(row.connected_repos)} / ${n(row.remote_total)}</td>
                    </tr>`
                ).join('');
                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Package types protected by Curation</span><span class="cs">${n(pkgTotal)} types on platform</span></div>
                        <p class="sub" style="margin-top:0">Top <strong>5</strong> package types by <strong>blocked</strong> downloads in this period.</p>
                        ${pkgRows ? `
                        <table class="dt">
                            <thead><tr><th>Package type</th><th>Blocked (period)</th><th>Connected repos</th></tr></thead>
                            <tbody>${pkgRows}</tbody>
                        </table>` : '<p class="sub">No blocked events by package type in this period.</p>'}
                    </div>`;
            }

            const byPkg = state.by_package_type || [];
            if (byPkg.length > 0) {
                const pkgConnRows = [...byPkg].sort((a, b) => (b.connected || 0) - (a.connected || 0)).slice(0, 16).map((row) => {
                    const tot = Number(row.remote_total) || 0;
                    const connN = Number(row.connected) || 0;
                    const pill = tot > 0 && connN === tot ? 'ok' : (connN > 0 ? 'partial' : '');
                    const label = tot > 0 && connN === tot ? 'Connected' : (connN > 0 ? 'Partially connected' : 'Not connected');
                    return `<tr>
                        <td>${row.package_type || '—'}</td>
                        <td><span class="pkg-type-pill ${pill}">${label}</span></td>
                        <td class="num">${n(connN)} / ${n(tot)}</td>
                        <td class="num">${n(row.blocked_period || 0)}</td>
                    </tr>`;
                }).join('');
                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Package types · repository coverage</span></div>
                        <table class="dt">
                            <thead><tr><th>Package type</th><th>Status</th><th>Connected repos</th><th>Blocked (period)</th></tr></thead>
                            <tbody>${pkgConnRows}</tbody>
                        </table>
                    </div>`;
            }

            if (blockPolicies.length > 0) {
                const polRows = blockPolicies.slice(0, 5).map((pol) =>
                    `<tr>
                        <td>${pol.name || '—'}</td>
                        <td>${pol.scope_label || '—'}</td>
                        <td class="num">${n(pol.blocked_events ?? pol.blocked_hits)}</td>
                        <td class="num">${n(pol.audit_events ?? pol.audit_hits)}</td>
                    </tr>`
                ).join('');
                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Blocking events per policy</span><span class="cs">Top 5 by blocked events</span></div>
                        <table class="dt">
                            <thead><tr><th>Policy</th><th>Scope</th><th>Blocked events</th><th>Audit events</th></tr></thead>
                            <tbody>${polRows}</tbody>
                        </table>
                    </div>`;
            }

            const pe = c.policies_enforced || {};
            if (pe.available || Number(pe.enforcing) > 0 || Number(pe.total_registered) > 0) {
                const scopeRows = (pe.by_scope || []).map((s) =>
                    `<tr>
                        <td>${s.label || s.scope}</td>
                        <td class="num">${n(s.registered)}</td>
                        <td class="num">${n(s.enforcing)}</td>
                    </tr>`
                ).join('');
                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Policy scope</span><span class="cs">${n(pe.enforcing)} enforcing · ${n(pe.dry_run_excluded)} dry-run excluded · ${n(pe.total_registered)} registered</span></div>
                        <p class="sub" style="margin-top:0">Curation package-download policies (separate from Xray watch policies: <strong>${n(p.policies_total)}</strong> on platform).</p>
                        ${scopeRows ? `
                        <table class="dt">
                            <thead><tr><th>Scope</th><th>Registered</th><th>Enforcing (block)</th></tr></thead>
                            <tbody>${scopeRows}</tbody>
                        </table>` : ''}
                    </div>`;
            }

            const blockList = inv.block_policies || [];
            if (blockList.length > 0) {
                const rows = blockList.slice(0, 20).map((pol) =>
                    `<tr>
                        <td>${pol.name}</td>
                        <td>${pol.condition || '—'}</td>
                        <td>${pol.risk_type || '—'}</td>
                        <td>${pol.scope || '—'}</td>
                    </tr>`
                ).join('');
                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Active block policies (by condition)</span></div>
                        <table class="dt">
                            <thead><tr><th>Policy</th><th>Condition</th><th>Risk type</th><th>Scope</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`;
            }

            if (c.top_users && c.top_users.length > 0) {
                const userRows = c.top_users.slice(0, 10).map((u) =>
                    `<tr>
                        <td class="mono">${u.user}</td>
                        <td class="num">${n(u.events)}</td>
                        <td class="num">${n(u.blocked)}</td>
                        <td class="num">${n(u.approved)}</td>
                        <td class="num">${n(u.passed)}</td>
                    </tr>`
                ).join('');
                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Top Curation Users (by activity)</span></div>
                        <table class="dt">
                            <thead><tr><th>User</th><th>Events</th><th>Blocked</th><th>Approved</th><th>Other</th></tr></thead>
                            <tbody>${userRows}</tbody>
                        </table>
                    </div>`;
            }

            if (c.top_blocked && c.top_blocked.length > 0) {
                /* Blocked by ecosystem */
                if (c.by_type && c.by_type.length > 0) {
                    const totalBlocked = c.by_type.reduce((s, t) => s + t.blocked, 0);
                    let ecoRows = c.by_type.filter(t => t.blocked > 0).map(t =>
                        `<tr>
                            <td>${t.type}</td>
                            <td class="num">${n(t.blocked)}</td>
                            <td class="num">${totalBlocked > 0 ? Math.round(t.blocked / totalBlocked * 100) : 0}%</td>
                            <td class="num">${n(t.total)}</td>
                        </tr>`
                    ).join('');
                    html += `
                        <div class="card">
                            <div class="ch"><span class="ct">Blocked Requests by Ecosystem</span></div>
                            <table class="dt">
                                <thead><tr><th>Ecosystem</th><th>Blocked</th><th>% of Blocked</th><th>Total Evaluated</th></tr></thead>
                                <tbody>${ecoRows}</tbody>
                            </table>
                        </div>`;
                }

                let rows = c.top_blocked.map(p =>
                    `<tr>
                        <td class="mono">${p.package}${p.malicious ? ' <span class="badge" style="background:#fce4ec;color:#b71c1c">Malicious</span>' : ''}</td>
                        <td>${p.ecosystem}</td>
                        <td class="num">${n(p.count)}</td>
                    </tr>`
                ).join('');

                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Top Blocked Packages</span></div>
                        <table class="dt">
                            <thead><tr><th>Package</th><th>Ecosystem</th><th>Block Count</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`;
            }

            if (c.observation) {
                html += `
                    <div class="callout">
                        <strong>Curation note</strong>
                        ${c.observation}
                    </div>`;
            }

            html += buildCurationAuditLinkCard();
            html += '</div>';
            return html;
        }

        /* ═══ SECTION 3: XRAY — SECURITY POSTURE ═══ */

        function buildViolations() {
            const v = DATA.violations, m = DATA.meta;
            const byType = v.by_type, bySev = v.by_severity;
            const sevTotal = (Number(bySev.critical) || 0) + (Number(bySev.high) || 0) + (Number(bySev.medium) || 0) + (Number(bySev.low) || 0);
            const sp = {
                critical: sevTotal > 0 ? Math.round(((Number(bySev.critical) || 0) / sevTotal) * 100) : 0,
                high: sevTotal > 0 ? Math.round(((Number(bySev.high) || 0) / sevTotal) * 100) : 0,
                medium: sevTotal > 0 ? Math.round(((Number(bySev.medium) || 0) / sevTotal) * 100) : 0,
                low: sevTotal > 0 ? Math.round(((Number(bySev.low) || 0) / sevTotal) * 100) : 0,
            };

            let html = `
                ${secHead('07', 'Inside the perimeter', `Xray findings in indexed repos · ${m.date_from} – ${m.date_to}`)}
