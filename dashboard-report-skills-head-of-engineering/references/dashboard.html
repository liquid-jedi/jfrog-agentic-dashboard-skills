<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Head of Engineering — JFrog Security & Delivery Report</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #40c463;
      --jfrog: #40be46;
      --healthy: #40c463;
      --watch: #d29922;
      --risk: #f0883e;
      --alert: #f85149;
      --critical: #f85149;
      --high: #f0883e;
      --medium: #d29922;
      --low: #58a6ff;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    a { color: var(--jfrog); text-decoration: none; }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .logo { font-size: 22px; font-weight: 700; color: var(--jfrog); letter-spacing: -0.5px; }
    .header-meta { color: var(--muted); font-size: 12px; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .approval-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .approval-pending { background: rgba(210,153,34,0.15); color: var(--watch); border: 1px solid var(--watch); }
    .approval-approved { background: rgba(64,196,99,0.15); color: var(--healthy); border: 1px solid var(--healthy); }

    /* ── Layout ── */
    .container { max-width: 1280px; margin: 0 auto; padding: 24px 32px; }
    .section { margin-bottom: 32px; }
    .section-title {
      font-size: 16px; font-weight: 600; margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .source-tag {
      font-size: 10px; font-weight: 500; color: var(--muted);
      background: var(--surface2); padding: 2px 8px; border-radius: 10px;
      border: 1px solid var(--border); margin-left: auto;
    }

    /* ── KPI Cards ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .kpi-value { font-size: 28px; font-weight: 700; line-height: 1; margin-bottom: 6px; }
    .kpi-source { font-size: 10px; color: var(--muted); }
    .kpi-delta { font-size: 12px; margin-bottom: 4px; }
    .delta-good { color: var(--healthy); }
    .delta-bad  { color: var(--alert); }
    .delta-neutral { color: var(--muted); }

    /* ── Tables ── */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%; border-collapse: collapse;
      background: var(--surface); border-radius: var(--radius);
      overflow: hidden;
    }
    th {
      background: var(--surface2); color: var(--muted);
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
      padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border);
      font-weight: 500;
    }
    td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .num { text-align: right; font-variant-numeric: tabular-nums; }

    /* ── Severity badges ── */
    .sev {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .sev-critical { background: rgba(248,81,73,0.15); color: var(--critical); }
    .sev-high     { background: rgba(240,136,62,0.15); color: var(--high); }
    .sev-medium   { background: rgba(210,153,34,0.15); color: var(--medium); }
    .sev-low      { background: rgba(88,166,255,0.15); color: var(--low); }

    /* ── Score bar ── */
    .score-bar { display: flex; align-items: center; gap: 8px; }
    .score-bar-track {
      flex: 1; height: 6px; background: var(--surface2);
      border-radius: 3px; overflow: hidden;
    }
    .score-bar-fill { height: 100%; border-radius: 3px; }
    .score-num { font-size: 12px; font-weight: 600; width: 28px; text-align: right; }

    /* ── Trend indicators ── */
    .trend-up   { color: var(--alert); }
    .trend-down { color: var(--healthy); }
    .trend-flat { color: var(--muted); }

    /* ── Heatmap ── */
    .heatmap { display: flex; flex-direction: column; gap: 8px; }
    .heatmap-row { display: flex; align-items: center; gap: 8px; }
    .heatmap-label { width: 160px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .heatmap-cell {
      flex: 1; padding: 10px 14px; border-radius: var(--radius);
      font-size: 12px; font-weight: 600; text-align: center;
      cursor: default;
    }
    .band-healthy { background: rgba(64,196,99,0.15); color: var(--healthy); }
    .band-watch   { background: rgba(210,153,34,0.15); color: var(--watch); }
    .band-risk    { background: rgba(240,136,62,0.15); color: var(--risk); }
    .band-alert   { background: rgba(248,81,73,0.15); color: var(--alert); }

    /* ── Warnings ── */
    .warnings {
      background: rgba(210,153,34,0.08); border: 1px solid rgba(210,153,34,0.3);
      border-radius: var(--radius); padding: 12px 16px; margin-bottom: 24px;
    }
    .warnings-title { font-size: 12px; font-weight: 600; color: var(--watch); margin-bottom: 8px; }
    .warnings ul { padding-left: 18px; }
    .warnings li { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

    /* ── Recommendations ── */
    .rec-list { display: flex; flex-direction: column; gap: 12px; }
    .rec-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: start;
    }
    .rec-priority {
      font-size: 11px; font-weight: 700; padding: 4px 8px;
      border-radius: 6px; text-align: center; min-width: 32px;
    }
    .p1 { background: rgba(248,81,73,0.15); color: var(--alert); }
    .p2 { background: rgba(240,136,62,0.15); color: var(--risk); }
    .p3 { background: rgba(210,153,34,0.15); color: var(--watch); }
    .rec-title { font-weight: 600; margin-bottom: 4px; }
    .rec-detail { font-size: 12px; color: var(--muted); }
    .rec-meta { font-size: 11px; color: var(--muted); text-align: right; white-space: nowrap; }
    .rec-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .rec-tag {
      font-size: 10px; padding: 2px 6px; border-radius: 4px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    }

    /* ── Bar chart ── */
    .bar-chart { display: flex; flex-direction: column; gap: 10px; }
    .bar-row { display: flex; align-items: center; gap: 10px; }
    .bar-label { width: 160px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; height: 20px; background: var(--surface2); border-radius: 4px; overflow: hidden; position: relative; }
    .bar-fill { height: 100%; border-radius: 4px; }
    .bar-count { width: 48px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }

    /* ── Trend chart (sparkline-style) ── */
    .trend-chart { overflow-x: auto; }
    .trend-chart table th, .trend-chart table td { min-width: 70px; }

    /* ── Footer ── */
    .footer {
      margin-top: 40px; padding: 20px 32px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      color: var(--muted); font-size: 11px; flex-wrap: wrap; gap: 8px;
    }
    .footer-logo { color: var(--jfrog); font-weight: 600; }

    /* ── Approval notice ── */
    .approval-notice {
      background: rgba(64,196,99,0.05);
      border: 1px solid rgba(64,196,99,0.2);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 12px;
    }
    .approval-notice strong { color: var(--healthy); }

    @media print {
      body { background: white; color: black; }
      .header { border-color: #ddd; }
    }
  </style>
</head>
<body>
<script>
// JSON-first contract: all data flows through this single __DATA__ payload.
// Replace __DATA__ with the JSON string produced by the data-collection step.
const DATA = __DATA__;

// ── Helpers ──────────────────────────────────────────────────────────────────

function bandClass(score) {
  if (score <= 20) return 'band-healthy';
  if (score <= 50) return 'band-watch';
  if (score <= 80) return 'band-risk';
  return 'band-alert';
}

function bandColor(score) {
  if (score <= 20) return 'var(--healthy)';
  if (score <= 50) return 'var(--watch)';
  if (score <= 80) return 'var(--risk)';
  return 'var(--alert)';
}

function sevClass(sev) {
  return 'sev sev-' + (sev || '').toLowerCase();
}

function deltaHtml(delta, direction) {
  if (delta === 0 || delta === null || delta === undefined) return '<span class="delta-neutral">— no change</span>';
  const improved = (direction === 'down_is_good' && delta < 0) || (direction === 'up_is_good' && delta > 0);
  const cls = improved ? 'delta-good' : 'delta-bad';
  const arrow = delta > 0 ? '▲' : '▼';
  return `<span class="${cls}">${arrow} ${Math.abs(delta)}</span> vs prior period`;
}

function trendArrow(trend) {
  if (trend === 'up')   return '<span class="trend-up">↑</span>';
  if (trend === 'down') return '<span class="trend-down">↓</span>';
  return '<span class="trend-flat">→</span>';
}

function truncate(str, n) { return str && str.length > n ? str.slice(0, n) + '…' : (str || ''); }

// ── Render: Header ────────────────────────────────────────────────────────────

function renderHeader() {
  const m = DATA.meta;
  const approvalHtml = m.approval_status === 'approved'
    ? `<span class="approval-badge approval-approved">✓ Approved by ${m.approved_by || 'unknown'}</span>`
    : `<span class="approval-badge approval-pending">⏳ Pending Approval</span>`;

  document.getElementById('header').innerHTML = `
    <div class="header-left">
      <div class="logo">JFrog</div>
      <div>
        <div style="font-weight:600;font-size:16px;">Head of Engineering Report</div>
        <div class="header-meta">
          ${m.report_type.toUpperCase()} &nbsp;·&nbsp;
          ${m.period_start} → ${m.period_end} &nbsp;·&nbsp;
          Generated ${new Date(m.generated_at).toLocaleString()} by ${m.generated_by || 'unknown'}
        </div>
      </div>
    </div>
    <div class="header-right">
      ${approvalHtml}
      <span style="font-size:11px;color:var(--muted)">Server: ${DATA.platform.url}</span>
    </div>
  `;
}

// ── Render: Warnings ──────────────────────────────────────────────────────────

function renderWarnings() {
  const el = document.getElementById('warnings');
  if (!DATA.meta.warnings || DATA.meta.warnings.length === 0) { el.style.display = 'none'; return; }
  el.innerHTML = `
    <div class="warnings">
      <div class="warnings-title">⚠ Data Collection Warnings</div>
      <ul>${DATA.meta.warnings.map(w => `<li>${w}</li>`).join('')}</ul>
    </div>
  `;
}

// ── Render: Approval notice ───────────────────────────────────────────────────

function renderApprovalNotice() {
  const el = document.getElementById('approval-notice');
  if (DATA.meta.approval_status !== 'approved') { el.style.display = 'none'; return; }
  el.innerHTML = `
    <div class="approval-notice">
      <strong>✓ Approved</strong> by ${DATA.meta.approved_by} on ${new Date(DATA.meta.approved_at).toLocaleDateString()}.
      This report has been reviewed and is cleared for distribution.
    </div>
  `;
}

// ── Render: KPIs ─────────────────────────────────────────────────────────────

function renderKPIs() {
  const deltas = DATA.comparison && DATA.comparison.available ? DATA.comparison.kpi_deltas : {};
  const html = DATA.kpis.map(k => {
    const delta = deltas[k.id] !== undefined ? deltas[k.id] : null;
    const valueColor = k.direction === 'down_is_good'
      ? (typeof k.value === 'number' && k.value > 50 ? 'var(--alert)' : 'var(--text)')
      : 'var(--text)';
    return `
      <div class="kpi-card">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value" style="color:${valueColor}">${k.value}${k.unit || ''}</div>
        <div class="kpi-delta">${deltaHtml(delta, k.direction)}</div>
        <div class="kpi-source">Source: ${k.source}</div>
      </div>`;
  }).join('');
  document.getElementById('kpis').innerHTML = `<div class="kpi-grid">${html}</div>`;
}

// ── Render: Section dispatcher ────────────────────────────────────────────────

function renderSections() {
  const el = document.getElementById('sections');
  el.innerHTML = DATA.sections.map(sec => {
    let body = '';
    switch (sec.kind) {
      case 'table':   body = renderTable(sec); break;
      case 'heatmap': body = renderHeatmap(sec); break;
      case 'bar':     body = renderBar(sec); break;
      case 'trend':   body = renderTrend(sec); break;
      default: body = `<pre style="color:var(--muted);font-size:12px">${JSON.stringify(sec.data, null, 2)}</pre>`;
    }
    return `
      <div class="section">
        <div class="section-title">
          ${sec.title}
          <span class="source-tag">${sec.source_attribution || ''}</span>
        </div>
        ${body}
      </div>`;
  }).join('');
}

function renderTable(sec) {
  if (!sec.data || !sec.data.rows || sec.data.rows.length === 0)
    return `<p style="color:var(--muted);font-size:12px">No data available for this period.</p>`;
  const cols = sec.data.columns;
  const numeric = cols.filter(c => ['critical','high','medium','low','score','prs_merged','cycle_time','count','violations'].includes(c));
  const thead = `<tr>${cols.map(c => `<th class="${numeric.includes(c)?'num':''}">${c.replace(/_/g,' ')}</th>`).join('')}</tr>`;
  const tbody = sec.data.rows.map(row => {
    const cells = cols.map(c => {
      let val = row[c];
      if (c === 'score')   return `<td class="num"><div class="score-bar"><div class="score-bar-track"><div class="score-bar-fill" style="width:${val}%;background:${bandColor(val)}"></div></div><span class="score-num" style="color:${bandColor(val)}">${val}</span></div></td>`;
      if (c === 'severity') return `<td><span class="${sevClass(val)}">${val}</span></td>`;
      if (c === 'trend')    return `<td>${trendArrow(val)}</td>`;
      if (c === 'has_attestation') return `<td>${val === true ? '✓' : val === false ? '✗' : '—'}</td>`;
      if (c === 'critical') return `<td class="num" style="color:var(--critical);font-weight:600">${val ?? 0}</td>`;
      if (c === 'high')     return `<td class="num" style="color:var(--high)">${val ?? 0}</td>`;
      if (c === 'medium')   return `<td class="num" style="color:var(--medium)">${val ?? 0}</td>`;
      if (numeric.includes(c)) return `<td class="num">${val ?? 0}</td>`;
      return `<td title="${val || ''}">${truncate(String(val ?? '—'), 48)}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');
  return `<div class="table-wrap"><table><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
}

function renderHeatmap(sec) {
  if (!sec.data || !sec.data.cells || sec.data.cells.length === 0)
    return `<p style="color:var(--muted);font-size:12px">No data available.</p>`;
  const rows = sec.data.cells.map(cell => `
    <div class="heatmap-row">
      <div class="heatmap-label" title="${cell.project}">${cell.project}</div>
      <div class="heatmap-cell ${bandClass(cell.score)}">
        ${cell.risk_band.toUpperCase()} · Score ${cell.score} · ${cell.label}
      </div>
    </div>`).join('');
  return `<div class="heatmap">${rows}</div>`;
}

function renderBar(sec) {
  if (!sec.data || !sec.data.bars || sec.data.bars.length === 0)
    return `<p style="color:var(--muted);font-size:12px">No data available.</p>`;
  const max = Math.max(...sec.data.bars.map(b => b.count), 1);
  const rows = sec.data.bars.map(b => {
    const pct = Math.round(b.count / max * 100);
    const color = b.action === 'blocked' ? 'var(--alert)' : 'var(--healthy)';
    return `
      <div class="bar-row">
        <div class="bar-label" title="${b.label}">${b.label}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
        <div class="bar-count">${b.count}</div>
      </div>`;
  }).join('');
  return `<div class="bar-chart">${rows}</div>`;
}

function renderTrend(sec) {
  if (!sec.data || !sec.data.series || sec.data.series.length === 0)
    return `<p style="color:var(--muted);font-size:12px">No trend data available.</p>`;
  const periods = sec.data.series[0].points.map(p => p.period);
  const thead = `<tr><th>Team / Project</th>${periods.map(p => `<th class="num">${p}</th>`).join('')}</tr>`;
  const tbody = sec.data.series.map(s => {
    const cells = s.points.map(pt => `<td class="num" style="color:${bandColor(pt.value)}">${pt.value}</td>`).join('');
    return `<tr><td>${s.name}</td>${cells}</tr>`;
  }).join('');
  return `<div class="trend-chart table-wrap"><table><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
}

// ── Render: Recommendations ───────────────────────────────────────────────────

function renderRecommendations() {
  if (!DATA.recommendations || DATA.recommendations.length === 0) return;
  const cards = DATA.recommendations.map(r => {
    const tags = [
      ...(r.affected_projects || []).map(p => `<span class="rec-tag">📁 ${p}</span>`),
      ...(r.affected_groups || []).map(g => `<span class="rec-tag">👥 ${g}</span>`)
    ].join('');
    return `
      <div class="rec-card">
        <div class="rec-priority ${r.priority.toLowerCase()}">${r.priority}</div>
        <div>
          <div class="rec-title">${r.title}</div>
          <div class="rec-detail">${r.detail}</div>
          ${tags ? `<div class="rec-tags">${tags}</div>` : ''}
          <div style="margin-top:6px;font-size:11px;color:var(--muted)">Source: ${r.source || '—'}</div>
        </div>
        <div class="rec-meta">
          Effort: ${r.effort}<br>
          Owner: ${r.owner || '—'}<br>
          Score: ${r.score}
        </div>
      </div>`;
  }).join('');
  document.getElementById('recommendations').innerHTML = `
    <div class="section">
      <div class="section-title">Recommended Actions</div>
      <div class="rec-list">${cards}</div>
    </div>`;
}

// ── Render: Footer ────────────────────────────────────────────────────────────

function renderFooter() {
  const m = DATA.meta;
  document.getElementById('footer').innerHTML = `
    <div>
      <span class="footer-logo">JFrog</span> Head of Engineering Report &nbsp;·&nbsp;
      Schema v${m.schema_version} &nbsp;·&nbsp; Generated ${m.generated_at}
    </div>
    <div>Audit ID: ${m.generated_by || '—'} &nbsp;·&nbsp; ${m.approval_status}</div>
  `;
}

// ── Boot ──────────────────────────────────────────────────────────────────────

window.addEventListener('DOMContentLoaded', () => {
  try {
    renderHeader();
    renderWarnings();
    renderApprovalNotice();
    renderKPIs();
    renderSections();
    renderRecommendations();
    renderFooter();
  } catch (err) {
    document.body.innerHTML = `
      <div style="padding:40px;color:#f85149;font-family:monospace">
        <h2>Render error</h2>
        <pre>${err.stack || err.message}</pre>
        <p style="color:#8b949e;margin-top:16px">Check that __DATA__ was replaced with valid JSON conforming to report-schema.md.</p>
      </div>`;
  }
});
</script>

<div class="header" id="header"></div>

<div class="container">
  <div id="approval-notice"></div>
  <div id="warnings"></div>

  <div class="section">
    <div class="section-title">Key Performance Indicators</div>
    <div id="kpis"></div>
  </div>

  <div id="sections"></div>
  <div id="recommendations"></div>
</div>

<div class="footer" id="footer"></div>
</body>
</html>
