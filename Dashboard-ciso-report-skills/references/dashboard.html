/* ═══ OVERVIEW TAB ═══ */
function buildOverview(){
  const v = DATA.violations || {}, c = DATA.curation || {}, p = DATA.platform || {}, sev = v.by_severity || {};
  const vei = v.executive_insights || {}, cei = (c.executive_insights || {});
  const uniqueCritical = v.unique_critical_issue_count != null ? v.unique_critical_issue_count : ((v.critical_issues || []).length || 0);
  const cn = connStats();
  const sig = v.posture_signals || {};
  const sd  = (DATA.comparison || {}).signal_deltas || {};
  const cmp = DATA.comparison || {};

  // Attention strip — top 3 actions, bleeds full-width
  const allActions = computeActions();
  const topCards = allActions.slice(0, 3).map(a => `
    <div class="act-card">
      <span class="act-pill pill-${(a.pri||'p3').toLowerCase()}">${esc(a.pri)}</span>
      <h3>${esc(a.title)}</h3>
      <p>${esc(a.body)}</p>
      ${a.effort ? `<div class="act-effort">EFFORT: ${esc(a.effort)}</div>` : ''}
      ${a.metric ? `<div class="act-metric">${esc(a.metric.split('·')[0])}${a.metric.includes('·') ? ` <span>·${esc(a.metric.split('·').slice(1).join('·'))}</span>` : ''}</div>` : ''}
    </div>`).join('');
  const attnBlock = `<div class="attention" style="margin:-22px -24px 20px">
    <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px">
      <h2 style="margin:0">What needs your attention</h2>
      ${allActions.length > 3 ? `<button class="btn-link" onclick="document.getElementById('recommendations').scrollIntoView({behavior:'smooth'})">See all ${allActions.length} →</button>` : ''}
    </div>
    <div class="act-grid">${topCards}</div>
  </div>`;
  const benefit = DATA.benefit || {};
  const benefitLine = benefit.compare_line ? `<div class="note"><b>Prevention and residual risk.</b> ${esc(benefit.compare_line)}${benefit.upgrade_rate_computed?` <b>${fmt(benefit.upgrade_rate)}%</b> of uniquely blocked packages were later approved at a higher version.`:''}</div>` : '';

  const criticalDelta = cmp.available && cmp.violations ? cmp.violations.critical_delta : null;
  const kpis = `<div class="kpis">
    <div class="kpi k-green"><div class="n">${fmt(c.blocked)}</div><div class="l">Blocked at gate</div><div class="d">${pctOf(c.blocked,c.total)<1?'<1':pctOf(c.blocked,c.total)}% of requests</div></div>
    <div class="kpi k-crit"><div class="n">${fmt((c.request_results||{}).without_inspection||c.without_inspection)}</div><div class="l">Without inspection</div><div class="d">package requests bypassing policy evaluation</div></div>
    <div class="kpi k-med"><div class="n">${cn.pct}<small>%</small></div><div class="l">Remotes gated</div><div class="d">${fmt(cn.connected)} / ${fmt(cn.total)}</div></div>
    <div class="kpi k-info"><div class="n">${fmt(c.unique_users)}</div><div class="l">Active Curation users</div><div class="d">${(c.active_user_context||{}).trend?.available?`${(c.active_user_context.trend.delta||0)>0?'+':''}${fmt(c.active_user_context.trend.delta)} vs prior report`:'distinct requester identities'}</div></div>
    <div class="kpi k-navy"><div class="n">${(c.waiver_requests||{}).available?fmt((c.waiver_requests||{}).pending):'—'}</div><div class="l">Pending waivers</div><div class="d">${(c.waiver_requests||{}).available?'awaiting decision':'API unavailable'}</div></div>
  </div>`;

  const sla = vei.sla_risk_backlog || {}, rr = vei.remediation_readiness || {}, blind = vei.watch_blind_spots || [], gaps = cei.gate_coverage_gaps || [];
  const gapCount = gaps.reduce((sum, row) => sum + (row.unconnected || 0), 0);
  const insights = `<div class="kpis compact-4">
    <div class="kpi k-crit insight-card"><div class="n">${fmt(sla.sla_breach_issues)}</div><div class="l">Critical SLA breach</div><div class="d ${sla.sla_breach_issues?'warn':''}">older than ${fmt(sla.sla_days||30)} days</div></div>
    <div class="kpi k-green insight-card"><div class="n">${fmt(rr.fix_available_issues)}</div><div class="l">Fixable exposure</div><div class="d good">${fmt(rr.fix_available_hits)} artifact hits</div></div>
    <div class="kpi k-med insight-card"><div class="n">${fmt(blind.length)}</div><div class="l">Watch blind spots</div><div class="d">repos with violations and no watch</div></div>
    <div class="kpi k-info insight-card"><div class="n">${fmt(gapCount)}</div><div class="l">Gate coverage gaps</div><div class="d">supported remotes not gated</div></div>
  </div>`;

  // top critical exposure — join top_cves with components from violation_details
  const compMap = {};
  (v.violation_details || []).forEach(d => { if (d.issue_id && !compMap[d.issue_id]) compMap[d.issue_id] = d.component; });
  const topRows = (v.top_cves || []).slice(0, 6).map(r => `
    <tr><td class="idcell">${esc(r.id)}</td>
        <td class="comp">${esc(compMap[r.id] ? shortComponent(compMap[r.id]) : '—')}</td>
        <td><span class="sev ${sevClass(r.severity)}">${esc(String(r.severity||'').toUpperCase())}</span></td>
        <td class="r"><span class="num">${fmt(r.hits)}</span></td></tr>`).join('');
  const topPanel = `<div class="panel flush">
    <div class="ph"><h3>Top critical exposure</h3><a href="${esc((DATA.meta&&DATA.meta.url)||'#')}">Open in Xray →</a></div>
    <table class="dt"><thead><tr><th>Issue</th><th>Component</th><th>Severity</th><th class="r">Hits</th></tr></thead>
    <tbody>${topRows || `<tr><td colspan="4" class="empty" style="padding:20px">No critical findings in this window.</td></tr>`}</tbody></table>
  </div>`;

  // coverage gaps
  const blockP = p.curation_policies_block || 0, dryP = p.curation_policies_dry_run || 0;
  const covPanel = `<div class="panel flush"><div class="ph"><h3>Coverage &amp; enforcement</h3></div><div class="pbody">
    ${covRow('Xray indexing', p.repos_indexed, p.repos_total, 'var(--info)')}
    ${covRow('Curation on supported remotes', cn.connected, cn.total, 'var(--green)')}
    ${covRow('Policies enforcing (vs dry-run)', blockP, blockP+dryP, 'var(--med)', `${fmt(blockP)} block · ${fmt(dryP)} dry-run`)}
    ${covRow('Active watches', p.watches_active, p.watches_total, 'var(--navy-600)')}
  </div></div>`;

  const obs = (DATA.curation && DATA.curation.observation) || '';
  return attnBlock + benefitLine + kpis + insights + `<div class="grid-2 wide-l">${topPanel}${covPanel}</div>`;
}
function covRow(label, a, b, color, subOverride){
  const pc = pctOf(a, b);
  return `<div class="cov-row">
    <div class="cov-rh"><b>${esc(label)}</b><span class="v">${fmt(a)} / ${fmt(b)}</span></div>
    <div class="cov-track"><div class="cov-fill" style="width:${pc}%;background:${color}"></div></div>
    <div class="cov-sub">${subOverride ? esc(subOverride) : pc + '% covered · ' + fmt((Number(b)||0)-(Number(a)||0)) + ' remaining'}</div>
  </div>`;
}

/* ═══ CURATION TAB ═══ */
function buildCuration(){
  const c = DATA.curation || {}, m = DATA.meta || {}, p = DATA.platform || {};
  const cei = c.executive_insights || {};
  if (!c.available) return {
    activity: `<div class="empty"><div class="ico">i</div><b>Curation data unavailable</b><p>No curation activity was collected for this window.</p></div>`,
    policies: '',
    audit: '',
    users: ''
  };
  const rr = c.request_results || {};
  const waiverRequests = c.waiver_requests || {};
  const userContext = c.active_user_context || {};
  const cleanPackages = c.clean_packages != null ? c.clean_packages : (rr.clean_packages != null ? rr.clean_packages : c.approved);
  const withoutInspection = rr.without_inspection != null ? rr.without_inspection : c.without_inspection;
  const cn = connStats();
  const noAuditEvents = Number(c.total || 0) === 0;
  // Identities that received a package, vs identities merely seen at the gate.
  // Equal on most instances, so only surface the number when it differs —
  // a divergence means someone was blocked on every request they made.
  const usersApproved = c.unique_users_approved;
  const usersBlockedOnly = (usersApproved != null && c.unique_users != null)
    ? Number(c.unique_users) - Number(usersApproved) : 0;
  const periodLabel = [m.date_from, m.date_to].filter(Boolean).join(' to ');
  const auditEmptyNote = noAuditEvents ? `<div class="note warn"><b>No Curation audit events returned for this period.</b> The Curation audit API reported zero package-gate rows${periodLabel ? ' for ' + esc(periodLabel) : ''}. Configuration coverage is still shown below, including connected remotes, dry-run policies, and policy inventory.</div>` : '';

  const kpis = `<div class="kpis">
    <div class="kpi k-navy"><div class="n">${fmt(c.total)}</div><div class="l">${noAuditEvents ? 'Audit events' : 'Requests screened'}</div><div class="d">${noAuditEvents ? 'none returned for this period' : 'at the package gate'}</div></div>
    <div class="kpi k-crit"><div class="n">${fmt(c.blocked)}</div><div class="l">Blocked</div><div class="d">${(c.block_rate!=null?c.block_rate:pctOf(c.blocked,c.total))}% block rate</div></div>
    <div class="kpi k-green"><div class="n">${fmt(cleanPackages)}</div><div class="l">Clean packages</div><div class="d">${c.clean_rate!=null?c.clean_rate:pctOf(cleanPackages,(Number(cleanPackages)||0)+(Number(c.blocked)||0))}% of policy decisions</div></div>
    <div class="kpi k-crit"><div class="n">${fmt(withoutInspection)}</div><div class="l">Without inspection</div><div class="d">bypassed policy evaluation</div></div>
    <div class="kpi k-med"><div class="n">${fmt(rr.dry_run)}</div><div class="l">Dry-run observed</div><div class="d">not enforced</div></div>
    <div class="kpi k-info"><div class="n">${fmt(c.unique_users)}</div><div class="l">Active users</div><div class="d">${userContext.baseline_available?`${fmt(userContext.usage_vs_baseline_pct)}% of ${fmt(userContext.baseline_users)} planning baseline`:usersBlockedOnly>0?`${fmt(usersApproved)} received a package`:'distinct requester identities'}${userContext.trend?.available?` · ${(userContext.trend.delta||0)>0?'+':''}${fmt(userContext.trend.delta)} vs prior`:''}</div></div>
  </div>`;

  // block reasons
  const br = c.by_reason || {};
  const reasons = [['Malicious','malicious','var(--crit)'],['Security','security','var(--high)'],['License','license','var(--info)'],['Operational','operational','var(--med)']];
  const totalBlocked = c.blocked || 0;
  const reasonRows = reasons.filter(r=>(br[r[1]]||0)>0).map(r=>`
    <div class="sevr"><span class="dot" style="background:${r[2]}"></span><span class="lbl">${r[0]}</span>
    <span class="ct">${fmt(br[r[1]])}</span><span class="pc">${pctOf(br[r[1]],totalBlocked)}%</span></div>`).join('')
    || `<div class="cov-sub">No blocks recorded in this window.</div>`;
  const reasonPanel = `<div class="panel flush"><div class="ph"><h3>Why packages were blocked</h3></div><div class="pbody"><div class="sevlist">${reasonRows}</div></div></div>`;

  // unique packages blocked at the gate
  const topBlocked = c.top_blocked || [];
  const blockedRows = topBlocked.slice(0,10).map(x=>`<tr>
    <td class="comp">${esc(x.package)}</td>
    <td><span class="pt">${esc(x.ecosystem||'unknown')}</span></td>
    <td>${x.malicious?'<span class="sev sev-crit">MALICIOUS</span>':'<span class="meta">Policy violation</span>'}</td>
    <td class="r"><span class="num">${fmt(x.count)}</span></td>
  </tr>`).join('');
  const blockedPanel = `<div class="panel flush"><div class="ph"><h3>Top blocked packages</h3><span class="meta">${fmt((DATA.benefit||{}).unique_blocked_packages||topBlocked.length)} unique packages · showing top ${fmt(Math.min(10,topBlocked.length))} · malicious first</span></div>
    <table class="dt"><thead><tr><th>Package</th><th>Ecosystem</th><th>Reason</th><th class="r">Blocks</th></tr></thead><tbody>${blockedRows||`<tr><td colspan="4" class="empty" style="padding:20px">No blocked packages.</td></tr>`}</tbody></table></div>`;

  // top blocking policies
  const tp = ((c.policies_enforced||{}).by_policy || []).filter(x => (x.audit_hits||0)>0);
  const polRows = tp.slice(0,10).map(x=>{
    let scopeLabel = x.scope_label || '';
    if (/seen in audit only/i.test(scopeLabel)) scopeLabel = 'Audit-only (not enforced)';
    return `<tr><td class="comp">${esc(x.name)}</td><td>${esc(scopeLabel)}</td>
    <td class="r"><span class="num">${fmt(x.blocked_hits)}</span></td>
    <td class="r"><span class="num">${fmt(x.clean_hits)}</span></td>
    <td class="r"><span class="num">${fmt(x.blocked_pct)}%</span></td>
    <td class="r"><span class="num">${fmt(x.clean_pct)}%</span></td></tr>`;
  }).join('');
  const polPanel = `<div class="panel flush"><div class="ph"><h3>Protection by policy</h3><span class="meta">policy-evaluated outcomes only</span></div>
    <table class="dt"><thead><tr><th>Policy</th><th>Scope</th><th class="r">Blocked</th><th class="r">Clean</th><th class="r">Block %</th><th class="r">Clean %</th></tr></thead><tbody>${polRows||`<tr><td colspan="6" class="empty" style="padding:20px">No policy-attributed decisions.</td></tr>`}</tbody></table></div>`;

  // top users — highlight concentration without rendering thousands of rows
  const users = (c.top_users || []).slice(0, 20);
  const maxEv = Math.max(1, ...users.map(u=>u.events||0));
  // Brief mode collects no package breakdown, so that column would be a run of
  // dashes. Show the curated repositories instead, which are collected in both
  // modes because their cardinality is bounded.
  const briefUsers = String(c.user_detail_mode||'full').toLowerCase() === 'brief';
  const userCol = briefUsers ? 'Curated repositories' : 'Top requested packages';
  const userDetailCell = (u) => briefUsers
    ? ((u.repos||[]).map(esc).join('<br>') || '—')
    : ((u.packages||[]).slice(0,3).map(p=>`${esc(p.package)} <span class="meta">(${esc(p.ecosystem)} · ${fmt(p.requests)})</span>`).join('<br>') || '—');
  const userRows = users.map(u=>`
    <tr><td class="comp">${esc(u.user)}</td>
    <td class="r"><span class="num">${fmt(u.events)}</span></td>
    <td class="r"><span class="num">${fmt(u.events_pct)}%</span></td>
    <td class="r">${(u.blocked||0)>0?`<span class="status st-block">${fmt(u.blocked)}</span>`:`<span class="num" style="color:var(--muted)">0</span>`}</td>
    <td class="desc">${userDetailCell(u)}</td>
    <td class="r" style="width:100px"><div class="minibar"><div class="t"><div class="f" style="width:${pctOf(u.events,maxEv)}%;background:var(--navy-600)"></div></div></div></td></tr>`).join('');
  const activeUserCount = c.unique_users != null ? c.unique_users : users.length;
  const userExport = exportHref('curation_user_package_activity_csv');
  const userButton = userExport ? `<a class="showmore" style="width:auto;border:0;padding:0" href="${esc(userExport)}" download>Download full CSV</a>` : `<button class="showmore" style="width:auto;border:0;padding:0" onclick="downloadCurationUsers()">Download full CSV</button>`;
  const userPanel = `<div class="panel flush"><div class="ph"><h3>Active users</h3><span class="meta">Top ${fmt(users.length)} of ${fmt(activeUserCount)} users observed in Curation activity${usersBlockedOnly>0?` · ${fmt(usersApproved)} received a package, ${fmt(usersBlockedOnly)} blocked on every request`:''}</span>${userButton}</div>
    <table class="dt"><thead><tr><th>User</th><th class="r">Requests</th><th class="r">Share</th><th class="r">Blocked</th><th>${userCol}</th><th class="r">Activity</th></tr></thead><tbody>${userRows||`<tr><td colspan="6" class="empty" style="padding:20px">No user activity.</td></tr>`}</tbody></table></div>`;

  // One canonical ecosystem table: supported package types, gap-first. This
  // replaces separate coverage, uncovered, and mini gap panels that repeated
  // the same repository counts with subtly different denominators.
  const byType = (cn && (DATA.platform.curation_state||{}).by_package_type) || ((DATA.curation.curation_state||{}).by_package_type) || [];
  const supportedByType = [...byType].filter(t => t && t.supported === true);
  const typesSorted = [...supportedByType].sort((a,b)=>{
    const gapA = (a.remote_total||0)-(a.connected||0), gapB = (b.remote_total||0)-(b.connected||0);
    return gapB-gapA || (b.remote_total||0)-(a.remote_total||0);
  });
  const typeRows = typesSorted.map(t=>{
    const pc = pctOf(t.connected, t.remote_total);
    const gap = Math.max(0, (t.remote_total||0)-(t.connected||0));
    const col = pc>=100?'var(--green)':pc>=50?'var(--med)':'var(--crit)';
    return `<tr><td class="ptcell">${packageTypeCell(t.package_type)}</td>
      <td class="r" style="width:180px"><div class="minibar"><div class="t"><div class="f" style="width:${pc}%;background:${col}"></div></div><span class="num">${fmt(t.connected)}/${fmt(t.remote_total)}</span></div></td>
      <td class="r">${gap?`<span style="font-weight:700;color:var(--crit)">${fmt(gap)}</span>`:'<span class="sev sev-low">COVERED</span>'}</td>
      <td class="r">${(t.blocked_packages_period||t.blocked_period||t.blocked||0)>0?`<span class="num">${fmt(t.blocked_packages_period||t.blocked_period||t.blocked)}</span>`:`<span style="color:var(--muted)">—</span>`}</td></tr>`;
  }).join('');
  const typePanel = `<div class="panel flush"><div class="ph"><h3>Gate coverage by supported ecosystem</h3><span class="meta">${fmt((DATA.platform.curation_state||{}).supported_not_connected)} supported remotes not enabled · gap-first</span></div>
    <table class="dt"><thead><tr><th>Package type</th><th class="r">Connected / Total</th><th class="r">Gap</th><th class="r">Blocks this period</th></tr></thead><tbody>${typeRows||`<tr><td colspan="4" class="empty" style="padding:20px">No supported remote repositories discovered.</td></tr>`}</tbody></table></div>`;

  const passThrough = p.pass_through_repos || [];
  const supportedPassThrough = passThrough.filter(x=>x.supported).length;
  const unsupportedPassThrough = passThrough.length - supportedPassThrough;
  const passThroughRows = passThrough.slice(0,25).map(x=>`<tr>
    <td class="comp">${esc(x.repo)}</td>
    <td class="ptcell">${packageTypeCell(x.package_type||'unknown')}</td>
    <td>${x.supported?'<span class="sev sev-med">NOT ENABLED</span>':'<span class="meta">Unsupported ecosystem</span>'}</td>
  </tr>`).join('');
  const passThroughPanel = passThrough.length ? `<div class="panel flush">
    <div class="ph"><h3>Remote repositories not protected by Curation</h3><span class="meta">${fmt(passThrough.length)} ungated remotes · ${fmt(supportedPassThrough)} supported but not enabled · ${fmt(unsupportedPassThrough)} unsupported ecosystems</span></div>
    <table class="dt"><thead><tr><th>Repository</th><th>Package type</th><th>Coverage status</th></tr></thead><tbody>${passThroughRows}</tbody></table>
  </div>` : '';

  const enforcement = cei.enforcement_opportunity || {};
  const malicious = cei.malicious_package_defense || {};
  const benefit = DATA.benefit || {};
  const inventoryInsights = c.policy_inventory || {};
  const baselinePosture = inventoryInsights.baseline_policy_posture || {};
  const cachePosture = inventoryInsights.cached_package_enforcement || {};
  const insightPanels = `<div class="grid-3">
    <div class="panel flush"><div class="ph"><h3>Enforcement opportunity</h3><span class="meta">dry-run policies</span></div><div class="pbody">
      <div class="sevr"><span class="lbl">Dry-run policies</span><span class="ct">${fmt(enforcement.dry_run_policies)}</span></div>
      <div class="sevr"><span class="lbl">Would-have-blocked events</span><span class="ct">${fmt(enforcement.would_have_blocked)}</span></div>
      <div class="cov-sub">Promote validated dry-run policies after false-positive review.</div>
    </div></div>
    <div class="panel flush"><div class="ph"><h3>Malicious package defense</h3><span class="meta">pre-download blocks</span></div><div class="pbody">
      <div class="sevr"><span class="lbl">Malicious blocks</span><span class="ct">${fmt(malicious.malicious_blocks)}</span></div>
      <div class="sevr"><span class="lbl">Malicious policies</span><span class="ct">${fmt(malicious.malicious_policies)}</span></div>
      ${(malicious.top_packages||[]).slice(0,3).map(x=>`<div class="cov-sub"><b>${esc(x.package)}</b> · ${fmt(x.blocks)} blocks</div>`).join('')}
    </div></div>
    <div class="panel flush"><div class="ph"><h3>Upgrade after block</h3><span class="meta">user behavior change</span></div><div class="pbody">
      <div class="sevr"><span class="lbl">Upgrade rate</span><span class="ct">${benefit.upgrade_rate_computed?fmt(benefit.upgrade_rate)+'%':'—'}</span></div>
      <div class="sevr"><span class="lbl">Packages upgraded</span><span class="ct">${fmt(benefit.upgraded_packages)}</span></div>
      <div class="cov-sub">Blocked packages later requested at a higher approved version.</div>
    </div></div>
    <div class="panel flush"><div class="ph"><h3>Recommended policy baseline</h3><span class="meta">malicious-package blocking</span></div><div class="pbody">
      <div class="sevr"><span class="lbl">Block malicious org-wide</span><span class="ct">${baselinePosture.block_malicious_org_wide?'Applied':'Missing'}</span></div>
      ${(baselinePosture.matching_policies||[]).slice(0,3).map(name=>`<div class="cov-sub">${esc(name)}</div>`).join('')}
    </div></div>
    <div class="panel flush"><div class="ph"><h3>Cached-package enforcement</h3><span class="meta">per-policy coverage</span></div><div class="pbody">
      <div class="sevr"><span class="lbl">Blocking policies covered</span><span class="ct">${fmt(cachePosture.policies_enforcing_cache)} / ${fmt(cachePosture.blocking_policies_total)}</span></div>
      <div class="cov-sub">${(cachePosture.policies_missing_cache_enforcement||[]).length?fmt(cachePosture.policies_missing_cache_enforcement.length)+' policies do not enforce on cache':'All discovered blocking policies enforce on cache.'}</div>
      <div class="cov-sub">Global cached-package setting: ${cachePosture.global_enabled==null?'not exposed by collected API':cachePosture.global_enabled?'enabled':'disabled'}</div>
    </div></div>
  </div>`;

  // Audit CTA — full detail lives in the Curation Audit UI, not replicated here
  const auditUrl = ((m.url||'').replace(/\/$/,'')) + (m.curation_audit_ui_path || '/ui/package-curation/audit');
  const auditCount = (c.audit_events_display_meta&&c.audit_events_display_meta.total_blocked) || c.blocked || 0;
  const cta = `<div class="audit-cta"><div class="txt"><b>Full blocked-download audit trail</b><span>${noAuditEvents ? 'No blocked-download audit events were returned for this report period' : fmt(auditCount) + ' blocked events this window · every request with package, version, policy, requester & timestamp'}</span></div><a class="btn" href="${esc(auditUrl)}">Open Curation Audit →</a></div>`;

  const waiverAging = waiverRequests.pending_aging || {};
  const waiverPanel = `<div class="panel flush"><div class="ph"><h3>Waiver governance</h3><span class="meta">${waiverRequests.available?'current workflow backlog':'API unavailable'}</span></div><div class="pbody">
    <div class="sevr"><span class="lbl">Pending</span><span class="ct">${waiverRequests.available?fmt(waiverRequests.pending):'—'}</span></div>
    <div class="sevr"><span class="lbl">Approved</span><span class="ct">${waiverRequests.available?fmt(waiverRequests.approved):'—'}</span></div>
    <div class="sevr"><span class="lbl">Rejected</span><span class="ct">${waiverRequests.available?fmt(waiverRequests.rejected):'—'}</span></div>
    ${waiverAging.available?`<div class="cov-sub"><b>Oldest pending:</b> ${fmt(waiverAging.oldest_pending_days)} days</div>${(waiverAging.buckets||[]).map(x=>`<div class="cov-sub">${esc(x.label)} · ${fmt(x.count)}</div>`).join('')}`:'<div class="cov-sub">Pending-request age is unavailable or there is no backlog.</div>'}
  </div></div>`;

  const obs = c.observation ? `<div class="note"><b>What this means.</b> ${esc(c.observation)}</div>` : '';

  // ── Policy inventory by risk type + full block catalog ──────────────────
  const pi = (c.policies_enforced && c.policies_enforced.policy_inventory) || c.policy_inventory || {};
  const byRisk = pi.by_risk_type || [];
  const blockByRisk = pi.block_by_risk_type || [];
  const blockPols = pi.block_policies || [];

  const riskTypeColors = {security:'var(--high)',operational:'var(--med)',malicious:'var(--crit)',legal:'var(--info)',unknown:'var(--muted)'};
  const riskChips = byRisk.map(r => `<div style="text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:12px 8px">
    <div style="font-size:22px;font-weight:800;color:var(--navy);line-height:1;padding-bottom:6px">${fmt(r.count)}</div>
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">${esc(r.type)}</div>
    ${blockByRisk.find(b=>b.type===r.type) ? `<div style="font-size:10px;color:var(--fg-2);margin-top:3px;font-family:var(--mono)">${fmt(blockByRisk.find(b=>b.type===r.type).count)} blocking</div>` : ''}
  </div>`).join('');

  const riskPanel = byRisk.length ? `<div class="panel" style="margin-bottom:14px">
    <div class="ph"><h3>Curation policies by risk category</h3><span class="meta">${fmt(pi.total_registered||pi.block_active||0)} total · ${fmt(pi.block_active||0)} block · ${fmt(pi.dry_run_active||0)} dry-run</span></div>
    <div class="pbody"><div style="display:grid;grid-template-columns:repeat(${byRisk.length||4},1fr);gap:12px">${riskChips}</div></div>
  </div>` : '';

  const dryRunPolicyRows = (pi.dry_run_policies||[]).map(pol=>`<tr>
    <td class="comp">${esc(pol.name)}</td><td>${esc(pol.scope||'—')}</td>
    <td class="r"><span class="num">${pol.days_in_dry_run==null?'—':fmt(pol.days_in_dry_run)}</span></td>
  </tr>`).join('');
  const maturityPanel = dryRunPolicyRows ? `<div class="panel flush">
    <div class="ph"><h3>Policies still in dry-run</h3><span class="meta">${fmt((pi.dry_run_policies||[]).length)} policies · all listed</span></div>
    <table class="dt"><thead><tr><th>Policy</th><th>Scope</th><th class="r">Days in dry-run</th></tr></thead><tbody>${dryRunPolicyRows}</tbody></table>
  </div>` : '';

  // Block policy catalog grouped by risk type — all executive categories are visible
  const catGroupOrder = ['security','malicious','legal','operational'];
  const catGroupColors = {security:'var(--high)',malicious:'var(--crit)',legal:'var(--info)',operational:'var(--med)',unknown:'var(--muted)'};
  const catGroupLabel  = {security:'Security',malicious:'Malicious',legal:'Legal',operational:'Operational',unknown:'Other'};
  const catGrouped = {};
  blockPols.forEach(pol => { const k = catGroupOrder.includes((pol.risk_type||'').toLowerCase()) ? (pol.risk_type||'').toLowerCase() : 'operational'; (catGrouped[k]||(catGrouped[k]=[])).push(pol); });
  const catGroupSections = catGroupOrder.map(k => {
    const pols = catGrouped[k] || [];
    const rows = pols.map(pol => `<tr>
      <td class="comp" style="font-weight:600">${esc(pol.name)}</td>
      <td class="comp" style="color:var(--fg-2)">${esc(pol.scope||'')}</td>
      <td class="desc">${esc(truncate(pol.condition||'',100))}</td>
    </tr>`).join('');
    return `<div class="cat-section${k==='security'?' open':''}">
      <button class="cat-btn${k==='security'?' on':''}" type="button">
        <span class="chev">›</span>
        <span class="tag-pill" style="color:${catGroupColors[k]};min-width:84px;text-align:center">${catGroupLabel[k]}</span>
        <span class="cat-title">${fmt(pols.length)} polic${pols.length===1?'y':'ies'}</span>
        <span class="cat-sub">${pols.length ? pols.map(p=>esc(truncate(p.name,22))).slice(0,3).join(', ') + (pols.length>3?' ...':'') : 'No blocking policies in this category'}</span>
      </button>
      <div class="cat-body">
        <table class="dt" style="margin:0"><thead><tr><th>Policy name</th><th>Scope</th><th>Condition</th></tr></thead><tbody>${rows||`<tr><td colspan="3" class="empty" style="padding:20px">No blocking policies in this category.</td></tr>`}</tbody></table>
      </div>
    </div>`;
  }).join('');
  const catPanel = blockPols.length ? `<div class="panel flush" id="polCatPanel">
    <div class="ph"><h3>Block policy catalog</h3><span class="meta">${fmt(blockPols.length)} policies · expand a category to see all</span></div>
    ${catGroupSections}
  </div>` : '';

  return {
    activity: auditEmptyNote + kpis + obs +
      `<div class="grid-2">${blockedPanel}${reasonPanel}</div>` +
      typePanel + passThroughPanel + insightPanels + `<div class="grid-2"><div>${waiverPanel}</div><div>${cta}</div></div>`,
    policies: polPanel + riskPanel + maturityPanel + catPanel,
    audit: '',
    users: userPanel
  };
}

/* ═══ XRAY TAB ═══ */
function buildXray(){
  const v = DATA.violations || {}, sev = v.by_severity || {}, byType = v.by_type || {};
  const ei = v.executive_insights || {};
  const g = DATA.governance || {}, l = DATA.license || {}, o = DATA.operational || {}, p2 = DATA.platform || {};
  const severityTotal = (sev.critical||0)+(sev.high||0)+(sev.medium||0)+(sev.low||0)+(sev.unknown||0);
  const uniqueFindings = v.unique_issue_count != null ? v.unique_issue_count : severityTotal;
  const uniqueCritical = v.unique_critical_issue_count != null ? v.unique_critical_issue_count : ((v.critical_issues || []).length || 0);
  const sevDef = [['Critical','critical','#b91c1c'],['High','high','#ef6c00'],['Medium','medium','#f2b705'],['Low','low','#3a86f9'],['Unknown / info','unknown','#94a3b8']];
  const distTotal = severityTotal || 1;
  const distBar = sevDef.filter(s=>(sev[s[1]]||0)>0).map(s=>{
    const pc = (sev[s[1]]/distTotal*100);
    return `<span title="${esc(s[0])}: ${fmt(sev[s[1]])}" style="background:${s[2]};width:${pc}%">${pc>9?fmt(sev[s[1]]):''}</span>`;
  }).join('');
  const sevRows = sevDef.map(s=>`<div class="sevr"><span class="dot" style="background:${s[2]}"></span><span class="lbl">${s[0]}</span><span class="ct">${fmt(sev[s[1]])}</span><span class="pc">${(v.severity_pct&&v.severity_pct[s[1]]!=null?v.severity_pct[s[1]]:pctOf(sev[s[1]],distTotal))}%</span></div>`).join('');

  const kpis = `<div class="kpis">
    <div class="kpi k-crit"><div class="n">${fmt(sev.critical)}</div><div class="l">Critical occurrences</div><div class="d">${fmt(uniqueCritical)} unique critical issues/CVEs</div></div>
    <div class="kpi k-med"><div class="n">${fmt(sev.high)}</div><div class="l">High occurrences</div><div class="d">${(v.severity_pct&&v.severity_pct.high)||pctOf(sev.high,distTotal)}% of all occurrences</div></div>
    <div class="kpi k-info"><div class="n">${fmt(uniqueFindings)}</div><div class="l">Unique issues/CVEs</div><div class="d">deduplicated across artifacts</div></div>
    <div class="kpi k-green"><div class="n">${fmt(v.total)}</div><div class="l">Total occurrences</div><div class="d">inside indexed repositories</div></div>
  </div>`;

  const distPanel = `<div class="panel flush"><div class="ph"><h3>Severity distribution</h3><span class="meta">${fmt(uniqueFindings)} unique findings</span></div><div class="pbody">
    <div class="dist">${distBar||`<span style="background:var(--line-2);width:100%;color:var(--muted)">No findings</span>`}</div>
    <div class="sevlist">${sevRows}</div></div></div>`;

  const sla = ei.sla_risk_backlog || {};
  const slaBuckets = sla.buckets || [];
  const maxSla = Math.max(1, ...slaBuckets.map(x=>x.hits||0));
  const slaRows = slaBuckets.map(x=>`<div class="cov-row">
    <div class="cov-rh"><b>${esc(x.label)}</b><span class="v">${fmt(x.issues)} issues · ${fmt(x.hits)} hits</span></div>
    <div class="cov-track"><div class="cov-fill" style="width:${pctOf(x.hits,maxSla)}%;background:${x.label==='90+ days'?'var(--crit)':x.label==='31-90 days'?'var(--high)':'var(--med)'}"></div></div>
  </div>`).join('');
  const slaPanel = `<div class="panel flush"><div class="ph"><h3>SLA risk backlog</h3><span class="meta">${fmt(sla.sla_breach_issues)} beyond ${fmt(sla.sla_days||30)} days</span></div><div class="pbody">${slaRows||'<div class="cov-sub">No critical SLA backlog recorded.</div>'}</div></div>`;

  const rr = ei.remediation_readiness || {};
  const totalReadiness = (rr.fix_available_issues||0) + (rr.no_fix_issues||0) + (rr.unknown_issues||0);
  const readinessPanel = `<div class="panel flush"><div class="ph"><h3>Remediation readiness</h3><span class="meta">critical issues</span></div><div class="pbody">
    ${covRow('Fix available', rr.fix_available_issues, totalReadiness, 'var(--green)', `${fmt(rr.fix_available_hits)} artifact hits`)}
    ${covRow('No fix recorded', rr.no_fix_issues, totalReadiness, 'var(--med)')}
    ${covRow('Fix status unknown', rr.unknown_issues, totalReadiness, 'var(--muted)')}
  </div></div>`;

  const exploit = v.exploitability_summary || {};
  const exploitTotal = (exploit.applicable_issues||exploit.active_issues||0) + (exploit.poc_issues||0) + (exploit.not_applicable_issues||exploit.none_issues||0) + (exploit.undetermined_issues||0) + (exploit.unknown_issues||0);
  const exploitPanel = `<div class="panel flush"><div class="ph"><h3>Exploitability context</h3><span class="meta">${exploit.data_available?'JAS contextual analysis on critical issues':'not exposed on collected violations'}</span></div><div class="pbody">
    ${exploit.data_available
      ? `${covRow('Applicable', exploit.applicable_issues||exploit.active_issues, exploitTotal, 'var(--crit)', 'reachable / confirmed by contextual analysis')}
         ${covRow('Not applicable', exploit.not_applicable_issues||exploit.none_issues, exploitTotal, 'var(--green)', 'present but not reachable in scanned context')}
         ${covRow('Undetermined', exploit.undetermined_issues, exploitTotal, 'var(--med)', 'scanner ran without a conclusive result')}
         ${(exploit.unknown_issues||0)>0?`<div class="cov-sub">${fmt(exploit.unknown_issues)} critical issues had no applicability payload.</div>`:''}`
      : '<div class="cov-sub">No JAS applicability data was present on these violation rows. Severity remains the prioritization fallback; unknown is not treated as not exploitable.</div>'}
  </div></div>`;

  const impact = ei.highest_impact_fixes || [];
  const impactRows = impact.slice(0,6).map(x=>`<tr><td class="comp">${esc(shortComponent(x.component))}</td><td class="r"><span class="num">${fmt(x.critical_issues)}</span></td><td class="r"><span class="num">${fmt(x.hits)}</span></td><td class="r"><span class="num">${esc(x.hit_share_pct!=null?x.hit_share_pct+'%':'')}</span></td></tr>`).join('');
  const impactPanel = `<div class="panel flush"><div class="ph"><h3>Highest-impact fixes</h3><span class="meta">components with the most critical hits</span></div>
    <table class="dt"><thead><tr><th>Component</th><th class="r">Critical IDs</th><th class="r">Hits</th><th class="r">Share</th></tr></thead><tbody>${impactRows||`<tr><td colspan="4" class="empty" style="padding:20px">No fix clusters detected.</td></tr>`}</tbody></table></div>`;

  const newCrit = ei.new_critical_introductions || {};
  const newPanel = newCrit.comparable
    ? `<div class="panel flush"><div class="ph"><h3>New critical introductions</h3><span class="meta">vs ${esc(newCrit.previous_date||'prior snapshot')}</span></div><div class="pbody">
        <div class="sevr"><span class="lbl">New critical issues</span><span class="ct">${fmt(newCrit.new_issues)}</span></div>
        <div class="sevr"><span class="lbl">New artifact hits</span><span class="ct">${fmt(newCrit.new_hits)}</span></div>
        <div class="sevr"><span class="lbl">Existing critical issues</span><span class="ct">${fmt(newCrit.existing_issues)}</span></div>
        <div class="cov-sub">Trend history is under Trend &amp; Comparison.</div>
      </div></div>`
    : `<div class="panel flush"><div class="ph"><h3>New critical introductions</h3><span class="meta">baseline pending</span></div><div class="pbody">
        <div class="cov-sub">${esc(newCrit.incomparable_reason||'Baseline becomes available after the next comparable snapshot.')}</div>
      </div></div>`;

  // One canonical watch/policy hit table. governance adds event share to the
  // same hit rows previously repeated as "most triggered" and "effectiveness".
  const tw = g.xray_policy_effectiveness || g.policy_effectiveness || v.top_watch_policies || [];
  const maxW = Math.max(1, ...tw.map(x=>x.hits||0));
  const watchRows = tw.slice(0,6).map(x=>`<tr><td class="comp">${esc(x.policy)}</td><td><span class="tag-pill">${esc(x.type||'')}</span></td>
    <td class="r" style="width:150px"><div class="minibar"><div class="t"><div class="f" style="width:${pctOf(x.hits,maxW)}%;background:var(--navy-600)"></div></div><span class="num">${fmt(x.hits)}</span></div></td>
    <td class="r"><span class="num">${x.pct_of_events!=null?fmt(x.pct_of_events)+'%':'—'}</span></td></tr>`).join('');
  const watchPanel = `<div class="panel flush"><div class="ph"><h3>Watch &amp; policy hits</h3><span class="meta">trigger volume and share</span></div>
    <table class="dt"><thead><tr><th>Watch / policy</th><th>Type</th><th class="r">Hits</th><th class="r">Share</th></tr></thead><tbody>${watchRows||`<tr><td colspan="4" class="empty" style="padding:20px">No watch activity.</td></tr>`}</tbody></table></div>`;

  const blind = ei.watch_blind_spots || [], blindMeta = ei.watch_blind_spots_meta || {};
  const blindRows = blind.slice(0,8).map(x=>{
    const repo = x.repo || x.repository || 'Repository not exposed by Xray payload';
    return `<tr><td class="comp">${esc(repo)}</td><td class="r"><span class="num">${fmt(x.violation_count)}</span></td><td class="r"><span class="num">${fmt(x.critical_count)}</span></td><td><span class="sev ${x.risk_level==='critical'?'sev-crit':'sev-med'}">${esc(String(x.risk_level||'elevated').toUpperCase())}</span></td></tr>`;
  }).join('');
  const blindPanel = `<div class="panel flush"><div class="ph"><h3>Watch blind spots</h3><span class="meta">repos with violations but no watch mapping</span></div>
    ${blindRows ? `<table class="dt"><thead><tr><th>Repository</th><th class="r">Violations</th><th class="r">Critical</th><th>Risk</th></tr></thead><tbody>${blindRows}</tbody></table>` : `<div class="empty"><div class="ico">✓</div><b>No watch blind spots found</b><p>${esc(blindMeta.available === false ? (blindMeta.reason || 'Watch assignment details were not available.') : 'All mapped repositories with violations have watch coverage.')}</p></div>`}
  </div>`;

  const blast = ei.blast_radius || [];
  const blastRows = blast.slice(0,8).map(x=>`<tr><td class="idcell">${esc(x.issue)}</td><td class="comp">${esc(shortComponent(x.component))}</td><td class="r"><span class="num">${fmt(x.repos)}</span></td><td class="r"><span class="num">${fmt(x.artifacts)}</span></td><td class="r"><span class="num">${fmt(x.hits)}</span></td></tr>`).join('');
  const blastPanel = `<div class="panel flush"><div class="ph"><h3>Blast radius</h3><span class="meta">critical issues by repo and artifact spread</span></div>
    <table class="dt"><thead><tr><th>Issue</th><th>Component</th><th class="r">Repos</th><th class="r">Artifacts</th><th class="r">Hits</th></tr></thead><tbody>${blastRows||`<tr><td colspan="5" class="empty" style="padding:20px">No blast-radius data recorded.</td></tr>`}</tbody></table></div>`;

  // Critical issues — sourced from Xray violations API, severity=Critical, enriched with JFrog Research descriptions
  const ci = v.critical_issues || [];
  const ciShown = 10;
  const hasExploitData = (v.exploitability_summary || {}).data_available === true || ci.some(r => ['applicable','poc','not_applicable','undetermined','active','none'].includes(String(r.exploit_status||'').toLowerCase()));
  const exploitLabel = (status) => {
    const s = String(status||'').toLowerCase();
    if (s === 'applicable' || s === 'active') return ['sev-crit', 'APPLICABLE'];
    if (s === 'poc') return ['sev-high', 'POC'];
    if (s === 'not_applicable' || s === 'none') return ['sev-low', 'NOT APPLICABLE'];
    if (s === 'undetermined') return ['sev-med', 'UNDETERMINED'];
    return ['', 'NOT CAPTURED'];
  };
  const hasEnvironmentData = ci.some(r => (r.affected_environments||[]).some(knownValue));
  const hasPlaybookData = ci.some(r => safeHttpHref(r.playbook_link));
  const ciHeadOptional = [
    hasExploitData ? '<th>Applicability</th>' : '',
    hasEnvironmentData ? '<th>Environment</th>' : '',
    hasPlaybookData ? '<th>Playbook</th>' : '',
  ].join('');
  const ciColspan = 6 + (hasExploitData ? 1 : 0) + (hasEnvironmentData ? 1 : 0) + (hasPlaybookData ? 1 : 0);
  const ciRows = ci.map((r,i)=>{
    const [exploitClass, exploitText] = exploitLabel(r.exploit_status);
    return `<tr class="${i>=ciShown?'row-more':''}">
    <td class="idcell">${esc(r.id)}</td>
    <td class="comp">${esc(shortComponent(r.component||'—'))}</td>
    <td class="desc">${esc(truncate(r.description, 160))}</td>
    <td class="r"><span class="num">${fmt(r.hits)}</span></td>
    <td class="r"><span class="num">${fmt(r.days_open)}</span></td>
    <td>${r.fix_status==='available'?`<span class="sev sev-low">FIX AVAILABLE</span><div class="meta">${esc((r.fix_versions||[]).slice(0,2).join(', '))}</div>`:`<span class="meta">${esc(r.fix_status||'unknown')}</span>`}</td>
    ${hasExploitData?`<td>${exploitClass?`<span class="sev ${exploitClass}">${exploitText}</span>`:`<span class="meta">${exploitText}</span>`}</td>`:''}
    ${hasEnvironmentData?`<td class="desc">${esc((r.affected_environments||[]).filter(knownValue).join(', ')||'—')}</td>`:''}
    ${hasPlaybookData?`<td>${safeHttpHref(r.playbook_link)?`<a href="${esc(safeHttpHref(r.playbook_link))}">Runbook →</a>`:'—'}</td>`:''}</tr>`;
  }).join('');
  const ciPanel = `<div class="panel flush" id="ciPanel">
    <div class="ph"><h3>Critical issues</h3><button class="showmore" style="width:auto;border:0;padding:0" onclick="downloadXrayIssues()">Download CSV</button></div>
    <table class="dt"><thead><tr><th>Issue ID</th><th>Component</th><th>Description</th><th class="r">Occurrences</th><th class="r">Days open</th><th>Fix</th>${ciHeadOptional}</tr></thead><tbody>${ciRows||`<tr><td colspan="${ciColspan}" class="empty" style="padding:20px">No critical issues recorded in this window.</td></tr>`}</tbody></table>
    ${ci.length>ciShown?`<button class="showmore" data-target="ciPanel"><span class="more-label">Show all ${fmt(ci.length)} issues</span><span class="less-label">Show top ${ciShown}</span></button>`:''}
  </div>`;

  const obs = v.observation ? `<div class="note"><b>What this means.</b> ${esc(v.observation)}</div>` : '';

  const topRepos = v.top_repos || [];
  const hasBusinessService = topRepos.some(x => knownValue(x.business_service));
  const hasRepoCriticality = topRepos.some(x => knownValue(x.criticality));
  const hasRepoEnvironment = topRepos.some(x => knownValue(x.environment));
  const topRepoHead = [
    '<th>Repository</th>',
    hasBusinessService ? '<th>Business service</th>' : '',
    hasRepoCriticality ? '<th>Criticality</th>' : '',
    hasRepoEnvironment ? '<th>Environment</th>' : '',
    '<th class="r">Critical</th>',
    '<th class="r">Occurrences</th>',
  ].join('');
  const topRepoColspan = 3 + (hasBusinessService ? 1 : 0) + (hasRepoCriticality ? 1 : 0) + (hasRepoEnvironment ? 1 : 0);
  const topRepoRows = topRepos.slice(0,10).map(x=>`<tr><td class="comp">${esc(x.repo)}</td>${hasBusinessService?`<td>${esc(x.business_service||'—')}</td>`:''}${hasRepoCriticality?`<td><span class="sev ${x.criticality==='critical'?'sev-crit':x.criticality==='high'?'sev-high':'sev-med'}">${esc(knownValue(x.criticality)?String(x.criticality).toUpperCase():'—')}</span></td>`:''}${hasRepoEnvironment?`<td>${esc(x.environment||'—')}</td>`:''}<td class="r"><span class="num">${fmt(x.critical)}</span></td><td class="r"><span class="num">${fmt(x.count)}</span></td></tr>`).join('');
  const topRepoPanel = `<div class="panel flush"><div class="ph"><h3>Repositories with the most exposure</h3><span class="meta">ranked by critical then total violations</span></div>
    <table class="dt"><thead><tr>${topRepoHead}</tr></thead><tbody>${topRepoRows||`<tr><td colspan="${topRepoColspan}" class="empty" style="padding:20px">Repository attribution unavailable.</td></tr>`}</tbody></table></div>`;

  const velocity = DATA.threat_velocity || {};
  const cmp = DATA.comparison || {};
  const velocityPeriods = velocity.periods || [];
  const num = (v, suffix='') => v == null ? '<span class="num" style="color:var(--muted)">—</span>' : `<span class="num">${fmt(v)}${suffix}</span>`;
  const velocityRows = velocityPeriods.map(x=>`<tr><td class="mono">${esc(x.label)}</td><td class="r">${num(x.critical)}</td><td class="r">${num(x.violations)}</td><td class="r">${num(x.violations_per_indexed_repo)}</td><td class="r">${num(x.block_rate,'%')}</td><td class="r">${num(x.active_users)}</td></tr>`).join('');
  const trendCard = (label, key, lowerIsBetter=true) => {
    const vals = velocityPeriods.filter(x => x[key] != null).map(x => Number(x[key]) || 0);
    if (vals.length < 2) {
      return `<div class="vel-card flat"><div class="vh"><b>${esc(label)}</b><span>—</span></div><div class="cov-sub">Comparable history starts with this report.</div></div>`;
    }
    const first = vals[0], last = vals[vals.length - 1];
    const delta = last - first;
    const state = delta === 0 ? 'flat' : ((delta < 0) === lowerIsBetter ? 'good' : 'bad');
    const max = Math.max(1, ...vals);
    const bars = vals.map(v => `<i title="${fmt(v)}" style="height:${Math.max(8, pctOf(v, max))}%"></i>`).join('');
    const sign = delta > 0 ? '+' : '';
    return `<div class="vel-card ${state}"><div class="vh"><b>${esc(label)}</b><span>${sign}${fmt(delta)}</span></div><div class="spark">${bars}</div></div>`;
  };
  const velocityCards = `<div class="velocity-summary">
    ${trendCard('Critical occurrences', 'critical', true)}
    ${trendCard('Violations per indexed repo', 'violations_per_indexed_repo', true)}
    ${trendCard('Curation block rate', 'block_rate', false)}
    ${trendCard('Active Curation users', 'active_users', false)}
  </div>`;
  const velocityPanel = velocity.available ? `<div class="panel flush"><div class="ph"><h3>Threat velocity</h3><span class="meta">last ${fmt(velocityPeriods.length)} validated reports</span></div>
    ${velocityCards}
    <table class="dt"><thead><tr><th>Period</th><th class="r">Critical</th><th class="r">Violations</th><th class="r">Per indexed repo</th><th class="r">Block rate</th><th class="r">Active users</th></tr></thead><tbody>${velocityRows}</tbody></table>
    <div class="velocity-note"><div class="cov-sub">${esc(velocity.trend_summary||'')}</div></div></div>` : `<div class="panel flush"><div class="ph"><h3>Threat velocity</h3><span class="meta">Not available</span></div><div class="empty"><div class="ico">↗</div><b>Trend comparison requires two validated runs</b><p>${esc(velocity.trend_summary||'The next report will add period-over-period critical, violation, and gate-block trends.')}</p></div></div>`;

  const comparisonPanel = (() => {
    if (!cmp.available) return `<div class="panel flush"><div class="ph"><h3>Compared with previous report</h3><span class="meta">No baseline</span></div><div class="empty"><div class="ico">↗</div><b>No prior snapshot found</b><p>The next validated run will add current, previous, and delta values.</p></div></div>`;
    const cv = cmp.violations || {}, cc = cmp.curation || {}, sd = cmp.signal_deltas || {};
    const deltaCell = (val, goodWhenDown) => {
      if (val == null) return '<span class="num" style="color:var(--muted)">—</span>';
      const up = val > 0, good = goodWhenDown ? !up : up;
      const color = val === 0 ? 'var(--muted)' : good ? 'var(--green-700)' : 'var(--crit)';
      return `<span class="num" style="color:${color}">${val>0?'+':''}${fmt(val)}</span>`;
    };
    const cell = (val, suffix='') => val == null ? '<span class="num" style="color:var(--muted)">—</span>' : `<span class="num">${fmt(val)}${suffix}</span>`;
    const incomparable = cmp.violations_comparable === false
      ? `<div class="note warn" style="margin:12px 16px 0"><b>Violation deltas withheld:</b> ${esc(cmp.incomparable_reason||'')}</div>` : '';
    return `<div class="panel flush"><div class="ph"><h3>Compared with previous report</h3><span class="meta">baseline ${esc(cmp.previous_date||'prior snapshot')}</span></div>
      ${incomparable}
      <table class="dt"><thead><tr><th>Metric</th><th class="r">Current</th><th class="r">Previous</th><th class="r">Delta</th></tr></thead><tbody>
        <tr><td>Critical occurrences</td><td class="r">${cell(cv.critical)}</td><td class="r">${cell(cv.critical_previous)}</td><td class="r">${deltaCell(cv.critical_delta, true)}</td></tr>
        <tr><td>Total violations</td><td class="r">${cell(cv.total)}</td><td class="r">${cell(cv.total_previous)}</td><td class="r">${deltaCell(cv.total_delta, true)}</td></tr>
        <tr><td>Indexing coverage gap</td><td class="r">${cell((v.posture_signals||{}).coverage_gap,'%')}</td><td class="r">${cell(sd.coverage_gap_prev,'%')}</td><td class="r">${deltaCell(sd.coverage_gap, true)}</td></tr>
        <tr><td>Blocked at gate</td><td class="r">${cell(cc.blocked)}</td><td class="r">${cell(cc.blocked_previous)}</td><td class="r">${deltaCell(cc.blocked_delta, false)}</td></tr>
        <tr><td>Active Curation users</td><td class="r">${cell(cc.active_users)}</td><td class="r">${cell(cc.active_users_previous)}</td><td class="r">${deltaCell(cc.active_users_delta, false)}</td></tr>
        <tr><td>New critical issues</td><td class="r">${cell(newCrit.comparable?newCrit.new_issues:null)}</td><td class="r"><span class="num" style="color:var(--muted)">—</span></td><td class="r"><span class="num" style="color:var(--muted)">${newCrit.comparable?'this period':'baseline pending'}</span></td></tr>
      </tbody></table>
      ${newCrit.comparable?`<div class="velocity-note"><div class="cov-sub">${fmt(newCrit.new_issues)} new critical IDs this period (${fmt(newCrit.new_hits)} hits) vs ${fmt(newCrit.existing_issues)} still open from the prior baseline of ${fmt(newCrit.previous_critical_ids)}.</div></div>`:newCrit.incomparable_reason?`<div class="velocity-note"><div class="cov-sub">${esc(newCrit.incomparable_reason)}</div></div>`:''}
      </div>`;
  })();

  const watchCoverage = (DATA.governance||{}).repo_watch_coverage || [];
  const watchMeta = blindMeta || {};
  const watchCoverageRows = watchCoverage.slice(0,12).map(x=>`<tr><td class="comp">${esc(x.repo)}</td><td class="r"><span class="num">${fmt(x.watch_count)}</span></td><td class="r"><span class="num">${fmt(x.critical_count)}</span></td><td><span class="sev ${x.risk_level==='critical'?'sev-crit':x.risk_level==='high'?'sev-high':'sev-low'}">${esc(String(x.risk_level||'covered').toUpperCase())}</span></td></tr>`).join('');
  const mappedWatchRepos = watchCoverage.filter(x => (x.watch_count||0) > 0).length;
  const watchCoveragePanel = watchCoverage.length && watchMeta.available !== false && mappedWatchRepos > 1 ? `<div class="panel flush"><div class="ph"><h3>Watch-to-repository coverage</h3><span class="meta">mapped repository assignments</span></div>
    <table class="dt"><thead><tr><th>Repository</th><th class="r">Watches</th><th class="r">Critical</th><th>Coverage</th></tr></thead><tbody>${watchCoverageRows}</tbody></table></div>` : '';

  // License + operational compliance
  const licBlock = (l.total>0)
    ? `<div class="panel flush"><div class="ph"><h3>License compliance</h3><span class="meta">${fmt(l.total)} violations</span></div><div class="pbody">${(l.licenses||[]).slice(0,8).map(x=>`<div class="sevr"><span class="lbl">${esc(x.license||x.name||'License')}</span><span class="ct">${fmt(x.count||x.hits||0)}</span></div>`).join('')||'<div class="cov-sub">Detail available in Xray.</div>'}</div></div>`
    : `<div class="panel flush"><div class="ph"><h3>License compliance</h3></div><div class="empty"><div class="ico">\u2713</div><b>No license violations</b><p>No license-policy violations were reported in this window.</p></div></div>`;
  const opBlock = (o.total>0)
    ? `<div class="panel flush"><div class="ph"><h3>Operational risk</h3><span class="meta">${fmt(o.total)} findings</span></div><div class="pbody">${(o.top_components||[]).slice(0,8).map(x=>`<div class="sevr"><span class="lbl">${esc(x.component||x.name||'Component')}</span><span class="ct">${fmt(x.count||x.hits||0)}</span></div>`).join('')||'<div class="cov-sub">Detail available in Xray.</div>'}</div></div>`
    : `<div class="panel flush"><div class="ph"><h3>Operational risk</h3></div><div class="empty"><div class="ico">\u2713</div><b>No operational findings</b><p>No deprecated or end-of-life component risks were reported this window.</p></div></div>`;

  

  // Unindexed repositories — show repos not covered by Xray; if individual names unavailable show count + link
  const repoPanel = (() => {
    const unindexedNames = p2.unindexed_repo_names || [];
    const unindexedCount = (p2.repos_total||0) - (p2.repos_indexed||0);
    if (unindexedNames.length) {
      return `<div class="panel" style="margin-bottom:14px">
        <div class="ph"><h3>Unindexed repositories</h3><span class="meta" style="color:var(--crit)">${fmt(unindexedNames.length)} repos with no Xray coverage — violations in these are invisible to this report</span></div>
        <div class="pbody">
          <input type="text" id="repoSearch" placeholder="Filter ${fmt(unindexedNames.length)} repositories\u2026"
            style="width:100%;padding:7px 10px;border:1px solid var(--hair);border-radius:var(--r-m);font-size:12px;font-family:var(--mono);color:var(--ink);background:var(--canvas);outline:none;margin-bottom:10px"
            oninput="filterRepos(this)">
          <div id="repoList" style="max-height:200px;overflow-y:auto;margin:0 -16px;padding:0 16px 4px">
            <ul style="list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:2px 20px">
              ${unindexedNames.map(n=>`<li data-r="${esc(n)}" style="font-family:var(--mono);font-size:11px;color:var(--crit);padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(n)}">${esc(n)}</li>`).join('')}
            </ul>
          </div>
        </div>
      </div>`;
    }
    if (unindexedCount > 0) {
      const xrayUrl = ((p2.url||DATA.meta?.url||'').replace(/\/$/,'')) + '/ui/xray/indexedResources';
      return `<div class="note"><b>${fmt(unindexedCount)} repositories are not indexed by Xray.</b> Violations in these repos are invisible to this report. <a href="${esc(xrayUrl)}" style="color:var(--navy);font-weight:600">Review in Xray → Indexed Resources</a></div>`;
    }
    return '';
  })();

  return {
    posture: kpis + obs + `<div class="grid-2 wide-l">${distPanel}${slaPanel}</div>` +
      `<div class="grid-2">${impactPanel}${newPanel}</div><div class="grid-2">${readinessPanel}${exploitPanel}</div>`,
    critical: ciPanel,
    governance: `<div class="grid-2 wide-l">${watchPanel}${topRepoPanel}</div>` +
      (watchCoveragePanel ? `<div class="grid-2"><div class="span-2">${watchCoveragePanel}</div></div>` : '') +
      `<div class="grid-2">${blindPanel}${blastPanel}</div>` +
      `<div class="grid-2">${licBlock}${opBlock}</div>` + repoPanel,
    velocity: comparisonPanel + velocityPanel
  };
}

/* ═══ RECOMMENDATIONS TAB ═══ */
function buildRecommendations(){
  const produced = DATA.recommendations || [];
  const order = {P1:0,P2:1,P3:2};
  const actions = produced.length ? produced.map(r=>({
    pri:r.priority||'P3',
    effort:cap(r.effort||''),
    title:r.title||r.text||'Security action',
    body:r.detail||'',
    owner:r.owner,
    dueDate:r.due_date,
    score:r.score,
    metric:'',
    link:null
  })).sort((a,b)=>(order[a.pri]??9)-(order[b.pri]??9)||(Number(b.score)||0)-(Number(a.score)||0)) : computeActions();
  if (!actions.length) return `<div class="empty"><div class="ico">✓</div><b>No actions outstanding</b><p>Your posture is clean for this window.</p></div>`;
  const note = `<div class="note"><b>Prioritized for impact.</b> Each action is derived from this period's data and ordered P1 → P3. Owners and due dates establish accountability. <button class="btn-link" onclick="downloadRecommendations()">Download CSV</button></div>`;
  const cards = actions.map((a,i)=>`
    <div class="rec-card ${(a.pri||'p3').toLowerCase()}">
      <div class="rec-rank">${i+1}</div>
      <div class="rec-main">
        <div class="rec-top"><span class="act-pill pill-${(a.pri||'p3').toLowerCase()}">${esc(a.pri)}</span><h3>${esc(a.title)}</h3></div>
        <div class="rec-body">${esc(a.body)}</div>
        <div class="rec-foot">
          ${a.effort?`<span class="chip-eff">Effort: ${esc(a.effort)}</span>`:''}
          ${a.owner?`<span class="chip-eff">Owner: ${esc(a.owner)}</span>`:''}
          ${a.dueDate?`<span class="chip-eff">Due: ${esc(a.dueDate)}</span>`:''}
          ${a.score!=null?`<span class="chip-eff">Score: ${fmt(a.score)}</span>`:''}
          ${a.metric?`<span class="chip-eff" style="font-family:var(--mono)">${esc(a.metric)}</span>`:''}
          ${a.link?`<span class="rec-link">→ ${esc(a.link)}</span>`:''}
        </div>
      </div>
    </div>`).join('');
  return note + `<div class="rec-list">${cards}</div>`;
}

/* ═══ FOOTER ═══ */
function buildFooter(){
  const m = DATA.meta || {};
  return `<div class="footer">
    <b>${esc((m.report_type||'Weekly'))} Security Report</b> · ${esc(m.host||m.server_id||'')} · ${esc(m.date_from||'')} – ${esc(m.date_to||'')} · generated ${esc(m.generated||'')}.
  </div>`;
}

/* ═══ REPO SEARCH ═══ */
window.filterRepos = function(el){
  var v = el.value.toLowerCase();
  var list = document.getElementById('repoList');
  if (!list) return;
  list.querySelectorAll('[data-r]').forEach(function(li){
    li.style.display = li.dataset.r.toLowerCase().indexOf(v) > -1 ? '' : 'none';
  });
};

function downloadCsv(filename, headers, rows, preamble){
  const cell = value => `"${String(value==null?'':value).replace(/"/g,'""')}"`;
  const body = [headers, ...rows].map(row => row.map(cell).join(',')).join('\n');
  // Metadata lines are written as properly quoted single cells (no "#" prefix),
  // so a spreadsheet shows tidy rows instead of comment text split across columns.
  const csv = (preamble && preamble.length ? preamble.map(l => l ? cell(l) : '').join('\n')+'\n' : '') + body;
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}
window.downloadCurationUsers = function(){
  // Fallback for a standalone report opened without its sibling CSV. The full
  // export is emptied out of the payload, so build from the embedded top users.
  const curation = DATA.curation||{};
  const brief = String(curation.user_detail_mode||'full').toLowerCase() === 'brief';
  const ranked = (curation.top_users||[]).slice().sort((a,b) => (b.events||0)-(a.events||0));
  const rows = ranked.map((u, i) => {
    const total = u.events||0;
    const row = [
      i+1, u.user, total, u.events_pct, u.blocked, u.approved,
      total ? Math.round((u.blocked||0)/total*1000)/10 : 0,
      (u.repos||[]).join('; ')
    ];
    if (!brief) {
      const packages = (u.packages||[]).slice().sort((a,b) => (b.requests||0)-(a.requests||0));
      // packages[] is capped by collection, so prefer the period-wide breadth
      // fields and leave them blank rather than reporting the truncated count.
      const ecosystems = u.ecosystems || null;
      row.push(
        u.distinct_packages==null ? '' : u.distinct_packages,
        ecosystems ? ecosystems.join('; ') : '',
        packages.slice(0,10).map(p => `${p.package} (${p.requests})`).join('; ')
      );
    }
    return row;
  });
  const headers = ['rank','user','total_requests','request_share_pct','blocked','clean_approved',
                   'block_rate_pct','curated_repos'];
  if (!brief) headers.push('distinct_packages','ecosystems','top_packages');
  const m = DATA.meta||{};
  const period = [m.date_from, m.date_to].filter(Boolean).join(' to ');
  const preamble = ['Metric: Active Curation Users',
     'Definition: ' + ACTIVE_USER_NOTE_TEXT,
     'Reporting period: ' + (period || 'not recorded'),
     'Active Users in this period: ' + ((curation.unique_users!=null) ? curation.unique_users : ranked.length)];
  if (brief) {
    preamble.push('',
      'Package detail omitted: this report was generated in brief mode, which',
      'records per-user request counts and curated repositories only.');
  }
  preamble.push('',
    'This is the in-browser fallback, written when the report is opened without',
    'its sibling curation-user-package-activity.csv. It carries the per-user',
    'summary for the top ' + ranked.length + ' users only. The file written next to the report',
    'also carries every user' + (brief ? '.' : ' and the full per-repo request detail.'));
  downloadCsv('curation-active-users.csv', headers, rows, preamble);
};
window.downloadXrayIssues = function(){
  const rows = ((DATA.violations||{}).critical_issues||[]).map(issue => [
    issue.id, issue.component, issue.description, issue.hits, issue.repo_count, issue.artifact_count,
    issue.first_seen, issue.days_open, issue.fix_status, (issue.fix_versions||[]).join('|'),
    issue.exploit_status, (issue.affected_environments||[]).join('|'), issue.playbook_link||''
  ]);
  downloadCsv('xray-critical-issues.csv',
    ['issue_id','component','description','hits','repositories','artifacts','first_seen','days_open','fix_status','fix_versions','exploit_status','environments','playbook_link'], rows);
};
window.downloadRecommendations = function(){
  const rows = (DATA.recommendations||[]).map(rec => [
    rec.priority,rec.score,rec.title||rec.text,rec.detail,rec.effort,rec.owner,rec.due_date,(rec.dependencies||[]).join('|')
  ]);
  downloadCsv('security-recommendations.csv',
    ['priority','score','title','detail','effort','owner','due_date','dependencies'], rows);
};

/* ═══ MOUNT ═══ */
(function mount(){
  const root = document.getElementById('report');
  const reportType = esc((DATA.meta&&DATA.meta.report_type)||'Weekly');
  const curation = (() => { try { return buildCuration(); } catch (e) { console.error(e); return {activity:`<div class="note warn"><b>Section error:</b> ${esc(e.message)}</div>`,policies:'',audit:'',users:''}; } })();
  const xray = (() => { try { return buildXray(); } catch (e) { console.error(e); return {posture:`<div class="note warn"><b>Section error:</b> ${esc(e.message)}</div>`,critical:'',governance:'',velocity:''}; } })();
  root.innerHTML = `<div class="dashboard-shell">
    ${safe('Sidebar', buildSidebar)}
    <main class="dashboard-main">
      ${safe('Top bar', buildTopbar)}
      <div class="dashboard-content">
        <h1 class="page-title">${reportType} CISO Report</h1>
        ${sectionWrap('summary', 'Executive Summary', '',
          safe('Briefing', buildBriefing) + `<div class="section-overview">${safe('Overview', buildOverview)}</div>`)}
        ${sectionWrap('curation', 'Curation Activity', 'Supply-chain gate', curation.activity || '')}
        ${sectionWrap('policies', 'Policy Inventory', 'Gate enforcement', curation.policies || '')}
        ${sectionWrap('users', 'Active Users', 'Request volume', curation.users || '')}
        ${sectionWrap('xray', 'Xray Posture', 'Security exposure', xray.posture || '')}
        ${sectionWrap('critical', 'Critical Issues', 'Open now', xray.critical || '')}
        ${sectionWrap('governance', 'Watches & Effectiveness', 'Coverage and blind spots', xray.governance || '')}
        ${sectionWrap('recommendations', 'Recommended Actions', 'Owners and due dates', safe('Recommendations', buildRecommendations))}
        ${sectionWrap('velocity', 'Trend & Comparison', 'Normalized movement and prior period', xray.velocity || '')}
        ${buildFooter()}
      </div>
    </main>
  </div>`;

  document.title = `CISO Security Report — ${(DATA.meta&&DATA.meta.host)||''} — ${(DATA.meta&&DATA.meta.generated)||''}`;

  // Supplied template navigation: one-page scroll with active step indicator.
  const navLinks = [...root.querySelectorAll('.side-nav a')];
  const sectionFor = link => document.getElementById(link.getAttribute('href').slice(1));
  const syncNav = () => {
    let active = navLinks[0];
    navLinks.forEach(link => {
      const target = sectionFor(link);
      if (target && target.getBoundingClientRect().top <= 120) active = link;
    });
    // Trailing sections never push their heading up to the trigger line once
    // the page is scrolled to the end, which would leave the highlight stuck
    // on an earlier section. At the bottom, select the last visible section.
    const doc = document.documentElement;
    const scrollable = doc.scrollHeight - window.innerHeight > 4;
    if (scrollable && window.innerHeight + window.scrollY >= doc.scrollHeight - 2) {
      for (let i = navLinks.length - 1; i >= 0; i--) {
        const target = sectionFor(navLinks[i]);
        if (target && target.getBoundingClientRect().top < window.innerHeight) {
          active = navLinks[i];
          break;
        }
      }
    }
    navLinks.forEach(link => link.classList.toggle('active', link === active));
  };
  window.addEventListener('scroll', syncNav, {passive:true});
  window.addEventListener('resize', syncNav, {passive:true});
  syncNav();

  // show more / less
  root.querySelectorAll('.showmore[data-target]').forEach(btn => {
    btn.addEventListener('click', () => {
      const panel = document.getElementById(btn.dataset.target);
      if (panel) panel.classList.toggle('expanded');
      btn.classList.toggle('expanded');
    });
  });
  root.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const section = btn.closest('.cat-section');
      if (!section) return;
      section.classList.toggle('open');
      btn.classList.toggle('on');
    });
  });
})();
</script>
