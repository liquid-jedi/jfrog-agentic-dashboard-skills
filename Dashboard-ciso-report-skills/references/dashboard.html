<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CISO Security Report</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;9..40,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /*
         * FONT SCALE — 6 sizes only
         * XL  1.5rem  (24px)  KPI numbers
         * L   1.1rem  (18px)  Report title
         * M   0.85rem (14px)  Section headers, card titles, callout titles
         * S   0.75rem (12px)  Body, tables, descriptions, sidebar values
         * XS  0.65rem (10px)  Mono data, table headers, KPI labels, sidebar labels
         * XXS 0.55rem (9px)   Footer, badges, pills
         */
        :root {
            --fs-xl: 1.5rem;
            --fs-l: 1.1rem;
            --fs-m: 0.85rem;
            --fs-s: 0.75rem;
            --fs-xs: 0.65rem;
            --fs-xxs: 0.55rem;

            --bg: #f4f5f7;
            --surface: #fff;
            --alt: #fafbfc;
            --border: #e4e7ec;
            --blt: #eef0f4;
            --bar: #283248;
            --bartx: rgba(255, 255, 255, .85);
            --barmuted: rgba(255, 255, 255, .45);
            --frog: #40be46;
            --flt: #e8f8e9;
            --fdk: #2d8a32;
            --tx: #1a2b4a;
            --tx2: #5a6a82;
            --muted: #8f9bb3;
            --crit: #c0560a;
            --critbg: #fff4e6;
            --high: #d4910a;
            --highbg: #fef9e7;
            --med: #b8a000;
            --medbg: #fefce8;
            --low: #7890a0;
            --lowbg: #f0f4f8;
            --blue: #4a8af0;
            --amber: #d4910a;
            --amberbg: #fef9e7;
            --r: 8px;
            --sh: 0 1px 3px rgba(26, 43, 74, .06)
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--tx);
            line-height: 1.55;
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            font-variant-numeric: tabular-nums
        }

        .side {
            width: 220px;
            background: var(--bar);
            flex-shrink: 0;
            padding: 1.1rem 1rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto
        }

        .side-brand {
            display: flex;
            align-items: center;
            gap: .55rem;
            font-size: var(--fs-m);
            font-weight: 700;
            color: var(--bartx);
            letter-spacing: .02em;
            margin-bottom: .9rem;
            padding-bottom: .65rem;
            border-bottom: 1px solid rgba(255, 255, 255, .1)
        }

        .side-brand svg {
            width: 34px;
            height: auto;
            flex-shrink: 0
        }

        .side-brand-text {
            min-width: 0
        }

        .side-brand span {
            display: block;
            font-size: var(--fs-xxs);
            font-weight: 600;
            color: var(--barmuted);
            text-transform: uppercase;
            letter-spacing: .1em;
            margin-top: .2rem
        }

        .ss {
            border-top: 1px solid rgba(255, 255, 255, .08);
            padding: .6rem 0
        }

        .ss:first-of-type {
            border-top: none
        }

        .sl {
            font-size: var(--fs-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--barmuted);
            margin-bottom: .15rem
        }

        .sv {
            font-size: var(--fs-s);
            color: var(--bartx);
            font-weight: 600;
            line-height: 1.4
        }

        .sv a {
            color: var(--frog);
            text-decoration: none
        }

        .sd {
            font-size: var(--fs-xs);
            color: var(--barmuted);
            line-height: 1.35;
            margin-top: .08rem
        }

        .sw {
            color: var(--amber);
            font-size: var(--fs-xs);
            font-weight: 600
        }

        .sp {
            display: inline-block;
            font-size: var(--fs-xxs);
            padding: .1rem .3rem;
            border-radius: 3px;
            font-weight: 600;
            margin: .1rem .15rem .1rem 0
        }

        .sp.on {
            background: rgba(64, 190, 70, .15);
            color: var(--frog)
        }

        .sp.off {
            background: rgba(212, 145, 10, .12);
            color: var(--amber)
        }

        .main {
            flex: 1;
            overflow-y: auto;
            padding: 1.4rem 2rem 3rem
        }

        .wrap {
            max-width: 1080px
        }

        .sec-head {
            display: flex;
            align-items: flex-start;
            gap: .75rem;
            margin: 2rem 0 .55rem;
            padding-top: .25rem
        }

        .sec-head:first-child {
            margin-top: .5rem
        }

        .sec-title {
            font-family: 'DM Sans', 'Plus Jakarta Sans', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--tx);
            margin: 0;
            line-height: 1.25
        }

        .sec-sub {
            margin: .2rem 0 0 !important
        }

        .band {
            background: var(--alt);
            border: 1px solid var(--blt);
            border-radius: var(--r);
            padding: .9rem 1rem 1rem;
            margin-bottom: 1.25rem
        }

        .band .card {
            box-shadow: none;
            margin-top: .45rem
        }

        .band .card:first-child {
            margin-top: 0
        }

        p.sub {
            font-size: var(--fs-s);
            color: var(--tx2);
            margin-bottom: .5rem
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: .6rem
        }

        .kpis-hero {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: .85rem;
            margin: .65rem 0 .5rem
        }

        .kpi-hero {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 1rem 1.05rem;
            box-shadow: var(--sh)
        }

        .kpi-hero .kpi-n {
            font-size: 2rem;
            line-height: 1.05
        }

        .kpi-hero .kpi-l {
            font-size: var(--fs-xs);
            margin-top: .25rem
        }

        .kpis-secondary {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem;
            margin-bottom: 1.1rem
        }

        .kpi-chip {
            display: inline-flex;
            align-items: baseline;
            gap: .35rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: .32rem .65rem;
            font-size: var(--fs-xs);
            color: var(--tx2)
        }

        .kpi-chip strong {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: var(--fs-s);
            color: var(--tx);
            font-weight: 700
        }

        .severity-hero {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 1rem 1.05rem;
            margin-bottom: .5rem
        }

        .severity-hero .dist {
            height: 18px;
            margin: .5rem 0 .65rem
        }

        .velocity-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: .75rem;
            margin-bottom: .75rem
        }

        .velocity-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .55rem .6rem .45rem
        }

        .velocity-panel .vp-label {
            font-size: var(--fs-xxs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
            margin-bottom: .35rem
        }

        .velocity-bars {
            display: flex;
            align-items: flex-end;
            gap: .35rem;
            height: 72px
        }

        .velocity-bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end
        }

        .velocity-bar {
            width: 100%;
            max-width: 36px;
            border-radius: 4px 4px 2px 2px;
            min-height: 4px
        }

        .velocity-bar-wrap.is-last .velocity-bar {
            opacity: 1
        }

        .velocity-bar-wrap:not(.is-last) .velocity-bar {
            opacity: .55
        }

        .velocity-bar-label {
            font-size: var(--fs-xs);
            font-weight: 600;
            color: var(--tx2);
            margin-top: .35rem;
            text-align: center;
            line-height: 1.2;
            max-width: 72px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .velocity-table .mono {
            font-size: var(--fs-s);
            font-weight: 600
        }

        .outcome-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: .55rem;
            margin: .5rem 0 .75rem
        }

        .outcome-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .65rem .75rem;
            text-align: center
        }

        .outcome-card strong {
            display: block;
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: .2rem
        }

        .outcome-card span {
            font-size: var(--fs-xs);
            font-weight: 600;
            color: var(--tx2)
        }

        .outcome-card small {
            display: block;
            font-size: var(--fs-xxs);
            color: var(--muted);
            margin-top: .2rem;
            line-height: 1.3
        }

        .stat-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: .5rem;
            margin: .45rem 0
        }

        .stat-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .55rem .65rem;
            text-align: center
        }

        .stat-box strong {
            font-size: 1.15rem;
            display: block
        }

        .stat-box span {
            font-size: var(--fs-xxs);
            color: var(--muted);
            font-weight: 600
        }

        .conn-bar {
            height: 10px;
            background: var(--blt);
            border-radius: 5px;
            overflow: hidden;
            margin: .4rem 0
        }

        .conn-bar span {
            display: block;
            height: 100%;
            background: var(--frog)
        }

        .donut-wrap {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            flex-wrap: wrap;
            margin: .5rem 0
        }

        .donut {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0
        }

        .donut-inner {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.25rem;
            line-height: 1.1;
            z-index: 1
        }

        .donut-inner small {
            font-size: var(--fs-xxs);
            font-weight: 600;
            color: var(--muted)
        }

        .donut-legend {
            display: flex;
            flex-direction: column;
            gap: .45rem;
            min-width: 200px
        }

        .donut-legend-item {
            display: flex;
            align-items: center;
            gap: .45rem;
            font-size: var(--fs-s);
            font-weight: 600
        }

        .donut-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0
        }

        .policy-protect {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            padding: .85rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--r);
            background: linear-gradient(90deg, rgba(64, 190, 70, .06), transparent 55%)
        }

        .policy-protect h4 {
            margin: 0;
            color: var(--frog);
            font-size: var(--fs-m);
            font-weight: 700
        }

        .policy-protect p {
            margin: .2rem 0 0;
            font-size: var(--fs-xs);
            color: var(--muted);
            max-width: 420px
        }

        .policy-protect-metrics {
            display: flex;
            align-items: center;
            gap: 1.25rem
        }

        .policy-metric {
            display: flex;
            align-items: baseline;
            gap: .35rem
        }

        .policy-metric strong {
            font-size: 1.5rem;
            font-weight: 800;
            line-height: 1
        }

        .policy-metric.block strong {
            color: var(--frog)
        }

        .policy-metric.dry strong {
            color: var(--amber)
        }

        .policy-metric span {
            font-size: var(--fs-s);
            color: var(--tx2);
            font-weight: 600
        }

        .severity-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: .5rem;
            margin: .5rem 0 .65rem
        }

        .severity-stat {
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .55rem .65rem;
            background: var(--surface)
        }

        .severity-stat strong {
            display: block;
            font-size: 1.2rem;
            font-weight: 800
        }

        .severity-stat span {
            font-size: var(--fs-xs);
            font-weight: 600;
            color: var(--tx2)
        }

        .severity-stat em {
            display: block;
            font-style: normal;
            font-size: var(--fs-xxs);
            color: var(--muted);
            margin-top: .15rem
        }

        .pkg-type-pill {
            display: inline-block;
            padding: .12rem .45rem;
            border-radius: 999px;
            font-size: var(--fs-xxs);
            font-weight: 700
        }

        .pkg-type-pill.ok {
            background: #e8f5e9;
            color: #2e7d32
        }

        .pkg-type-pill.partial {
            background: #fff8e1;
            color: #f57f17
        }

        .violation-type-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: .55rem;
            margin: .55rem 0 .75rem
        }

        .violation-type-card {
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .65rem .75rem;
            background: var(--surface);
            text-align: center
        }

        .violation-type-card strong {
            display: block;
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1.1
        }

        .violation-type-card span {
            font-size: var(--fs-xs);
            font-weight: 700;
            color: var(--tx2)
        }

        .repo-enabled-banner {
            display: flex;
            align-items: baseline;
            gap: .5rem;
            flex-wrap: wrap;
            padding: .7rem .85rem;
            border: 1px solid var(--border);
            border-radius: var(--r);
            background: var(--surface);
            margin: .5rem 0
        }

        .repo-enabled-banner strong {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--frog)
        }

        .rec-cards {
            display: flex;
            flex-direction: column;
            gap: .45rem
        }

        .rec-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 4px solid var(--muted);
            border-radius: var(--r);
            padding: .65rem .85rem
        }

        .rec-card.p1 {
            border-left-color: var(--crit)
        }

        .rec-card.p2 {
            border-left-color: var(--high)
        }

        .rec-card.p3 {
            border-left-color: var(--low)
        }

        .rec-card-title {
            font-family: 'DM Sans', 'Plus Jakarta Sans', sans-serif;
            font-size: var(--fs-m);
            font-weight: 700;
            margin-bottom: .25rem;
            line-height: 1.35
        }

        .rec-card-body {
            font-size: var(--fs-s);
            color: var(--tx2);
            line-height: 1.5
        }

        .rec-card-meta {
            font-size: var(--fs-xxs);
            color: var(--muted);
            margin-top: .3rem
        }

        .kpi {
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: 3px solid var(--muted);
            border-radius: var(--r);
            padding: .65rem .75rem;
            box-shadow: var(--sh);
            text-align: center
        }

        .kpi.red {
            border-top-color: var(--crit)
        }

        .kpi.green {
            border-top-color: var(--frog)
        }

        .kpi.orange {
            border-top-color: var(--high)
        }

        .kpi.gray {
            border-top-color: var(--muted)
        }

        .kpi-n {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: var(--fs-xl);
            font-weight: 700;
            line-height: 1.1
        }

        .kpi-l {
            font-size: var(--fs-xxs);
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .03em;
            margin-top: .1rem
        }

        .kpi-d {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: var(--fs-xxs);
            font-weight: 600;
            margin-top: .1rem;
            display: inline-block;
            padding: .05rem .25rem;
            border-radius: 3px
        }

        .good {
            background: var(--flt);
            color: var(--fdk)
        }

        .bad {
            background: var(--critbg);
            color: var(--crit)
        }

        .nums {
            display: flex;
            gap: .4rem;
            flex-wrap: wrap;
            margin: .45rem 0
        }

        .nb {
            padding: .3rem .6rem;
            border-radius: var(--r);
            font-size: var(--fs-s);
            font-weight: 600;
            border: 1px solid var(--border);
            background: var(--surface)
        }

        .nb strong {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: var(--fs-m);
            margin-right: .2rem
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .85rem;
            box-shadow: var(--sh);
            margin-top: .5rem
        }

        .ch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: .45rem
        }

        .ct {
            font-size: var(--fs-m);
            font-weight: 700
        }

        .cs {
            font-size: var(--fs-xxs);
            color: var(--muted)
        }

        .g2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .6rem
        }

        table.dt {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--fs-s)
        }

        .dt th {
            font-size: var(--fs-xxs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--muted);
            text-align: left;
            padding: .35rem .45rem;
            border-bottom: 2px solid var(--border);
            background: var(--alt)
        }

        .dt td {
            padding: .35rem .45rem;
            border-bottom: 1px solid var(--blt)
        }

        .dt tbody tr:hover td {
            background: var(--alt)
        }

        .dt .num {
            text-align: right;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600
        }

        .mono {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: var(--fs-xs)
        }

        .badge {
            font-size: var(--fs-xxs);
            font-weight: 600;
            padding: .1rem .35rem;
            border-radius: 3px;
            display: inline-block
        }

        .b-crit {
            background: var(--critbg);
            color: var(--crit)
        }

        .b-high {
            background: var(--highbg);
            color: var(--high)
        }

        .b-med {
            background: var(--medbg);
            color: #9a7b00
        }

        .b-low {
            background: var(--lowbg);
            color: var(--low)
        }

        .b-block {
            background: var(--critbg);
            color: var(--crit)
        }

        .b-pass {
            background: var(--flt);
            color: var(--fdk)
        }

        .dist {
            height: 10px;
            display: flex;
            border-radius: 5px;
            overflow: hidden;
            margin: .35rem 0
        }

        .dist span {
            height: 100%
        }

        .sevr {
            display: flex;
            align-items: center;
            gap: .35rem;
            padding: .2rem 0;
            font-size: var(--fs-s)
        }

        .sevr .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0
        }

        .sevr .lbl {
            flex: 1;
            color: var(--tx2)
        }

        .sevr .cnt {
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif
        }

        .callout {
            border-left: 4px solid var(--frog);
            background: var(--flt);
            border-radius: 0 var(--r) var(--r) 0;
            padding: .55rem .8rem;
            margin: .5rem 0;
            font-size: var(--fs-s);
            line-height: 1.5
        }

        .callout.warn {
            border-color: var(--amber);
            background: var(--amberbg)
        }

        .callout.risk {
            border-color: var(--crit);
            background: var(--critbg)
        }

        .callout strong {
            display: block;
            margin-bottom: .1rem;
            font-size: var(--fs-m)
        }

        .ben {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: .8rem;
            box-shadow: var(--sh)
        }

        .ben.gl {
            border-left: 4px solid var(--frog)
        }

        .ben.bl {
            border-left: 4px solid var(--border)
        }

        .ben-t {
            font-size: var(--fs-m);
            font-weight: 700;
            margin-bottom: .3rem
        }

        .ben-h {
            font-size: var(--fs-m);
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: .4rem
        }

        .ben-s {

        function buildTrendSummaryFallback() {
            const t = DATA.threat_velocity || {};
            const periods = Array.isArray(t.periods) ? t.periods : [];
            if (periods.length < 2) return '';
            const prev = periods[periods.length - 2];
            const curr = periods[periods.length - 1];
            const fmtDelta = (label, a, b, goodWhenDown) => {
                const p = Number(a) || 0;
                const c = Number(b) || 0;
                const d = c - p;
                const pct = p !== 0 ? Math.round((d / p) * 100) : (d === 0 ? 0 : 100);
                const dir = d > 0 ? 'rose' : d < 0 ? 'fell' : 'held steady at';
                const tone = d === 0 ? 'neutral' : (goodWhenDown ? (d < 0 ? 'positive' : 'concerning') : (d > 0 ? 'positive' : 'concerning'));
                return { label, from: p, to: c, dir, pct, tone };
            };
            const blocked = fmtDelta('Curation blocks', prev.blocked, curr.blocked, false);
            const violations = fmtDelta('Violations', prev.violations, curr.violations, true);
            const critical = fmtDelta('Critical findings', prev.critical, curr.critical, true);
            const advice = critical.to < critical.from && blocked.to >= blocked.from
                ? 'Gate activity is up while in-repo critical volume is easing — keep enforcement on high-risk remotes and focus remediation on remaining critical XRAY IDs.'
                : critical.to > critical.from
                    ? 'Critical backlog is growing — pair stronger curation block policies with watch-backed scanning on unindexed remotes.'
                    : 'Trends are flat — validate dry-run policies for promotion to block mode where npm/docker volume is highest.';
            return `Blocked downloads ${blocked.dir} ${blocked.from} → ${blocked.to} (${blocked.pct >= 0 ? '+' : ''}${blocked.pct}%). `
                + `Violations ${violations.dir} ${violations.from} → ${violations.to} (${violations.pct >= 0 ? '+' : ''}${violations.pct}%). `

        }

            let withWatch = 0;
            let withoutWatch = 0;
            list.forEach((r) => {

                const wc = Number(r.watch_count);

            const t = DATA.threat_velocity = DATA.threat_velocity || {};
            if (t.available && !Array.isArray(t.periods) && DATA.comparison && DATA.comparison.available) {
                const previousBlocked = (Number(c.blocked) || 0) - (Number(DATA.comparison.curation && DATA.comparison.curation.blocked_delta) || 0);
                const previousViolations = (Number(v.total) || 0) - (Number(DATA.comparison.violations && DATA.comparison.violations.total_delta) || 0);
                const previousCritical = (Number(v.by_severity.critical) || 0) - (Number(DATA.comparison.violations && DATA.comparison.violations.critical_delta) || 0);
                t.periods = [
                    {
                        label: DATA.comparison.previous_date || 'Previous',
                        blocked: previousBlocked,
                        violations: previousViolations,
                        critical: previousCritical
                    },
                    {
                        label: meta.date_to || meta.generated || 'Current',
                        blocked: Number(c.blocked) || 0,
                        violations: Number(v.total) || 0,
                        critical: Number(v.by_severity.critical) || 0
                    }
                ];
            }
            if (!t.trend_summary && t.observation) t.trend_summary = t.observation;
            const stubTrend = /moved from \d+ to \d+;\s*curation blocks moved to \d+\.?$/i.test(String(t.trend_summary || ''))
                || (String(t.trend_summary || '').includes('moved to') && !String(t.trend_summary || '').includes('→'));
            if (!t.trend_summary || stubTrend) {
                const built = buildTrendSummaryFallback();
                if (built) t.trend_summary = built;
            }

            if (Array.isArray(v.top_watch_policies) && v.top_watch_policies.length > 0) {
                const totalHits = v.top_watch_policies.reduce((s, p) => s + (Number(p.hits) || 0), 0) || Math.max(1, Number(v.total) || 1);
                const watchRows = v.top_watch_policies.map((p) => ({
                    policy: p.policy,
                    type: p.type || 'security',
                    hits: Number(p.hits) || 0,
                    pct_of_events: Math.round(((Number(p.hits) || 0) / totalHits) * 100),
                    delta_pct: Number(p.delta_pct) || 0
                }));
                if (!Array.isArray(g.xray_policy_effectiveness) || !g.xray_policy_effectiveness.length) {
                    g.xray_policy_effectiveness = watchRows;
                }
                const pe = g.policy_effectiveness || [];
                const peAllZero = pe.length === 0 || pe.every((x) => (Number(x.hits) || 0) === 0);
                const peAllCuration = pe.length > 0 && pe.every((x) => String(x.type || '').toLowerCase() === 'curation');
                if (peAllZero || peAllCuration) {
                    g.policy_effectiveness = g.xray_policy_effectiveness || watchRows;
                    g._policy_summary_only = false;
                }
            }
            if ((!Array.isArray(g.curation_policy_effectiveness) || !g.curation_policy_effectiveness.length)
                && Array.isArray(c.blocking_events_per_policy) && c.blocking_events_per_policy.length) {
                const blockedTotal = Math.max(Number(c.blocked) || 0, 1);
                g.curation_policy_effectiveness = c.blocking_events_per_policy
                    .filter((row) => (Number(row.blocked_events) || 0) > 0)
                    .map((row) => ({
                        policy: row.name || '—',
                        type: 'curation',
                        hits: Number(row.blocked_events) || 0,
                        pct_of_events: Math.round(((Number(row.blocked_events) || 0) / blockedTotal) * 100),
                        delta_pct: 0,
                        scope_label: row.scope_label
                    }));
            }
            if (Array.isArray(g.repo_watch_coverage) && g.repo_watch_coverage.length > 0) {
                g.repo_watch_summary = computeRepoWatchSummary(g.repo_watch_coverage);
            }
            if (!g.repo_watch_summary && (Number(p.repos_total) || 0) > 0) {
                g.repo_watch_summary = {
                    total: Number(p.repos_total) || 0,
                    indexed: Number(p.repos_indexed) || 0,
                    unindexed: Number(p.repos_unindexed) || 0,
                    withWatch: null,
                    withoutWatch: null,
                    _platform_fallback: true
                };
            }

            augmentRecommendations();

            // Prefer threat_velocity.periods for period comparison when present (avoids stale snapshot deltas).
            syncComparisonFromThreatVelocity();

            if (Array.isArray(DATA.recommendations)) {
                DATA.recommendations = DATA.recommendations.map((item) => ({
                    ...item,
                    detail: item.detail || item.description || item.text || ''
                }));
            }
        }

        function safeRender(sectionTitle, renderFn) {
            try {
                return renderFn();
            } catch (error) {
                console.error(`Render failure in ${sectionTitle}`, error);
                return `
                    <div class="sec red">${sectionTitle}</div>
                    <div class="callout warn">
                        <strong>Section render failed</strong>
                        ${error && error.message ? error.message : 'Unknown render error'}
                    </div>`;
            }
        }

        function getMethodology() {
            const m = DATA.methodology || {};
            const risk = m.risk_score || {};
            const weights = risk.weights || { critical: 100, high: 20, medium: 5, low: 1 };
            const bands = risk.bands || [
                { min: 0, max: 15, label: 'Low weighted exposure', signal: 'Good' },
                { min: 15, max: 35, label: 'Moderate weighted exposure', signal: 'Watch trend' },
                { min: 35, max: 60, label: 'High weighted exposure', signal: 'Bad' },
                { min: 60, max: null, label: 'Critical weighted exposure', signal: 'Very bad' }
            ];
            const severity = m.severity_levels || {
                critical: {
                    meaning: 'Exploit likely or high-impact compromise path.',
                    signal: 'Bad when rising. Best when near zero.'
                },
                high: {
                    meaning: 'Serious weakness requiring near-term remediation.',
                    signal: 'Bad when sustained or rising.'
                },
                medium: {
                    meaning: 'Meaningful risk with lower immediate blast radius.',
                    signal: 'Neutral-to-bad if backlog accumulates.'
                },
                low: {
                    meaning: 'Limited immediate impact; monitor and batch-fix.',
                    signal: 'Generally acceptable if higher severities are controlled.'
                }
            };
            const repoRiskLevels = m.repo_watch_risk_levels || [
                { level: 'critical', rule: 'Repository has critical findings and no watch coverage.' },
                { level: 'high', rule: 'Repository has critical findings or high violation volume.' },
                { level: 'medium', rule: 'Repository has violations, or is indexed with zero watches.' },
                { level: 'low', rule: 'No significant findings and covered.' }
            ];
            const curationActions = m.curation_actions || {
                blocked: 'Denied by policy.',
                approved: 'Explicit override approval.',
                dry_run: 'Alert-only evaluation (dry run).',
                without_inspection: 'Passed through without policy inspection — may be vulnerable or malicious.'
            };
            return { weights, bands, severity, repoRiskLevels, curationActions };
        }

        /* ═══ SIDEBAR ═══ */

                <div class="sl">${label}</div>
                <div class="sv">${warn ? `<span class="sw">${value}</span>` : value}</div>
                ${detail ? `<div class="sd">${detail}</div>` : ''}

        }

            const m = DATA.meta, p = DATA.platform, c = DATA.curation || {};

                : (Number(p.curation_repos_count) > 0 ? `${n(p.curation_repos_count)} remote repos in scope` : null);

                p.curation_enabled ? 'Enabled' : 'Not configured',

            const pe = c.policies_enforced || {};

                ? `${n(pe.enforcing)} block · ${n(pe.dry_run_excluded)} dry-run`

                    : 'Not configured');

            s += sideItem('Xray Indexed',

                pills);

            s += sideItem('Generated', m.generated);

            document.getElementById('sidebar').innerHTML = s;
            document.title = `CISO Report — ${m.server_id} — ${m.generated}`;
        }

        /* ═══ COMPARISON DELTA BADGES ═══ */

        function delta(metrics, label) {
            if (!DATA.comparison || !DATA.comparison.available) return '';
            const m = (DATA.comparison.metrics || []).find(x => x.label === label);
            if (!m) return '';
            const cls = m.good ? 'good' : 'bad';
            const arrow = m.direction === 'down' ? '↓' : m.direction === 'up' ? '↑' : '—';
            return `<div class="kpi-d ${cls}">${arrow} ${Math.abs(m.change_pct)}% vs last</div>`;
        }

        function buildExecutiveSummary() {
            const c = DATA.curation, v = DATA.violations, m = DATA.meta;
            const bullets = [];
            const stats = [];

            if (c.available && Number(c.blocked) > 0) {
                bullets.push(`<strong>Gate defense:</strong> Curation blocked <strong>${n(c.blocked)}</strong> package downloads before they could enter your repositories (${n(c.unique_users || 0)} users active).`);
                stats.push(`<div class="es-stat"><strong>${n(c.blocked)}</strong> blocked at gate</div>`);
            } else if (c.available) {
                bullets.push('<strong>Gate defense:</strong> Curation evaluated packages in this period; no blocks were recorded.');
            }

            if (Number(v.total) > 0) {
                bullets.push(`<strong>Inside repositories:</strong> Xray reported <strong>${n(v.total)}</strong> violations, including <strong>${n(v.by_severity.critical)}</strong> critical findings.`);
                stats.push(`<div class="es-stat"><strong>${n(v.by_severity.critical)}</strong> critical inside</div>`);
            }

            if (v.critical_issues && v.critical_issues.length > 0) {

                bullets.push(`<strong>Top critical exposure:</strong> <span class="mono">${top.id}</span> — ${n(top.hits)} artifact hits${days}.`);

                    <div class="ch"><span class="ct">Policy violations</span><span class="cs">Blocked by type · ${n(pv.total)} events</span></div>

                        <div class="violation-type-card"><strong style="color:var(--amber)">${n(pv.license)}</strong><span>License</span></div>
                        <div class="violation-type-card"><strong>${n(pv.operational)}</strong><span>Operational</span></div>

                        <p>Create policies to block risky OSS on selected packages or set up alerts for your team.</p>

                    return `<tr>
                        <td>${row.package_type || '—'}</td>
                        <td><span class="pkg-type-pill ${pill}">${label}</span></td>
                        <td class="num">${n(connN)} / ${n(tot)}</td>
                        <td class="num">${n(row.blocked_period || 0)}</td>
                    </tr>`;
                }).join('');
                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Package types · repository coverage</span></div>
                        <table class="dt">
                            <thead><tr><th>Package type</th><th>Status</th><th>Connected repos</th><th>Blocked (period)</th></tr></thead>
                            <tbody>${pkgConnRows}</tbody>
                        </table>
                    </div>`;
            }

            if (blockPolicies.length > 0) {
                const polRows = blockPolicies.slice(0, 5).map((pol) =>
                    `<tr>
                        <td>${pol.name || '—'}</td>
                        <td>${pol.scope_label || '—'}</td>
                        <td class="num">${n(pol.blocked_events ?? pol.blocked_hits)}</td>
                        <td class="num">${n(pol.audit_events ?? pol.audit_hits)}</td>
                    </tr>`
                ).join('');
                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Blocking events per policy</span><span class="cs">Top 5 by blocked events</span></div>
                        <table class="dt">
                            <thead><tr><th>Policy</th><th>Scope</th><th>Blocked events</th><th>Audit events</th></tr></thead>
                            <tbody>${polRows}</tbody>
                        </table>
                    </div>`;
            }

            const pe = c.policies_enforced || {};
            if (pe.available || Number(pe.enforcing) > 0 || Number(pe.total_registered) > 0) {
                const scopeRows = (pe.by_scope || []).map((s) =>
                    `<tr>
                        <td>${s.label || s.scope}</td>
                        <td class="num">${n(s.registered)}</td>
                        <td class="num">${n(s.enforcing)}</td>
                    </tr>`
                ).join('');
                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Policy scope</span><span class="cs">${n(pe.enforcing)} enforcing · ${n(pe.dry_run_excluded)} dry-run excluded · ${n(pe.total_registered)} registered</span></div>
                        <p class="sub" style="margin-top:0">Curation package-download policies (separate from Xray watch policies: <strong>${n(p.policies_total)}</strong> on platform).</p>
                        ${scopeRows ? `
                        <table class="dt">
                            <thead><tr><th>Scope</th><th>Registered</th><th>Enforcing (block)</th></tr></thead>
                            <tbody>${scopeRows}</tbody>
                        </table>` : ''}
                    </div>`;
            }

            const blockList = inv.block_policies || [];
            if (blockList.length > 0) {
                const rows = blockList.slice(0, 20).map((pol) =>
                    `<tr>
                        <td>${pol.name}</td>
                        <td>${pol.condition || '—'}</td>
                        <td>${pol.risk_type || '—'}</td>
                        <td>${pol.scope || '—'}</td>
                    </tr>`
                ).join('');
                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Active block policies (by condition)</span></div>
                        <table class="dt">
                            <thead><tr><th>Policy</th><th>Condition</th><th>Risk type</th><th>Scope</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`;
            }

            if (c.top_users && c.top_users.length > 0) {
                const userRows = c.top_users.slice(0, 10).map((u) =>
                    `<tr>
                        <td class="mono">${u.user}</td>
                        <td class="num">${n(u.events)}</td>
                        <td class="num">${n(u.blocked)}</td>
                        <td class="num">${n(u.approved)}</td>
                        <td class="num">${n(u.passed)}</td>
                    </tr>`
                ).join('');
                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Top Curation Users (by activity)</span></div>
                        <table class="dt">
                            <thead><tr><th>User</th><th>Events</th><th>Blocked</th><th>Approved</th><th>Other</th></tr></thead>
                            <tbody>${userRows}</tbody>
                        </table>
                    </div>`;
            }

            if (c.top_blocked && c.top_blocked.length > 0) {
                /* Blocked by ecosystem */
                if (c.by_type && c.by_type.length > 0) {
                    const totalBlocked = c.by_type.reduce((s, t) => s + t.blocked, 0);
                    let ecoRows = c.by_type.filter(t => t.blocked > 0).map(t =>
                        `<tr>
                            <td>${t.type}</td>
                            <td class="num">${n(t.blocked)}</td>
                            <td class="num">${totalBlocked > 0 ? Math.round(t.blocked / totalBlocked * 100) : 0}%</td>
                            <td class="num">${n(t.total)}</td>
                        </tr>`
                    ).join('');
                    html += `
                        <div class="card">
                            <div class="ch"><span class="ct">Blocked Requests by Ecosystem</span></div>
                            <table class="dt">
                                <thead><tr><th>Ecosystem</th><th>Blocked</th><th>% of Blocked</th><th>Total Evaluated</th></tr></thead>
                                <tbody>${ecoRows}</tbody>
                            </table>
                        </div>`;
                }

                let rows = c.top_blocked.map(p =>
                    `<tr>
                        <td class="mono">${p.package}${p.malicious ? ' <span class="badge" style="background:#fce4ec;color:#b71c1c">Malicious</span>' : ''}</td>
                        <td>${p.ecosystem}</td>
                        <td class="num">${n(p.count)}</td>
                    </tr>`
                ).join('');

                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Top Blocked Packages</span></div>
                        <table class="dt">
                            <thead><tr><th>Package</th><th>Ecosystem</th><th>Block Count</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`;
            }

            if (c.observation) {
                html += `
                    <div class="callout">
                        <strong>Curation note</strong>
                        ${c.observation}
                    </div>`;
            }

            html += buildCurationAuditLinkCard();
            html += '</div>';
            return html;
        }

        /* ═══ SECTION 3: XRAY — SECURITY POSTURE ═══ */

        function buildViolations() {
            const v = DATA.violations, m = DATA.meta;
            const byType = v.by_type, bySev = v.by_severity;
            const sevTotal = (Number(bySev.critical) || 0) + (Number(bySev.high) || 0) + (Number(bySev.medium) || 0) + (Number(bySev.low) || 0);
            const sp = {
                critical: sevTotal > 0 ? Math.round(((Number(bySev.critical) || 0) / sevTotal) * 100) : 0,
                high: sevTotal > 0 ? Math.round(((Number(bySev.high) || 0) / sevTotal) * 100) : 0,
                medium: sevTotal > 0 ? Math.round(((Number(bySev.medium) || 0) / sevTotal) * 100) : 0,
                low: sevTotal > 0 ? Math.round(((Number(bySev.low) || 0) / sevTotal) * 100) : 0,
            };

            let html = `
                ${secHead('07', 'Inside the perimeter', `Xray findings in indexed repos · ${m.date_from} – ${m.date_to}`)}
                <div class="band">`;

            /* Severity hero first */
            const sevs = [
                ['Critical', bySev.critical, sp.critical, '--crit'],
                ['High', bySev.high, sp.high, '--high'],
                ['Medium', bySev.medium, sp.medium, '--med'],
                ['Low', bySev.low, sp.low, '--low']
            ];
            const critHigh = (Number(bySev.critical) || 0) + (Number(bySev.high) || 0);
            const critHighPct = sevTotal > 0 ? Math.round((critHigh / sevTotal) * 100) : 0;
            const dominant = [...sevs].sort((a, b) => (Number(b[1]) || 0) - (Number(a[1]) || 0))[0] || ['Critical', 0, 0, '--crit'];
            const dominantPct = sevTotal > 0 ? Math.round(((Number(dominant[1]) || 0) / sevTotal) * 100) : 0;

            let bar = sevs.map(([, , p, c]) =>
                p > 0 ? `<span title="${p}%" style="width:${p}%;background:var(${c})"></span>` : ''
            ).join('');

            let sevRows = sevs.map(([lbl, cnt, p, c]) =>
                `<tr>
                    <td><span class="badge" style="background:var(${c}bg, var(--alt));color:var(${c})">${lbl}</span></td>
                    <td class="num">${n(cnt)}</td>
                    <td class="num">${p}%</td>
                    <td style="width:40%">
                        ${p > 0 ? `<span style="display:inline-block;height:8px;border-radius:4px;width:${p}%;background:var(${c})"></span>` : ''}
                    </td>
                </tr>`
            ).join('');

            html += `
                <div class="severity-hero">
                    <div class="ch"><span class="ct">Severity mix</span><span class="cs">${n(sevTotal)} findings in period</span></div>
                    <div class="severity-stats">
                        ${sevs.map(([lbl, cnt, p, c]) =>
                            `<div class="severity-stat">
                                <strong style="color:var(${c})">${n(cnt)}</strong>
                                <span>${lbl}</span>
                                <em>${p}% of total</em>
                            </div>`
                        ).join('')}
                    </div>
                    <p class="sub" style="margin:0 0 .5rem">
                        <strong>${critHighPct}%</strong> of findings (${n(critHigh)}) are Critical or High — prioritize these first.
                        Largest bucket: <strong>${dominant[0]}</strong> (${dominantPct}%).
                    </p>
                    <div class="dist">${bar}</div>
                    <div class="sevr" style="margin-bottom:.25rem;gap:.8rem;flex-wrap:wrap">
                        ${sevs.map(([lbl, , p, c]) => `<span><span class="dot" style="background:var(${c})"></span> ${lbl}: <span class="cnt">${p}%</span></span>`).join('')}
                    </div>
                    <table class="dt"><tbody>${sevRows}</tbody></table>
                </div>`;

            const types = [
                ['Security', byType.security],
                ['Operational Risk', byType.operational],
                ['License', byType.license]
            ];
            let typeRows = types.map(([t, c]) =>
                `<tr><td>${t}</td><td class="num">${n(c)}</td><td class="num">${pct(c, v.total)}%</td></tr>`
            ).join('');
            typeRows += `<tr style="font-weight:700"><td>Total</td><td class="num">${n(v.total)}</td><td class="num">100%</td></tr>`;

            html += `
                <div class="card">
                    <div class="ch"><span class="ct">By violation type</span></div>
                    <table class="dt">
                        <thead><tr><th>Type</th><th>Count</th><th>% of Total</th></tr></thead>
                        <tbody>${typeRows}</tbody>
                    </table>
                </div>`;

            /* Critical issues — capped at 20 */
            if (v.critical_issues && v.critical_issues.length > 0) {
                const maxShow = 20;
                const totalUnique = v.critical_issues.length;
                const shown = v.critical_issues.slice(0, maxShow);
                let ciRows = shown.map(i =>
                    `<tr>
                        <td class="mono">${i.id}</td>
                        <td>${i.description}</td>
                        <td class="num">${n(i.hits)}</td>
                        <td class="mono">${i.first_seen || '—'}</td>
                        <td class="num">${n(i.days_open || 0)}</td>
                        <td>${i.exploit_status || 'unknown'}</td>
                        <td>${(i.affected_environments || []).join(', ') || '—'}</td>
                        <td>${i.playbook_link ? `<a href="${i.playbook_link}">Playbook</a>` : '—'}</td>
                    </tr>`
                ).join('');

                const capNote = totalUnique > maxShow
                    ? `<p class="sub" style="margin-top:.4rem;font-style:italic">Showing top ${maxShow} of ${totalUnique} unique critical issues. View all in the JFrog Platform.</p>`
                    : '';

                html += `
                    <div class="card">
                        <div class="ch">
                            <span class="ct">Critical issues</span>
                            <span class="cs">${totalUnique} unique</span>
                        </div>
                        <p class="sub" style="margin-top:0">Every unique critical severity vulnerability found in your repositories, grouped by Xray ID. <strong>Hits</strong> = affected artifacts. <strong>Days Open</strong> = calendar days from first seen to report end (${DATA.meta.generated || DATA.meta.date_to || 'report date'}).</p>
                        <table class="dt">
                            <thead><tr><th>Xray ID</th><th>Description</th><th>Hits</th><th>First Seen</th><th>Days Open<span class="col-hint">since first seen</span></th><th>Exploit</th><th>Env</th><th>Runbook</th></tr></thead>
                            <tbody>${ciRows}</tbody>
                        </table>
                        ${capNote}
                    </div>`;
            }

            const topCritical = (v.critical_issues || [])[0];
            const topRepo = (v.top_repos || [])[0];
            const generatedKeyFinding = `Outstanding violations total ${n(v.total)}: `
                + `${n(v.by_type.security || 0)} security, ${n(v.by_type.operational || 0)} operational risk, `
                + `${n(v.by_type.license || 0)} license. `
                + `${n(v.by_severity.critical || 0)} critical and ${n(v.by_severity.high || 0)} high findings. `
                + `${topCritical ? `Top critical issue ${topCritical.id} has ${n(topCritical.hits)} hit(s). ` : ''}`
                + `${topRepo ? `Most impacted path is ${topRepo.repo} (${n(topRepo.count)} hits).` : ''}`;
            const keyFinding = (v.observation && String(v.observation).trim().length > 80) ? v.observation : generatedKeyFinding;

            if (keyFinding) {
                html += `
                    <div class="callout risk">
                        <strong>Key finding</strong>
                        ${keyFinding}
                    </div>`;
            }

            html += `
                <div class="ui-link">
                    Full violation details: <a href="${m.url}/ui/watchesNew/violations">${m.host}/ui/watchesNew/violations</a>
                </div>
                </div>`;

            return html;
        }

        /* ═══ SECTION 4: LICENSE COMPLIANCE ═══ */

        function buildLicense() {
            const l = DATA.license, p = DATA.platform;

            if (!l || l.total === 0) {
                const hasPolicy = p && p.policies_license > 0;
                if (hasPolicy) {
                    return `
                        ${secHead('08', 'License compliance', 'Open-source license policy conflicts.')}
                        <div class="callout">
                            <strong>No violations detected</strong>
                            ${n(p.policies_license)} license compliance ${p.policies_license === 1 ? 'policy is' : 'policies are'} active and monitoring. No license violations were found in this reporting period.
                        </div>`;
                }
                return `
                    ${secHead('08', 'License compliance', 'Open-source license policy conflicts.')}
                    <div class="callout warn">
                        <strong>No license policies configured</strong>
                        There are no license compliance policies set up on this platform. Without license policies, Xray will not flag components with restricted or copyleft licenses. Consider creating a license policy to monitor your exposure.
                    </div>`;
            }

            let rows = (l.licenses || []).map(x =>
                `<tr>
                    <td>${x.spdx}${x.name ? ` (${x.name})` : ''}</td>
                    <td class="num">${x.count.toLocaleString()}</td>
                    <td><span class="badge" style="background:${sevBg(x.severity)};color:${sevColor(x.severity)}">${x.severity}</span></td>
                </tr>`
            ).join('');

            let html = `
                ${secHead('08', 'License compliance', 'Licenses that may require legal review before production use.')}
                <div class="band">
                <div class="card">
                    <table class="dt">
                        <thead><tr><th>License (SPDX)</th><th>Violations</th><th>Severity</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;

            if ((l.top_components || []).length > 0 || (l.top_locations || []).length > 0) {
                html += `<div class="g2">`;
                if ((l.top_components || []).length > 0) {
                    const rows = l.top_components.map(x =>
                        `<tr><td class="mono">${x.component || 'unknown'}</td><td class="num">${n(x.hits || x.count || 0)}</td></tr>`
                    ).join('');
                    html += `
                        <div class="card">
                            <div class="ch"><span class="ct">Top Affected Components</span></div>
                            <table class="dt">
                                <thead><tr><th>Component</th><th>Hits</th></tr></thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>`;
                }
                if ((l.top_locations || []).length > 0) {
                    const rows = l.top_locations.map(x =>
                        `<tr><td class="mono">${x.location || x.repo || 'unknown'}</td><td class="num">${n(x.hits || x.count || 0)}</td></tr>`
                    ).join('');
                    html += `
                        <div class="card">
                            <div class="ch"><span class="ct">Top Impacted Artifact Locations</span></div>
                            <table class="dt">
                                <thead><tr><th>Repository / Path</th><th>Violation Hits</th></tr></thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>`;
                }
                html += `</div>`;
            }

            if (l.observation) {
                html += `
                    <div class="callout warn">
                        <strong>Note</strong>
                        ${l.observation}
                    </div>`;
            }

            html += '</div>';
            return html;
        }

        /* ═══ SECTION 5: OPERATIONAL RISK ═══ */

        function buildOperational() {
            const o = DATA.operational;
            if (!o || o.total === 0) return '';

            let html = `
                ${secHead('09', 'Operational risk', `EOL, outdated, or unmaintained components · ${n(o.total)} violations${o.severity ? ` (${o.severity})` : ''}.`)}
                <div class="band g2">`;

            if (o.top_components && o.top_components.length > 0) {
                let rows = o.top_components.map(c =>
                    `<tr><td class="mono">${c.component}</td><td class="num">${n(c.hits)}</td></tr>`
                ).join('');

                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Top Affected Components</span></div>
                        <table class="dt">
                            <thead><tr><th>Component</th><th>Hits</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`;
            }

            if (o.top_locations && o.top_locations.length > 0) {
                let rows = o.top_locations.map(l =>
                    `<tr><td class="mono">${l.location}</td><td class="num">${n(l.hits)}</td></tr>`
                ).join('');

                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Top Impacted Artifact Locations</span></div>
                        <table class="dt">
                            <thead><tr><th>Repository / Path</th><th>Violation Hits</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`;
            }

            html += '</div>';
            const m = getMethodology();
            const rules = (m.repoRiskLevels || []).map(r => `<span class="mono" style="text-transform:capitalize">${r.level}</span>: ${r.rule}`).join(' ');
            html += `<div class="callout warn"><strong>Risk level method</strong>${rules}</div>`;
            return html;
        }

        /* ═══ SECTION 6: COMBINED SECURITY VALUE ═══ */

        function buildBenefit() {
            const b = DATA.benefit, c = DATA.curation, v = DATA.violations, p = DATA.platform || {};
            const fallbackCoverage = (Number(p.repos_total) || 0) > 0
                ? Math.round(((Number(p.repos_indexed) || 0) / Math.max(1, Number(p.repos_total))) * 1000) / 10
                : 0;
            const coverage = Number(b.xray_coverage || 0) > 0 ? Number(b.xray_coverage) : fallbackCoverage;
            const upgradeRate = Number(b.upgrade_rate);
            const upgradeLabel = b.upgrade_rate_computed && Number.isFinite(upgradeRate)
                ? `${upgradeRate}%`
                : '—';
            const upgradeNote = b.upgrade_rate_computed
                ? 'Share of unique blocked packages later approved at a higher version in the same period.'
                : 'Not computed this run (needs block-then-upgrade detection in audit data).';

            return `
                ${secHead('10', 'Combined value', 'How gate prevention and in-repo detection work together.')}
                <div class="band">
                    <div class="ben gl" style="max-width:100%">
                        <div class="ben-t">Curation — Gate Prevention</div>
                        <div class="ben-h">${b.curation_headline}</div>
                        <div class="ben-s">
                            <div class="bs">
                                <div class="bs-v" style="color:var(--crit)">${n(c.blocked)}</div>
                                <div class="bs-l">Blocked</div>
                            </div>
                            <div class="bs">
                                <div class="bs-v">${n(b.cves_prevented)}</div>
                                <div class="bs-l">CVEs Prevented (est.)</div>
                            </div>
                            <div class="bs">
                                <div class="bs-v" style="color:var(--fdk)">${upgradeLabel}</div>
                                <div class="bs-l">Upgrade Rate<span class="col-hint">${upgradeNote}</span></div>
                            </div>
                            <div class="bs">
                                <div class="bs-v">${coverage}%</div>
                                <div class="bs-l">Repo index coverage</div>
                            </div>
                        </div>
                    </div>
                    <div class="cmp" style="margin-top:.75rem">${b.compare_line || `Curation stopped ${n(c.blocked)} at the gate. Xray found ${n(v.total)} inside (${n(v.by_severity.critical)} critical).`}</div>
                    <p class="method-note">Xray severity breakdown and CVE tables are in <strong>Inside the perimeter</strong> — not duplicated here.</p>
                </div>`;
        }

        /* ═══ SECTION 7: GOVERNANCE EFFECTIVENESS ═══ */

        function buildGovernance() {
            const g = DATA.governance || {};
            const p = DATA.platform || {};
            const xrayPe = (g.xray_policy_effectiveness || g.policy_effectiveness || [])
                .filter((row) => (Number(row.hits) || 0) > 0 && String(row.type || '').toLowerCase() !== 'curation');
            const curPe = (g.curation_policy_effectiveness || [])
                .filter((row) => (Number(row.hits) || 0) > 0);
            const rc = g.repo_watch_coverage || [];
            const rw = g.repo_watch_summary || computeRepoWatchSummary(rc);
            const showXrayTable = xrayPe.length > 0 && !g._policy_summary_only;
            const showCurationTable = curPe.length > 0;

            if (!showXrayTable && !showCurationTable && !rw && rc.length === 0) return '';

            const policyTable = (title, note, rows) => {
                const body = rows.slice(0, 10).map((pol) => `
                    <tr>
                        <td>${pol.policy}${pol.scope_label ? ` <span class="sub">(${pol.scope_label})</span>` : ''}</td>
                        <td>${pol.type}</td>
                        <td class="num">${n(pol.hits)}</td>
                        <td class="num">${n(pol.pct_of_events)}%</td>
                        <td class="num">${n(pol.delta_pct)}%</td>
                    </tr>`).join('');
                return `
                    <div class="card">
                        <div class="ch"><span class="ct">${title}</span></div>
                        <p class="method-note" style="margin:.35rem 0 0">${note}</p>
                        <table class="dt">
                            <thead><tr><th>Policy</th><th>Type</th><th>Hits</th><th>% of events</th><th>Delta</th></tr></thead>
                            <tbody>${body}</tbody>
                        </table>
                    </div>`;
            };

            let html = `
                ${secHead('11', 'Governance', 'Xray watch policies, curation gate policies, and repository indexing coverage.')}
                <div class="band g2">`;

            if (rw) {
                const watchLine = rw.withWatch !== null && rw.withWatch !== undefined
                    ? `<div class="stat-box"><strong style="color:var(--frog)">${n(rw.withWatch)}</strong><span>Repos with watch</span></div>
                       <div class="stat-box"><strong style="color:var(--amber)">${n(rw.withoutWatch)}</strong><span>Repos without watch</span></div>`
                    : `<div class="stat-box" style="grid-column:span 2"><strong>${n(p.watches_total)}</strong><span>Platform watches (${n(p.watches_active)} active)</span></div>`;
                html += `
                    <div class="card">
                        <div class="ch"><span class="ct">Artifactory &amp; watch coverage</span><span class="cs">${rw._platform_fallback ? 'Platform totals' : n(rw.total) + ' repos in scope'}</span></div>
                        <div class="stat-grid-4">
                            <div class="stat-box"><strong style="color:var(--frog)">${n(rw.indexed)}</strong><span>Xray indexed</span></div>
                            <div class="stat-box"><strong>${n(rw.unindexed)}</strong><span>Not indexed</span></div>
                            ${watchLine}
                        </div>
                        <p class="sub" style="margin:.35rem 0 0">${n(p.repos_indexed)} of ${n(p.repos_total)} Artifactory repos indexed · ${n(p.watches_total)} watches (${n(p.watches_active)} active).</p>
                    </div>`;
            } else if (g._repo_summary_only) {
                html += `<div class="callout"><strong>Repository watch coverage (summary)</strong>Platform has <strong>${n(p.watches_total)}</strong> watches (<strong>${n(p.watches_active)}</strong> active) across <strong>${n(p.repos_indexed)}</strong> indexed repos.</div>`;
            }

            if (showXrayTable) {
                html += policyTable(
                    'Policy effectiveness (Xray watches)',
                    '<strong>Hits</strong> = violations attributed to this watch in the period. <strong>Delta</strong> = % change vs prior snapshot (0 when no prior per-policy data).',
                    xrayPe
                );
            } else if ((g.policy_effectiveness || []).length > 0 && !showCurationTable) {
                html += `<div class="callout warn"><strong>No watch policy hits in period</strong>Populate <span class="mono">violations.top_watch_policies</span> from the violations API.</div>`;
            }

            if (showCurationTable) {
                html += policyTable(
                    'Policy effectiveness (Curation gate)',
                    '<strong>Hits</strong> = blocked audit events attributed to this curation policy. Shown separately from Xray watch policies.',
                    curPe
                );
            }

            html += '</div>';
            return html;
        }

        /* ═══ SECTION 8: PERIOD COMPARISON ═══ */

        function buildComparison() {
            const c = DATA.comparison;

            if (!c || !c.available) {
                return `
                    ${secHead('03', 'Period comparison', 'Week-over-week change in core security metrics.')}
                    <div class="callout">Comparison will be available after the next report run.</div>`;
            }

            let rows = (c.metrics || []).map(m => {
                const cls = m.good ? 'good' : 'bad';
                const arrow = m.direction === 'down' ? '↓' : m.direction === 'up' ? '↑' : '—';
                return `
                    <tr>
                        <td>${m.label}</td>
                        <td class="mono num">${n(m.previous)}</td>
                        <td class="mono num">${n(m.current)}</td>
                        <td><span class="kpi-d ${cls}">${arrow} ${Math.abs(m.change_pct)}%</span></td>
                    </tr>`;
            }).join('');

            const sourceNote = c.source === 'threat_velocity'
                ? 'Aligned with Threat Velocity periods (prior weekly snapshot).'
                : 'Compared using the previous saved snapshot on disk.';

            return `
                ${secHead('03', 'Period comparison', `Compared with <strong>${c.previous_date}</strong>. ${sourceNote}`)}
                <div class="band">
                    <table class="dt">
                        <thead><tr><th>Metric</th><th>Previous</th><th>Current</th><th>Change</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        }

        /* ═══ SECTION 9: THREAT VELOCITY ═══ */

        function buildThreatVelocity() {
            const t = DATA.threat_velocity;
            if (!t || !t.available) return '';

            const periods = t.periods || [];
            const rows = periods.map(p => `
                <tr>
                    <td class="mono">${p.label}</td>
                    <td class="num">${n(p.blocked)}</td>
                    <td class="num">${n(p.violations)}</td>
                    <td class="num">${n(p.critical)}</td>
                </tr>`).join('');

            const charts = periods.length >= 2
                ? `<div class="velocity-grid">
                    ${miniVelocityChart(periods, 'blocked', 'var(--frog)')}
                    ${miniVelocityChart(periods, 'violations', 'var(--high)')}
                    ${miniVelocityChart(periods, 'critical', 'var(--crit)')}
                   </div>`
                : '';

            return `
                ${secHead('04', 'Threat velocity', 'Trend across recent reporting periods — blocked downloads vs findings inside repos.')}
                <div class="band">
                    ${charts}
                    <table class="dt velocity-table">
                        <thead><tr><th>Period</th><th>Blocked</th><th>Violations</th><th>Critical</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
                ${t.trend_summary ? `<div class="callout"><strong>Trend</strong>${t.trend_summary}</div>` : ''}`;
        }

        /* ═══ SECTION 10: RECOMMENDATIONS ═══ */

        function buildRecommendations() {
            const r = DATA.recommendations;
            if (!r || r.length === 0) return '';

            const pr = p => ({ P1: 3, P2: 2, P3: 1 }[(p || '').toUpperCase()] || 0);
            const sc = x => {
                const v = Number(x && x.score);
                return Number.isFinite(v) ? v : -1;
            };

            const ordered = [...r].sort((a, b) => {
                const byScore = sc(b) - sc(a);
                if (byScore !== 0) return byScore;
                const byPriority = pr(b && b.priority) - pr(a && a.priority);
                if (byPriority !== 0) return byPriority;
                return String(a && a.title || '').localeCompare(String(b && b.title || ''));
            });

            const invalid = ordered
                .map((x, i) => ({ i, x }))
                .filter(({ x }) => !x || !x.priority || !Number.isFinite(Number(x.score)));

            let items = ordered.map((x, idx) => {
                let badge = '';
                const inferredTitle = String(x && (x.text || x.detail || x.description) || '').split(/[.;]/)[0].trim();
                const title = x.title || inferredTitle || `Recommendation ${idx + 1}`;
                const priority = (x.priority || '').toUpperCase();
                if (priority === 'P1') badge = '<span class="pri p1">P1</span>';
                else if (priority === 'P2') badge = '<span class="pri p2">P2</span>';
                else if (priority === 'P3') badge = '<span class="pri p3">P3</span>';

                const cleanTitle = title;
                const src = (x.source || 'xray').toLowerCase();
                const srcBadge = src === 'curation'
                    ? '<span class="badge" style="background:#e8f5e9;color:#2e7d32;margin-right:.35rem">Curation</span>'
                    : '<span class="badge" style="background:#e3f2fd;color:#1565c0;margin-right:.35rem">Xray</span>';
                const scoreLabel = sc(x) >= 0 ? `Score: ${sc(x)}` : '';
                const meta = [scoreLabel, x.effort ? `Effort: ${x.effort}` : '', x.owner ? `Owner: ${x.owner}` : '', x.due_date ? `Due: ${x.due_date}` : '']
                    .filter(Boolean)
                    .join(' · ');
                const deps = x.dependencies && x.dependencies.length > 0 ? `Depends on: ${x.dependencies.join(', ')}` : '';

                const pClass = priority === 'P1' ? 'p1' : priority === 'P2' ? 'p2' : priority === 'P3' ? 'p3' : '';
                return `<div class="rec-card ${pClass}">
                    <div class="rec-card-title">${badge}${srcBadge}${cleanTitle}</div>
                    <div class="rec-card-body">${x.detail || ''}</div>
                    ${meta ? `<div class="rec-card-meta">${meta}</div>` : ''}
                    ${deps ? `<div class="rec-card-meta">${deps}</div>` : ''}
                </div>`;
            }).join('');

            const warning = invalid.length > 0
                ? `<div class="callout warn"><strong>Recommendation metadata warning</strong>${invalid.length} recommendation item(s) are missing required beta fields (priority and/or score). Ranking and badges may be incomplete for those items.</div>`
                : '';

            return `
                ${secHead('05', 'Prioritized actions', 'What to do next — ordered by score and priority.')}
                ${warning}
                <div class="rec-cards">${items}</div>`;
        }

        /* ═══ RENDER ALL SECTIONS ═══ */

        try {
            normalizeDataShape();
            buildSidebar();

            document.getElementById('content').innerHTML = [
                safeRender('Report Header', buildHeader),
                safeRender('Executive Summary', buildExecutiveSummary),
                safeRender('Executive KPIs', buildKPIs),
                safeRender('Period Comparison', buildComparison),
                safeRender('Threat Velocity', buildThreatVelocity),
                safeRender('Recommendations', buildRecommendations),
                safeRender('Curation — Supply Chain Defense', buildCuration),
                safeRender('Xray — Security Posture', buildViolations),
                safeRender('License Compliance', buildLicense),
                safeRender('Operational Risk', buildOperational),
                safeRender('Combined Security Value', buildBenefit),
                safeRender('Governance Effectiveness', buildGovernance),
                safeRender('Severity and Risk Method', buildScoringGuide),
                `<div class="footer">JFrog CISO Report — ${DATA.meta.server_id} — Generated by Jfrog Dashboard Skills</div>`
            ].join('');
        } catch (error) {
            console.error('Fatal report render failure', error);
            document.getElementById('sidebar').innerHTML = FROG_SVG + sideItem('Render Status', 'Failed', error && error.message ? error.message : 'Unknown render error', true);
            document.getElementById('content').innerHTML = `
                <div class="sec red">Report Render Failure</div>
                <div class="callout warn">
                    <strong>The report template could not render this data set</strong>
                    ${error && error.message ? error.message : 'Unknown render error'}
                </div>`;
        }
    </script>
</body>

</html>
