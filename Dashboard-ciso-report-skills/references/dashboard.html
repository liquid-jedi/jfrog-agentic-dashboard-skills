<style>
:root{
  /* ── JFrog Leapkit tokens (inlined for a portable, self-contained report) ── */
  --navy:#1f2f4a; --navy-600:#415980; --navy-700:#2a3c5a; --navy-900:#16233a;
  --green:#3eb065; --green-600:#36994f; --green-700:#2d8442; --green-tint:#eaf6ee;
  --crit:#b91c1c; --crit-tint:#fbeaea;
  --high:#e93838; --high-tint:#fdecec;
  --med:#d98309; --med-tint:#fdf2e3;
  --low:#b59000; --low-tint:#fbf6df;
  --info:#3a86f9; --info-tint:#eaf2fe;
  --canvas:#f8fafb; --surface:#fff;
  --ink:#1c2331; --fg:#33404f; --fg-2:#5a6a82; --muted:#8694a8;
  --line:#e3e9f1; --line-2:#eef2f7; --hair:#d2dfed;
  --r-s:4px; --r-m:6px; --r-l:8px; --r-xl:12px;
  --raised:0 2px 20px rgba(28,29,32,.05);
  --overlay:0 2px 26px 7px rgba(112,140,178,.15);
  --mono:'Overpass Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:#e9edf2}
body{font-family:'Open Sans',system-ui,sans-serif;color:var(--ink);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.report{max-width:none;margin:0;background:var(--canvas);min-height:100vh}
.mono{font-family:var(--mono)}
a{color:var(--green-600);text-decoration:none}
a:hover{text-decoration:underline}

/* ════════════════ SUPPLIED CISO DASHBOARD SHELL ════════════════ */
.dashboard-shell{min-height:100vh;background:var(--canvas)}
.dashboard-sidebar{position:fixed;inset:0 auto 0 0;width:260px;background:var(--navy);color:#fff;
  padding:22px 18px 18px;overflow-y:auto;z-index:40}
.side-brand{display:flex;align-items:center;gap:11px;padding:0 4px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.side-brand img,.side-brand svg{width:42px;height:42px;object-fit:contain;flex-shrink:0;border-radius:8px}
.side-brand img{mix-blend-mode:screen;background:transparent}
.side-brand b{font-size:15px;letter-spacing:.01em}
.side-brand span{display:block;font-size:10px;color:#99a0b8;text-transform:uppercase;letter-spacing:.08em}
.side-export{width:100%;margin:14px 0 18px;padding:9px 12px;border:1px solid rgba(255,255,255,.22);
  border-radius:var(--r-m);background:transparent;color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.side-export:hover{background:rgba(255,255,255,.08)}
.pdf-card{margin:12px 0 18px;padding:8px;border:1px solid rgba(255,255,255,.1);border-radius:var(--r-l);
  background:rgba(255,255,255,.045);display:flex;flex-direction:column;gap:6px}
.pdf-card .pdf-title{font-size:9.5px;font-weight:700;color:#6f7f99;text-transform:uppercase;letter-spacing:.09em;padding:1px 3px 2px}
.pdf-card .pdf-link,.pdf-card .pdf-print{box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;min-height:34px;margin:0;padding:8px 12px;border-radius:var(--r-m);font-family:inherit;font-size:11.5px;font-weight:800;
  text-align:left;text-decoration:none;cursor:pointer}
.pdf-card .pdf-link{background:rgba(255,255,255,.92);color:var(--navy);border:1px solid transparent}
.pdf-card .pdf-link:hover{background:#fff}
.pdf-card .pdf-link span{font-family:var(--mono);font-size:8.5px;font-weight:800;color:var(--green-700);text-transform:uppercase;letter-spacing:.06em}
.pdf-card .pdf-link.full span{color:var(--navy-600)}
.pdf-card .pdf-print{justify-content:center;background:rgba(255,255,255,.06);color:#d7deea;border:1px solid rgba(255,255,255,.14)}
.pdf-card .pdf-print:hover{background:rgba(255,255,255,.11)}
.side-label{font-size:10px;font-weight:700;color:#6f7f99;text-transform:uppercase;letter-spacing:.09em;margin:4px 4px 9px}
.side-nav{list-style:none;margin:0 0 18px;padding:0 0 0 4px}
.side-nav li{position:relative;padding:0 0 12px 24px}
.side-nav li::before{content:"";position:absolute;left:6px;top:14px;bottom:-2px;width:1px;background:#415980}
.side-nav li:last-child::before{display:none}
.side-nav a{display:flex;align-items:center;color:#99a0b8;font-size:12px;font-weight:600;text-decoration:none}
.side-nav a::before{content:"";position:absolute;left:0;width:13px;height:13px;border-radius:50%;
  background:var(--navy);border:2px solid #415980;transition:.15s}
.side-nav a.active,.side-nav a:hover{color:#fff}.side-nav a.active::before{background:var(--green);border-color:var(--green)}
.side-glance{border-top:1px solid rgba(255,255,255,.12);padding:15px 4px 0}
.glance-row{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:#99a0b8;padding:4px 0}
.glance-row b{color:#fff;font-family:var(--mono)}
.dashboard-main{margin-left:260px;min-width:0}
.dashboard-topbar{position:sticky;top:0;z-index:30;height:58px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:0 1px 8px rgba(31,47,74,.04)}
.dashboard-topbar .host{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--navy)}
.dashboard-topbar .period{font-size:11px;color:var(--muted);background:var(--canvas);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.dashboard-content{padding:24px 28px 8px;max-width:1440px;margin:0 auto}
.page-title{font-size:22px;font-weight:700;color:var(--navy);margin:0 0 18px}
.section-block{scroll-margin-top:74px;margin-bottom:22px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.section-title h2{font-size:15px;font-weight:700;color:var(--navy)}
.section-title span{font-size:10px;font-weight:700;color:var(--green-700);text-transform:uppercase;letter-spacing:.07em}
.section-overview{padding:22px 24px 8px}

/* ════════════════ MASTHEAD ════════════════ */
.mast{background:var(--navy);padding:18px 32px;display:flex;align-items:center;gap:16px}
.mast .logo{height:30px;width:auto;flex-shrink:0}
.mast .logo svg{height:30px;width:auto}
.mast .title{color:#fff}
.mast .title b{font-size:16px;font-weight:700;display:block;line-height:1.2;letter-spacing:.01em}
.mast .title span{font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.55)}
.mast .divider{width:1px;height:34px;background:rgba(255,255,255,.16)}
.mast .spacer{flex:1}
.mast .period{text-align:right;color:#fff}
.mast .period b{font-size:13px;font-weight:700;display:block}
.mast .period span{font-size:11.5px;color:rgba(255,255,255,.6)}
.mast-pdf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mast-pdf a{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.12);
  color:#fff;text-decoration:none;font-size:11px;font-weight:800;border:1px solid rgba(255,255,255,.18)}
.mast-pdf a:hover{background:rgba(255,255,255,.2)}
.mast-pdf a span{font-family:var(--mono);font-size:9px;color:#b9f4bd;text-transform:uppercase;letter-spacing:.06em}

/* ════════════════ EXECUTIVE HERO ════════════════ */
.brief{background:var(--surface);border-bottom:1px solid var(--line)}
.hero{padding:26px 30px 24px}
.hero-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start;margin-bottom:20px}
.hero-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.hero-line{font-size:26px;font-weight:800;color:var(--navy);line-height:1.26;letter-spacing:-.02em;margin:0 0 11px;max-width:34ch}
.hero-line .g{color:var(--green-600)}
.hero-line .r{color:var(--crit)}
.hero-read{font-size:13.5px;line-height:1.65;color:var(--fg-2);margin:0;max-width:88ch}
.hero-read b{color:var(--navy);font-weight:700}
.hero-verdict{min-width:196px;max-width:230px;padding:15px 17px;border:1px solid;border-radius:var(--r-l);display:flex;flex-direction:column;gap:4px}
.hero-verdict>span{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.hero-verdict>b{font-size:19px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.hero-verdict>em{font-style:normal;font-size:11.5px;font-weight:600;line-height:1.45;opacity:.92}
.verdict-crit{background:var(--crit-tint);border-color:#f4c8c3;color:var(--crit)}
.verdict-warn{background:var(--med-tint);border-color:#f0dcb2;color:#8a5800}
.verdict-ok{background:var(--green-tint);border-color:#bfe5c3;color:var(--green-700)}
.hero-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.hero-tile{position:relative;padding:14px 15px 13px 17px;background:var(--canvas);border:1px solid var(--line);
  border-radius:var(--r-l);overflow:hidden}
.hero-tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--navy-600)}
.hero-tile.t-crit::before{background:var(--crit)}
.hero-tile.t-high::before{background:var(--med)}
.hero-tile.t-good::before{background:var(--green)}
.hero-tile.t-info::before{background:var(--info)}
.hero-tile .tv{font-size:29px;font-weight:800;color:var(--navy);line-height:1.05;letter-spacing:-.02em}
.hero-tile .tv small{font-size:15px;font-weight:700;color:var(--navy-600)}
.hero-tile .tl{font-size:11.5px;font-weight:700;color:var(--navy);margin:7px 0 4px;line-height:1.3}
.hero-tile .ts{font-size:11px;color:var(--fg-2);line-height:1.5}
.tdelta{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:var(--r-s);margin-top:4px}
.td-bad{background:#fff1f0;color:var(--crit)}
.td-good{background:#f0fdf4;color:var(--green-600)}
.td-flat{background:var(--line-2);color:var(--muted)}
.hero-flow{background:var(--canvas);border:1px solid var(--line);border-radius:var(--r-l);padding:15px 17px 16px}
.hero-flow .fh{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:11px}
.hero-flow .fh b{font-size:12.5px;color:var(--navy)}
.hero-flow .fh span{font-size:11.5px;color:var(--muted)}
.flowbar{display:flex;height:13px;border-radius:999px;overflow:hidden;background:var(--line-2);margin-bottom:12px}
.flowbar i{height:100%;display:block}
.flowbar .fb-blocked{background:var(--green)}
.flowbar .fb-present{background:var(--crit)}
.flow-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.flow-legend>div{display:flex;gap:9px;align-items:flex-start}
.flow-legend .dot{width:9px;height:9px;border-radius:3px;margin-top:4px;flex:none}
.flow-legend b{display:block;font-size:12.5px;color:var(--navy);margin-bottom:2px}
.flow-legend p{font-size:11.5px;color:var(--fg-2);line-height:1.5;margin:0}

/* Attention strip (used in Overview tab) */
.attention{padding:22px 24px 24px;background:var(--canvas)}
.attention > div > h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.act-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.act-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;display:flex;flex-direction:column}
.act-pill{align-self:flex-start;font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:var(--r-s);letter-spacing:.03em;text-transform:uppercase}
.pill-p1{background:var(--crit-tint);color:var(--crit)}
.pill-p2{background:var(--med-tint);color:var(--med)}
.pill-p3{background:var(--info-tint);color:var(--info)}
.act-card h3{font-size:14px;font-weight:700;color:var(--navy);margin:11px 0 6px;line-height:1.35}
.act-card p{font-size:12px;color:var(--fg-2);line-height:1.5;flex:1}
.act-effort{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.act-metric{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--navy);margin-top:12px;padding-top:11px;border-top:1px solid var(--line-2)}
.act-metric span{color:var(--muted);font-weight:600}
/* Generic text button */
.btn-link{background:none;border:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--navy);padding:0;text-decoration:underline;text-underline-offset:2px}
.btn-link:hover{color:var(--green-600)}

/* ════════════════ TABS (Direction B) ════════════════ */
.tabbar{display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:0 24px;position:sticky;top:0;z-index:20;box-shadow:var(--raised)}
.tab{font-size:13px;font-weight:600;color:var(--fg-2);padding:14px 18px;border:none;background:none;
  border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s}
.tab:hover{color:var(--navy)}
.tab.on{color:var(--navy);border-bottom-color:var(--green);font-weight:700}
.tab .badge{font-family:var(--mono);font-size:10px;font-weight:700;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--line-2);color:var(--fg-2)}
.tab.on .badge{background:var(--green-tint);color:var(--green-700)}
.tab .badge.crit{background:var(--crit-tint);color:var(--crit)}

.tabpanel{display:none;padding:22px 24px 8px}
.tabpanel.on{display:block}
.panel-head{display:none}

/* ════════════════ SHARED PANEL / CARD CHROME ════════════════ */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;position:relative;display:flex;flex-direction:column;min-height:114px}
.kpi::before{display:none}
.kpi.k-navy::before{background:var(--navy-600)} .kpi.k-green::before{background:var(--green)}
.kpi.k-crit::before{background:var(--crit)} .kpi.k-med::before{background:var(--med)}
.kpi.k-info::before{background:var(--info)}
.kpi .n{font-size:26px;font-weight:800;color:var(--navy);line-height:1;letter-spacing:-.01em}
.kpi .n small{font-size:14px;font-weight:700;color:var(--muted)}
.kpi .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:7px}
.kpi .d{font-size:11.5px;color:var(--fg-2);margin-top:3px}
.kpis.compact-4{grid-template-columns:repeat(4,1fr)}
.insight-card .d b{color:var(--navy)}
.insight-card .d.warn{color:var(--crit)}
.insight-card .d.good{color:var(--green-700)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid-2.wide-l{grid-template-columns:1.45fr 1fr}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.span-2{grid-column:span 2}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;margin-bottom:14px}
.panel.flush{margin-bottom:0}
.ph{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line-2);gap:12px}
.ph h3{font-size:13px;font-weight:700;color:var(--navy)}
.ph .meta{font-size:11px;color:var(--muted)}
.pbody{padding:16px}
.pbody.tight{padding:0}

.note{font-size:12px;color:var(--fg-2);line-height:1.55;background:var(--canvas);border:1px solid var(--line-2);
  border-left:3px solid var(--navy-600);border-radius:0 var(--r-m) var(--r-m) 0;padding:11px 14px;margin-bottom:14px}
.note b{color:var(--navy)}
.note.good{border-left-color:var(--green)}
.note.warn{border-left-color:var(--med)}

/* tables */
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  text-align:left;padding:9px 16px;background:var(--canvas);border-bottom:1px solid var(--line-2);white-space:nowrap}
.dt th.r,.dt td.r{text-align:right}
.dt td{padding:9px 16px;border-bottom:1px solid var(--line-2);color:var(--fg);vertical-align:middle}
.dt tbody tr:last-child td{border-bottom:none}
.dt tbody tr:hover td{background:var(--canvas)}
.dt td .num{font-family:var(--mono);font-weight:700;color:var(--navy)}
.dt td.idcell{font-family:var(--mono);font-size:11.5px;color:var(--navy-600);white-space:nowrap}
.dt td.comp{font-family:var(--mono);font-size:11.5px;color:var(--fg)}
.dt .desc{color:var(--fg-2);font-size:11.5px;line-height:1.45;max-width:520px}
.row-more{display:none}
.expanded .row-more{display:table-row}
.showmore{display:block;width:100%;padding:10px;font-size:12px;font-weight:600;color:var(--green-600);
  background:var(--canvas);border:none;border-top:1px solid var(--line-2);cursor:pointer;font-family:inherit}
.showmore:hover{background:var(--line-2)}
.showmore .less-label{display:none}
.showmore.expanded .more-label{display:none}
.showmore.expanded .less-label{display:inline}

/* severity + status chips */
.sev{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.sev-crit{background:var(--crit-tint);color:var(--crit)} .sev-high{background:var(--high-tint);color:var(--high)}
.sev-med{background:var(--med-tint);color:var(--med)} .sev-low{background:var(--low-tint);color:var(--low)}
.sev-unknown{background:var(--line-2);color:var(--fg-2)}
.status{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.st-block{background:var(--crit-tint);color:var(--crit)} .st-pass{background:var(--green-tint);color:var(--green-700)}
.tag-pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--canvas);border:1px solid var(--line);color:var(--fg-2)}
.cat-btn{width:100%;border:none;border-top:1px solid var(--line-2);background:var(--surface);padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;font-family:inherit}
.cat-btn:hover{background:var(--canvas)}
.cat-btn .chev{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--canvas);border:1px solid var(--line);font-size:11px;color:var(--muted);transition:transform .15s}
.cat-btn.on .chev{transform:rotate(90deg);color:var(--navy)}
.cat-btn .cat-title{font-size:13px;font-weight:800;color:var(--navy)}
.cat-btn .cat-sub{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.cat-body{display:none;border-top:1px solid var(--line-2)}
.cat-section.open .cat-body{display:block}

/* coverage bars */
.cov-row{margin-bottom:16px}
.cov-row:last-child{margin-bottom:0}
.cov-rh{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:6px}
.cov-rh b{color:var(--navy);font-weight:700}
.cov-rh .v{font-family:var(--mono);font-size:12px;color:var(--fg-2)}
.cov-track{height:9px;background:var(--line-2);border-radius:5px;overflow:hidden}
.cov-fill{height:100%;border-radius:5px}
.cov-sub{font-size:11px;color:var(--muted);margin-top:5px}

/* severity distribution */
.dist{display:flex;gap:3px;height:34px;border-radius:var(--r-m);overflow:hidden;margin-bottom:12px;background:var(--line-2);padding:3px}
.dist span{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.sevlist{display:flex;flex-direction:column;gap:9px}
.sevr{display:flex;align-items:center;gap:9px;font-size:12.5px}
.sevr .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sevr .lbl{flex:1;color:var(--fg)} .sevr .ct{font-family:var(--mono);font-weight:700;color:var(--navy)}
.sevr .pc{font-family:var(--mono);font-size:11px;color:var(--muted);width:48px;text-align:right}

/* mini bar in table cell */
.minibar{display:flex;align-items:center;gap:9px}
.minibar .t{flex:1;height:6px;min-width:50px;background:var(--line-2);border-radius:3px;overflow:hidden}
.minibar .f{height:100%;border-radius:3px}

/* package type chip with count */
.ptcell{display:flex;align-items:center;gap:8px}
.ptcell .pt{font-weight:600;color:var(--navy)}
.pt-ico{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:800;color:var(--navy);background:var(--canvas);border:1px solid var(--line)}
.pt-docker{background:#eaf2fe;color:#1d4ed8}.pt-maven{background:#fdf2e3;color:#a16207}
.pt-npm{background:#fbeaea;color:#b91c1c}.pt-pypi{background:#eaf6ee;color:#2d8442}
.pt-go{background:#e8f7fb;color:#087990}

/* empty states */
.empty{text-align:center;padding:30px 20px;color:var(--muted)}
.empty .ico{width:38px;height:38px;border-radius:50%;background:var(--green-tint);color:var(--green-700);
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:20px;font-weight:800}
.empty b{display:block;color:var(--fg);font-size:13px;font-weight:700;margin-bottom:3px}
.empty p{font-size:12px;line-height:1.5;max-width:340px;margin:0 auto}

/* recommendation cards */
.rec-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rec-card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--muted);
  border-radius:var(--r-l);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--raised)}
.rec-card.p1{border-top-color:var(--crit)} .rec-card.p2{border-top-color:var(--med)} .rec-card.p3{border-top-color:var(--info)}
.rec-rank{flex-shrink:0;width:30px;height:30px;border-radius:999px;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;font-family:var(--mono)}
.rec-main{flex:1}
.rec-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.rec-top h3{font-size:14.5px;font-weight:700;color:var(--navy)}
.rec-body{font-size:12.5px;color:var(--fg-2);line-height:1.55}
.rec-foot{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.chip-eff{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  padding:2px 8px;border-radius:var(--r-s);background:var(--canvas);border:1px solid var(--line);color:var(--fg-2)}
.rec-link{font-size:12px;font-weight:600}

.audit-cta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--green-tint);border:1px solid rgba(62,176,101,.3);border-radius:var(--r-l);padding:16px 18px;margin-bottom:14px}
.audit-cta .txt b{font-size:13px;font-weight:700;color:var(--green-700);display:block}
.audit-cta .txt span{font-size:12px;color:var(--fg-2)}
.audit-cta a.btn{background:var(--green);color:#fff;font-weight:700;font-size:12.5px;padding:9px 16px;border-radius:var(--r-m);white-space:nowrap}
.audit-cta a.btn:hover{background:var(--green-600);text-decoration:none}

.footer{padding:18px 32px 26px;font-size:11px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line)}
.footer b{color:var(--fg-2)}

/* threat velocity */
.velocity-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;padding:16px}
.vel-card{border:1px solid var(--line-2);border-radius:var(--r-l);padding:13px 14px;background:var(--canvas)}
.vel-card .vh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.vel-card .vh b{font-size:12px;color:var(--navy)}
.vel-card .vh span{font-family:var(--mono);font-size:11px;font-weight:800}
.vel-card.good .vh span{color:var(--green-700)}.vel-card.bad .vh span{color:var(--crit)}.vel-card.flat .vh span{color:var(--muted)}
.spark{height:58px;display:flex;align-items:flex-end;gap:5px}
.spark i{flex:1;min-width:5px;border-radius:4px 4px 0 0;background:var(--navy-600);opacity:.85}
.vel-card.bad .spark i{background:var(--crit)}.vel-card.good .spark i{background:var(--green)}
.velocity-note{padding:0 16px 16px}

@media(max-width:920px){
  .dashboard-sidebar{position:static;width:auto;max-height:none}.dashboard-main{margin-left:0}
  .side-nav{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.side-nav li::before{display:none}
  .side-glance{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
  .dashboard-topbar{position:static}.dashboard-content{padding:18px 16px 8px}
  .hero{padding:20px 16px}.hero-top{grid-template-columns:1fr}.hero-verdict{max-width:none}.hero-line{font-size:22px}
  .kpis,.kpis.compact-4{grid-template-columns:repeat(2,1fr)}.act-grid,.rec-list,.velocity-summary{grid-template-columns:1fr}
  .grid-2,.grid-2.wide-l,.grid-3{grid-template-columns:1fr}.span-2{grid-column:auto}
  .tabbar{overflow-x:auto}
}

/* ════════════════ PRINT — reveal every tab as a section ════════════════ */
@media print{
  @page{margin:14mm}
  html,body{background:#fff}
  .report{box-shadow:none;max-width:none}
  .dashboard-sidebar,.dashboard-topbar{display:none!important}
  .dashboard-main{margin-left:0}.dashboard-content{padding:0;max-width:none}
  .section-block{break-before:page}.section-block:first-of-type{break-before:auto}
  .tabbar{display:none}
  .tabpanel{display:block!important;padding:0;break-before:page}
  .tabpanel:first-of-type{break-before:auto}
  .panel-head{display:flex;align-items:center;gap:10px;margin:20px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--navy)}
  .panel-head b{font-size:16px;font-weight:800;color:var(--navy)}
  .panel-head .badge{display:none}
  .row-more{display:table-row!important}.showmore{display:none}
  .panel,.kpi,.act-card,.rec-card{break-inside:avoid;box-shadow:none}
  .mast{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

/* ═══ ACTIVE USER DEFINITION — kept in step with the runner's CSV note ═══ */
const ACTIVE_USER_NOTE_TEXT = 'Distinct requester identities (email address or username, as recorded by JFrog) in Curation events during the reporting period. A practical yardstick for adoption and usage trends. It is an observed activity count, not a license count or a contractual position.';

/* ═══ HELPERS ═══ */
const fmt = (n) => (Number(n) || 0).toLocaleString('en-US');
const cap = (s) => s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : '';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safeHttpHref = (s) => /^https?:\/\//i.test(String(s||'').trim()) ? String(s).trim() : '';
const pctOf = (a, b) => { b = Number(b) || 0; return b ? Math.round((Number(a) || 0) / b * 100) : 0; };
const truncate = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n).trim() + '…' : s; };
const hasText = (s) => String(s == null ? '' : s).trim().length > 0;
const knownValue = (s) => hasText(s) && !['unknown','n/a','na','—','-'].includes(String(s).trim().toLowerCase());
function exportHref(name){
  const files = (DATA.meta && DATA.meta.export_files) || {};
  const file = files[name];
  return file ? String(file) : '';
}

function riskBand(s){
  s = Number(s) || 0;
  if (s >= 75) return {label:'Critical', color:'var(--crit)'};
  if (s >= 50) return {label:'Elevated', color:'var(--med)'};
  if (s >= 25) return {label:'Moderate', color:'var(--low)'};
  return {label:'Low', color:'var(--green)'};
}
function sevClass(s){
  s = String(s || '').toLowerCase();
  if (s.startsWith('crit')) return 'sev-crit';
  if (s.startsWith('high')) return 'sev-high';
  if (s.startsWith('med')) return 'sev-med';
  if (s.startsWith('low')) return 'sev-low';
  return 'sev-unknown';
}
function shortComponent(c){
  c = String(c || '');
  // strip ecosystem prefix like gav://, rubygems://, pypi://
  c = c.replace(/^[a-z0-9.+-]+:\/\//i, '');
  // for gav coordinates keep artifact:version
  const parts = c.split(':');
  if (parts.length >= 3) return parts.slice(-2).join(':');
  return c;
}
function packageTypeCell(value){
  const text = String(value || 'unknown');
  const key = text.toLowerCase().replace(/[^a-z0-9]/g,'');
  const labels = {docker:'D',maven:'M',npm:'N',pypi:'Py',python:'Py',go:'Go',golang:'Go',nuget:'Nu',conan:'Co',composer:'Cp',debian:'Db',rpm:'R',rubygems:'Rb',gems:'Rb'};
  const cssKey = ['docker','maven','npm','pypi','go'].includes(key) ? key : 'other';
  return `<span class="pt-ico pt-${cssKey}">${esc(labels[key] || text.slice(0,2).toUpperCase())}</span><span class="pt">${esc(text)}</span>`;
}
function safe(label, fn){
  try { return fn(); }
  catch (e){ console.error('Render failure in ' + label, e);
    return `<div class="note warn"><b>${esc(label)} failed to render.</b> ${esc(e && e.message || 'Unknown error')}</div>`; }
}

/* ── connection stats (prefer supported-ecosystem counts) ── */
function connStats(){
  const cs = (DATA.platform && DATA.platform.curation_state) || (DATA.curation && DATA.curation.curation_state) || {};
  if (Number(cs.supported_remote_total) > 0)
    return {total:cs.supported_remote_total, connected:cs.supported_connected||0, notConnected:cs.supported_not_connected||0, pct:Math.round(cs.supported_connected_pct||pctOf(cs.supported_connected,cs.supported_remote_total))};
  return {total:cs.remote_total||0, connected:cs.connected||0, notConnected:cs.not_connected||0, pct:Math.round(cs.connected_pct||pctOf(cs.connected,cs.remote_total))};
}
function severityCounts(sev){
  sev = sev || {};
  return `C ${fmt(sev.critical)} | H ${fmt(sev.high)} | M ${fmt(sev.medium)} | L ${fmt(sev.low)}`;
}
/* ── derive prioritized actions from the data ── */
function computeActions(){
  const p = DATA.platform || {}, v = DATA.violations || {}, sev = v.by_severity || {};
  const vei = v.executive_insights || {}, cei = (DATA.curation && DATA.curation.executive_insights) || {};
  const cn = connStats();
  const acts = [];
  const sla = vei.sla_risk_backlog || {};
  if ((sla.sla_breach_issues||0) > 0) acts.push({pri:'P1', effort:'Medium', title:`Clear ${fmt(sla.sla_breach_issues)} critical SLA breaches`,
    body:`Critical findings older than ${fmt(sla.sla_days||30)} days need executive owner assignment and weekly closure tracking.`,
    metric:`${fmt(sla.sla_breach_issues)} overdue critical issues`, link:'Xray › Violations'});
  const rr = vei.remediation_readiness || {};
  if ((rr.fix_available_issues||0) > 0) acts.push({pri:'P1', effort:'Medium', title:`Patch ${fmt(rr.fix_available_issues)} critical issues with known fixes`,
    body:`These are the fastest exposure reducers because a fixed version or remediation path is already known.`,
    metric:`${fmt(rr.fix_available_hits||0)} artifact hits`, link:'Xray › Violations'});
  const blind = vei.watch_blind_spots || [];
  const topBlindRepo = blind.length ? (blind[0].repo || blind[0].repository || 'repository not exposed') : '';
  if (blind.length) acts.push({pri:'P1', effort:'Low', title:`Assign watches to ${fmt(blind.length)} repositories with violations`,
    body:`The highest blind spot, ${topBlindRepo}, has ${fmt(blind[0].violation_count)} violations and no watch assignment in the collected Xray mapping.`,
    metric:`${fmt(blind.reduce((s,r)=>s+(r.critical_count||0),0))} critical findings`, link:'Xray › Watches'});
  const gateGaps = cei.gate_coverage_gaps || [];
  if (gateGaps.length) acts.push({pri:'P2', effort:'Low', title:`Connect ${fmt(gateGaps.reduce((s,r)=>s+(r.unconnected||0),0))} supported remotes to Curation`,
    body:`Supported ecosystems are available for gate enforcement but not fully connected, led by ${gateGaps[0].package_type}.`,
    metric:`${fmt(gateGaps.length)} ecosystem gap${gateGaps.length===1?'':'s'}`, link:'Curation › Repositories'});
  const unindexed = (p.repos_unindexed != null) ? p.repos_unindexed : (p.repos_total||0) - (p.repos_indexed||0);
  if (unindexed > 0) acts.push({pri:'P1', effort:'Medium', title:`Index ${fmt(unindexed)} unscanned repositories`,
    body:`${pctOf(unindexed, p.repos_total)}% of the estate has no Xray indexing — any violations there are invisible to this report.`,
    metric:`${fmt(p.repos_indexed)} / ${fmt(p.repos_total)} indexed`, link:'Xray › Indexed Resources'});
  const crit = sev.critical || 0;
  const impact = vei.highest_impact_fixes || [];
  if (crit > 0) acts.push({pri:'P1', effort:'High', title:`Remediate ${fmt(crit)} critical findings`,
    body:`Critical vulnerabilities${impact.length?' are led by '+impact.slice(0,3).map(x=>shortComponent(x.component)).join(', '):' need immediate triage'}. Assign remediation owners to the highest-hit XRAY IDs.`,
    metric:`${fmt(crit)} critical · ${fmt(sev.high||0)} high`, link:'Xray › Violations'});
  const dry = p.curation_policies_dry_run || 0;
  if (dry > 0) acts.push({pri:'P2', effort:'Low', title:`Promote ${dry} curation policies out of dry-run`,
    body:`Dry-run policies detect but never block downloads. Promoting them to enforce closes the gap with no new configuration.`,
    metric:`${fmt(p.curation_policies_block||0)} blocking · ${dry} dry-run`, link:'Curation › Policies'});
  if (cn.notConnected > 0) acts.push({pri:'P2', effort:'Low', title:`Connect ${cn.notConnected} supported remotes to Curation`,
    body:`These remotes can serve packages without passing the curation gate. Connect them so downloads are screened first.`,
    metric:`${cn.connected} / ${cn.total} connected`, link:'Curation › Repositories'});
  const idle = (p.watches_total||0) - (p.watches_active||0);
  if (idle > 0) acts.push({pri:'P3', effort:'Low', title:`Review ${idle} inactive watches`,
    body:`${idle} of ${p.watches_total} watches are not active. Confirm coverage so nothing scans silently or not at all.`,
    metric:`${p.watches_active} / ${p.watches_total} active`, link:'Watches'});
  // fold in any engine recommendations not already represented
  const themes = acts.map(a => a.title.toLowerCase()).join(' | ');
  (DATA.recommendations || []).forEach(r => {
    const recTitle = r.title || r.text || '';
    const t = String(recTitle).toLowerCase();
    const covered = (t.includes('xray') && themes.includes('critical')) ||
                    (t.includes('curation') && (themes.includes('curation') || themes.includes('remotes')));
    if (!covered && recTitle) acts.push({pri:r.priority||'P3', effort:cap(r.effort||''), title:recTitle, body:r.detail||'', metric:'', link:null, owner:r.owner, dueDate:r.due_date, score:r.score});
  });
  const order = {P1:0, P2:1, P3:2};
  acts.sort((a,b) => (order[a.pri]??9) - (order[b.pri]??9));
  return acts;
}

/* ═══ EXECUTIVE HERO ═══ */
function buildBriefing(){
  const m = DATA.meta || {};
  const v = DATA.violations || {}, c = DATA.curation || {}, sev = v.by_severity || {};
  const blocked = c.blocked || 0;
  const requests = c.total || 0;
  const present = v.total || 0;
  const crit = sev.critical || 0;
  const high = sev.high || 0;
  const uniqueCritical = v.unique_critical_issue_count != null ? v.unique_critical_issue_count : ((v.critical_issues || []).length || 0);
  const sig = v.posture_signals || {};
  const gap = sig.coverage_gap;
  const cmp = DATA.comparison || {};
  const sd  = cmp.signal_deltas || {};
  const criticalDelta = cmp.available && cmp.violations ? cmp.violations.critical_delta : null;
  const actions = computeActions();
  const p1 = actions.filter(a => a.pri === 'P1').length;

  // Lower is better for exposure counts, higher is better for prevention counts.
  // A missing value means either no baseline at all or a baseline the collector
  // cannot compare against, and those read very differently to a reader.
  const notComparable = cmp.available && cmp.violations_comparable === false;
  function delta(val, lowerIsBetter, unit){
    if (val == null) {
      return notComparable
        ? `<span class="tdelta td-flat" title="${esc(cmp.incomparable_reason||'')}">not comparable with prior</span>`
        : `<span class="tdelta td-flat">no prior period</span>`;
    }
    if (val === 0) return `<span class="tdelta td-flat">no change vs prior</span>`;
    const up = val > 0, good = lowerIsBetter ? !up : up;
    return `<span class="tdelta ${good ? 'td-good' : 'td-bad'}">${up ? '▲' : '▼'}${fmt(Math.abs(val))}${unit ? ' ' + unit : ''} vs prior</span>`;
  }
  const tile = (cls, val, label, sub) =>
    `<div class="hero-tile ${cls}"><div class="tv">${val}</div><div class="tl">${esc(label)}</div><div class="ts">${sub}</div></div>`;

  const verdict = crit > 0
    ? {cls:'verdict-crit', word:'Action required', why:`${fmt(uniqueCritical)} unique critical issue${uniqueCritical===1?'':'s'} are live inside your repositories.`}
    : (present > 0 || (gap != null && gap >= 20))
      ? {cls:'verdict-warn', word:'Monitor', why:'No critical findings, but open exposure or indexing gaps remain.'}
      : {cls:'verdict-ok', word:'Healthy', why:'No critical findings in indexed repositories this period.'};
  const actionLine = actions.length
    ? `${p1 ? `<b>${fmt(p1)}</b> priority-1 of ` : ''}${fmt(actions.length)} recommended action${actions.length===1?'':'s'}`
    : 'No actions queued';

  const headline = crit > 0
    ? `<span class="r">${fmt(crit)} critical violation occurrence${crit===1?'':'s'}</span> are already inside your indexed repositories.`
    : present > 0
      ? `No critical findings this period, with <span class="r">${fmt(present)} violation occurrence${present===1?'':'s'}</span> still open inside indexed repositories.`
      : `No open violations inside your indexed repositories this period.`;

  const gateSentence = !c.available
    ? `Curation activity was not available for this period, so prevention at the gate cannot be measured.`
    : blocked > 0
      ? `Curation blocked <b>${fmt(blocked)}</b> risky package request${blocked===1?'':'s'} out of <b>${fmt(requests)}</b> reviewed, so those never reached a repository.`
      : `Curation reviewed <b>${fmt(requests)}</b> package request${requests===1?'':'s'} and blocked none, so nothing was stopped at the gate this period.`;
  const gapSentence = gap != null
    ? ` <b>${gap}%</b> of repositories are still outside Xray indexing, so anything in them is invisible to this report.`
    : '';
  const read = `${gateSentence} The exposure below is what already sits inside indexed repositories and needs an owner: <b>${fmt(uniqueCritical)}</b> unique critical issue${uniqueCritical===1?'':'s'} across <b>${fmt(crit)}</b> occurrence${crit===1?'':'s'}, plus <b>${fmt(high)}</b> high.${gapSentence}`;

  const tiles = `<div class="hero-tiles">
    ${tile('t-crit', fmt(crit), 'Critical occurrences', `${fmt(uniqueCritical)} unique issues / CVEs<br>${delta(criticalDelta, true)}`)}
    ${tile('t-high', fmt(high), 'High occurrences', `Next tier of exposure to plan for`)}
    ${tile('t-info', fmt(present), 'Total violation occurrences', `Inside indexed repositories<br>${delta(sd.violation_volume, true)}`)}
    ${tile('t-good', fmt(blocked), 'Blocked at the gate', `${fmt(requests)} package requests reviewed`)}
    ${tile(gap != null && gap >= 20 ? 't-crit' : 't-info', gap != null ? gap + '<small>%</small>' : '—', 'Repositories not indexed', `Outside Xray visibility<br>${delta(sd.coverage_gap, true, 'pts')}`)}
  </div>`;

  const flowTotal = blocked + present;
  const blockedPct = flowTotal ? Math.max(0.6, pctOf(blocked, flowTotal)) : 0;
  const flow = `<div class="hero-flow">
    <div class="fh"><b>Prevented at the gate vs. present inside repositories</b><span>${fmt(flowTotal)} risk events this period</span></div>
    <div class="flowbar">
      <i class="fb-blocked" style="width:${blockedPct.toFixed(2)}%"></i>
      <i class="fb-present" style="width:${(100 - blockedPct).toFixed(2)}%"></i>
    </div>
    <div class="flow-legend">
      <div><i class="dot" style="background:var(--green)"></i><div><b>${fmt(blocked)} blocked before entry</b><p>Curation stopped these package requests at the gate. No remediation cost.</p></div></div>
      <div><i class="dot" style="background:var(--crit)"></i><div><b>${fmt(present)} present inside repositories</b><p>Xray violation occurrences that need an owner${crit ? `, ${fmt(crit)} of them critical` : ''}.</p></div></div>
    </div>
  </div>`;

  return `<div class="brief">
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-eyebrow">${esc(m.report_type || 'Weekly')} briefing · ${esc(m.date_from || '')} – ${esc(m.date_to || '')}</div>
          <h1 class="hero-line">${headline}</h1>
          <p class="hero-read">${read}</p>
        </div>
        <div class="hero-verdict ${verdict.cls}">
          <span>Posture</span>
          <b>${verdict.word}</b>
          <em>${verdict.why}</em>
          <em>${actionLine}</em>
        </div>
      </div>
      ${tiles}
      ${flow}
    </div>
  </div>`;
}
