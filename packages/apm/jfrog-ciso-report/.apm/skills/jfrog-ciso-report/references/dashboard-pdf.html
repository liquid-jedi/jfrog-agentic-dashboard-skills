const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=n=>{if(n==null||n==='')return'--';const v=Number(n);return Number.isFinite(v)?v.toLocaleString('en-US'):esc(n)};
const pctOf=(a,b)=>b?Math.round((Number(a||0)/Number(b||0))*100):0;
const cap=s=>s?String(s).charAt(0).toUpperCase()+String(s).slice(1).toLowerCase():'';
function connStats(){const cs=(DATA.platform&&DATA.platform.curation_state)||(DATA.curation&&DATA.curation.curation_state)||{};if(Number(cs.supported_remote_total)>0)return{total:cs.supported_remote_total,connected:cs.supported_connected||0,notConnected:cs.supported_not_connected||0,pct:Math.round(cs.supported_connected_pct||pctOf(cs.supported_connected,cs.supported_remote_total))};return{total:cs.remote_total||0,connected:cs.connected||0,notConnected:cs.not_connected||0,pct:Math.round(cs.connected_pct||pctOf(cs.connected,cs.remote_total))}}
function shortComp(c){c=String(c||'');c=c.replace(/^[a-z0-9.+-]+:\/\//i,'');const p=c.split(':');return p.length>=3?p.slice(-2).join(':'):(c.length>48?c.slice(0,24)+'...'+c.slice(-18):c)}
function computeActions(){const p=DATA.platform||{},v=DATA.violations||{},sev=v.by_severity||{},vei=v.executive_insights||{},cei=(DATA.curation&&DATA.curation.executive_insights)||{},cn=connStats(),acts=[];const unindexed=(p.repos_unindexed!=null)?p.repos_unindexed:(p.repos_total||0)-(p.repos_indexed||0);if(unindexed>0)acts.push({pri:'P1',effort:'Leadership decision',title:`Set an Xray indexing target for ${fmt(unindexed)} unscanned repositories`,body:`Only ${pctOf(p.repos_indexed,p.repos_total)}% of repositories are indexed. Decide the coverage target, accountable owner, and deadline for closing the visibility gap.`,metric:`${fmt(p.repos_indexed)} / ${fmt(p.repos_total)} indexed`});if(cn.notConnected>0)acts.push({pri:'P1',effort:'Leadership decision',title:`Close ${fmt(cn.notConnected)} supported Curation gaps`,body:`Supported remote repositories can still serve packages without Curation screening. Confirm whether these gaps are accepted risk or require enablement this period.`,metric:`${cn.connected}/${cn.total} remotes enabled`});if((sev.critical||0)>0)acts.push({pri:'P1',effort:'Ownership decision',title:`Confirm ownership for ${fmt(sev.critical)} critical violation instances`,body:`Critical exposure remains in indexed repositories. Keep component-level work in the full report, but ensure each critical item has an accountable remediation owner.`,metric:`${fmt(sev.critical)} critical, ${fmt(sev.high||0)} high`});const blind=vei.watch_blind_spots||[];if(blind.length)acts.push({pri:'P2',effort:'Governance decision',title:`Require watch coverage for ${fmt(blind.length)} repositories with violations`,body:`Repositories with violations and no watch reduce accountability. Decide whether every violating repository must map to an active Xray watch.`,metric:`${fmt(blind.reduce((s,r)=>s+(r.critical_count||0),0))} critical hits in blind spots`});const dry=p.curation_policies_dry_run||0;if(dry>0)acts.push({pri:'P2',effort:'Policy decision',title:`Review ${fmt(dry)} Curation policies still in Dry Run`,body:`Dry Run policies observe risk but do not block it. Decide which policies should move to enforcement after owner review.`,metric:`${fmt(p.curation_policies_block||0)} blocking, ${fmt(dry)} Dry Run`});const seen=new Set();return acts.filter(a=>{const k=a.title.toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).slice(0,4)}
(function(){const m=DATA.meta||{},p=DATA.platform||{},c=DATA.curation||{},v=DATA.violations||{},sev=v.by_severity||{},cn=connStats(),cmp=DATA.comparison||{},rr=c.request_results||{},vei=v.executive_insights||{};const clean=c.clean_packages!=null?c.clean_packages:(rr.clean_packages!=null?rr.clean_packages:c.approved||0);const without=rr.without_inspection!=null?rr.without_inspection:(c.without_inspection||0);const critDelta=cmp.available&&cmp.violations?cmp.violations.critical_delta:null;const critSub=critDelta==null?(cmp.violations_comparable===false?'Prior period not comparable':'No prior period'):critDelta===0?'Unchanged vs prior':`${fmt(Math.abs(critDelta))} ${critDelta>0?'more':'fewer'} vs prior`;let trendCls='',trendText='';if(!cmp.available){trendText='<strong>Baseline established.</strong> The next report will show period-over-period movement.'}else if(cmp.violations_comparable===false){trendText=`<strong>Violation baseline reset.</strong> ${esc(cmp.incomparable_reason||'')}`}else if(critDelta>0){trendCls='up-bad';trendText=`<strong>Critical exposure increased.</strong> Critical violation occurrences moved from ${fmt(cmp.violations.critical_previous)} to ${fmt(cmp.violations.critical)}.`}else if(critDelta<0){trendCls='dn-good';trendText=`<strong>Critical exposure decreased.</strong> Critical violation occurrences moved from ${fmt(cmp.violations.critical_previous)} to ${fmt(cmp.violations.critical)}.`}else{trendText=`<strong>Critical exposure is unchanged.</strong> ${fmt(v.total)} total violation instances remain in indexed repositories.`}const br=c.by_reason||{},blockTotal=c.blocked||1;const reasons=[['Malicious',br.malicious||0,'var(--red)'],['Security',br.security||0,'#DC2626'],['License',br.license||0,'var(--blue)'],['Operational',br.operational||0,'var(--amber)']].filter(r=>r[1]>0).map(r=>`<div class="legend-item"><span class="swatch" style="background:${r[2]}"></span><span class="l-val">${fmt(r[1])}</span><span class="l-label">${r[0]} (${pctOf(r[1],blockTotal)}%)</span></div>`).join('');const byPkg=(p.curation_state&&p.curation_state.by_package_type)||(c.curation_state&&c.curation_state.by_package_type)||[];const ecoRows=byPkg.filter(e=>e.remote_total>0).sort((a,b)=>b.remote_total-a.remote_total).slice(0,8).map(e=>{const pc=pctOf(e.connected,e.remote_total);return`<div class="bar-row"><span class="bar-label" style="width:100px;font-size:11px">${esc(e.package_type)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,pc)}%;background:${pc>=100?'var(--green)':pc>0?'var(--amber)':'var(--red)'}"></div></div><span class="bar-val" style="width:56px">${fmt(e.connected)}/${fmt(e.remote_total)}</span></div>`}).join('');const sevTotal=(sev.critical||0)+(sev.high||0)+(sev.medium||0)+(sev.low||0)||1;const sevBar=`<div class="sbar">${sev.critical?`<span style="width:${pctOf(sev.critical,sevTotal)}%;background:var(--red)">${fmt(sev.critical)}</span>`:''}${sev.high?`<span style="width:${pctOf(sev.high,sevTotal)}%;background:#EF4444">${fmt(sev.high)}</span>`:''}${sev.medium?`<span style="width:${pctOf(sev.medium,sevTotal)}%;background:var(--amber)">${fmt(sev.medium)}</span>`:''}${sev.low?`<span style="width:${pctOf(sev.low,sevTotal)}%;background:#FACC15;color:#78350F">${fmt(sev.low)}</span>`:''}</div>`;const sevLegend=[['Critical',sev.critical||0,'var(--red)'],['High',sev.high||0,'#EF4444'],['Medium',sev.medium||0,'var(--amber)'],['Low',sev.low||0,'#FACC15']].map(r=>`<div class="legend-item"><span class="swatch" style="background:${r[2]}"></span><span class="l-val">${fmt(r[1])}</span><span class="l-label">${r[0]}</span></div>`).join('');const remediation=vei.remediation_readiness||{},sla=vei.sla_risk_backlog||{},blind=vei.watch_blind_spots||[];function covBar(label,a,b,color,alert){const pc=pctOf(a,b),gap=(Number(b)||0)-(Number(a)||0);return`<div class="bar-row"><span class="bar-label">${esc(label)}</span><div class="bar-track"><div class="bar-fill" style="width:${pc}%;background:${color}"></div></div><span class="bar-val">${fmt(a)} / ${fmt(b)}</span><span class="bar-alert">${alert&&gap>0?esc(alert):''}</span></div>`}const blockP=p.curation_policies_block||0,dryP=p.curation_policies_dry_run||0;const covSection=`${covBar('Xray indexed repos',p.repos_indexed,p.repos_total,'var(--blue)',p.repos_unindexed?fmt(p.repos_unindexed)+' repos unscanned':'')}${covBar('Curation remotes',cn.connected,cn.total,'var(--green)',cn.notConnected?fmt(cn.notConnected)+' not enabled':'')}${covBar('Policies enforcing',blockP,blockP+dryP,'var(--amber)',dryP?fmt(dryP)+' in Dry Run':'')}${covBar('Active watches',p.watches_active,p.watches_total,'var(--ink-2)','')}`;const actions=computeActions().map((a,i)=>`<div class="action ${(a.pri||'P3').toLowerCase()}"><div class="action-idx">${String(i+1).padStart(2,'0')}</div><div><div class="action-title">${esc(a.title)}</div><div class="action-body">${esc(a.body)}</div><div class="action-tags"><span class="action-tag pri${a.pri==='P2'?'-p2':a.pri==='P3'?'-p3':''}">${esc(a.pri)}</span><span class="action-tag">Effort: ${esc(a.effort||'')}</span>${a.owner?`<span class="action-tag">Owner: ${esc(a.owner)}</span>`:''}${a.dueDate?`<span class="action-tag">Due: ${esc(a.dueDate)}</span>`:''}${a.metric?`<span class="action-tag">${esc(a.metric)}</span>`:''}</div></div></div>`).join('');const velocity=DATA.threat_velocity||{};const velocityRows=(velocity.periods||[]).slice(-6).map(r=>`<tr><td class="mono">${esc(r.label)}</td><td class="r num">${fmt(r.critical)}</td><td class="r num">${fmt(r.violations)}</td><td class="r num">${fmt(r.blocked)}</td></tr>`).join('');document.getElementById('report').innerHTML=[`<section class="hero"><div class="brand-lockup"><img class="brand-logo" src="${LOGO_SRC}" alt="JFrog"><div class="brand-name">JFrog Platform · Executive Security</div></div><div class="eyebrow">Security report · ${esc(m.host||m.server_id||'')}</div><h1>${esc(m.report_type||'Weekly')} Security<br><em>& Compliance Report</em></h1><p class="lede">Executive summary for the ${esc(m.window_days||7)}-day window ending ${esc(m.date_to||'')}. Focused on what JFrog blocked, what remains exposed, and which coverage decisions need leadership attention.</p><div class="hero-meta"><span><strong>Period</strong> · ${esc(m.date_from||'')} - ${esc(m.date_to||'')}</span><span><strong>Instance</strong> · ${esc(m.host||'')}</span><span><strong>Generated</strong> · ${esc(m.generated||'')}</span></div></section>`,`<div class="posture"><div class="posture-title">Security posture at a glance</div><div class="posture-grid"><div class="posture-stat"><div class="posture-val" style="color:var(--red)">${fmt(sev.critical)}</div><div class="posture-label">Critical occurrences<br>${esc(critSub)}</div></div><div class="posture-stat"><div class="posture-val" style="color:var(--green-dark)">${fmt(c.blocked||0)}</div><div class="posture-label">Blocked at gate<br>of <b>${fmt(c.total||0)}</b> requests</div></div><div class="posture-stat"><div class="posture-val">${fmt(v.total)}</div><div class="posture-label">Violation instances<br><b>${fmt(sev.high)}</b> high, <b>${fmt(sev.medium)}</b> medium</div></div><div class="posture-stat"><div class="posture-val">${pctOf(p.repos_indexed,p.repos_total)}<small>%</small></div><div class="posture-label">Xray indexed<br><b>${fmt(p.repos_indexed)}</b> of <b>${fmt(p.repos_total)}</b> repos</div></div></div><div class="posture-sub"><div class="ps-item"><strong>${fmt(c.unique_users||0)}</strong>Active users observed</div><div class="ps-item"><strong>${cn.pct}%</strong>Curation coverage</div><div class="ps-item"><strong>${fmt(p.watches_active)}</strong>Active watches</div><div class="ps-item"><strong>${fmt(p.curation_policies_block||0)}</strong>Blocking policies</div></div></div>`,`<div class="trend ${trendCls}">${trendText}</div>`,`<h2><span class="lbl">01 · Curation</span>Supply chain gate</h2><div class="metric-grid"><div class="metric-card"><strong>${fmt(clean)}</strong><span>Clean packages allowed after policy evaluation</span></div><div class="metric-card"><strong style="color:var(--green-dark)">${fmt(c.blocked||0)}</strong><span>Risky package requests blocked</span></div><div class="metric-card"><strong>${fmt(c.unique_users||0)}</strong><span>Active users observed in Curation activity</span></div><div class="metric-card"><strong>${cn.pct}%</strong><span>Supported remotes enabled for Curation</span></div></div><div class="panel-row"><div class="panel"><div class="panel-title">Blocked request reasons</div>${reasons||'<span style="color:var(--muted)">No blocked requests in this period.</span>'}</div><div class="panel"><div class="panel-title">Ecosystem coverage</div>${ecoRows||'<span style="color:var(--muted)">No ecosystem coverage data.</span>'}</div></div>`,`<h2><span class="lbl">02 · Xray</span>Residual exposure</h2><div class="posture" style="margin-bottom:24px"><div class="posture-title">Remediation readiness</div><div class="posture-grid" style="grid-template-columns:repeat(3,1fr)"><div><div class="posture-val" style="color:var(--red)">${fmt(sla.sla_breach_issues||0)}</div><div class="posture-label">SLA breaches<br>critical over ${fmt(sla.sla_days||30)} days</div></div><div><div class="posture-val" style="color:var(--green-dark)">${fmt(remediation.fix_available_issues||0)}</div><div class="posture-label">Known fix paths<br>${fmt(remediation.fix_available_hits||0)} artifact hits with fixes</div></div><div><div class="posture-val" style="color:var(--amber)">${fmt(blind.length)}</div><div class="posture-label">Watch blind spots<br>repos with violations and no watch</div></div></div></div><div class="panel-row"><div class="panel"><div class="panel-title">Severity distribution</div>${sevBar}<div class="legend">${sevLegend}</div></div><div class="panel"><div class="panel-title">Platform coverage</div>${covSection}</div></div><div class="trend"><strong>Data confidence:</strong> Coverage gaps limit confidence in the residual-risk picture. Use the full report for issue-level work queues and repository detail.</div>`,`<h2><span class="lbl">03 · Leadership attention</span>Decisions required this week</h2>${actions||'<div class="trend"><strong>No leadership decisions generated.</strong> No coverage or critical-risk decisions were triggered for this period.</div>'}`,`<h2><span class="lbl">04 · Trend</span>Threat velocity</h2>${velocity.available&&velocityRows?`<table><thead><tr><th>Period</th><th class="r">Critical</th><th class="r">Violations</th><th class="r">Gate blocks</th></tr></thead><tbody>${velocityRows}</tbody></table><p style="color:var(--muted);font-size:12px">${esc(velocity.trend_summary||'')}</p>`:'<div class="trend"><strong>Baseline required.</strong> Threat velocity appears after two validated report runs.</div>'}`,`<footer><span>${esc(m.report_type||'Weekly')} Security Report · ${esc(m.host||'')} · Generated ${esc(m.generated||'')}</span><span>Executive PDF export</span></footer>`].join('\n');document.title=`CISO Executive Security Report - ${m.host||''} - ${m.generated||''}`})();
</script>
